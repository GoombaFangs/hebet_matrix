    function selectUnit(id) {
      enterUnit(id);
    }

    function nameTaken(name, exceptId) {
      return UNITS.some(function (unit) { return unit.id !== exceptId && unit.name === name; });
    }

    function addUnit(data) {
      data = data || blankUnitDraft();
      var name = clean(data.name);
      if (!name) {
        state.unitError = "צריך שם ליחידה";
        return false;
      }
      if (nameTaken(name, "")) {
        state.unitError = "כבר יש יחידה בשם הזה";
        return false;
      }
      var digitsMessage = contactDigitsMessage(data);
      if (digitsMessage) {
        state.unitError = digitsMessage;
        return false;
      }
      var unit = normalizeUnit({
        id: nextUnitId(),
        name: name,
        quota: data.quota,
        quotaMode: data.quotaMode,
        quotaBy: data.quotaBy,
        shalishutName: data.shalishutName,
        organ: data.organ,
        gepahName: data.gepahName,
        gepahPhone: data.gepahPhone,
        officerName: data.officerName,
        officerPhone: data.officerPhone,
        ramadName: data.ramadName,
        ramadPhone: data.ramadPhone
      });
      UNITS.push(unit);
      saveUnits();
      closeUnitEditor();
      return true;
    }

    function saveUnitDetails(id, data) {
      var unit = findUnit(id);
      if (!unit) return false;
      data = data || blankUnitDraft();
      var name = clean(data.name);
      if (!name) {
        state.unitError = "צריך שם ליחידה";
        return false;
      }
      if (nameTaken(name, id)) {
        state.unitError = "כבר יש יחידה בשם הזה";
        return false;
      }
      var digitsMessage = contactDigitsMessage(data);
      if (digitsMessage) {
        state.unitError = digitsMessage;
        return false;
      }
      unit.name = name;
      UNIT_PARAMS.forEach(function (key) { unit[key] = clean(data[key]); });
      assignQuota(unit, data);
      saveUnits();
      closeUnitEditor();
      return true;
    }

    function openUnitEditor(id, button) {
      if (!id) return;
      function open() {
        state.colorUnit = "";
        state.unitEdit = id;
        state.unitDraft = unitDraftFrom(findUnit(id));
        state.unitError = "";
        render({ focusUnit: true, openEditor: true });
      }
      if (!button || !motionOk() || button.getAttribute("data-opening") === "1") {
        open();
        return;
      }
      button.setAttribute("data-opening", "1");
      button.classList.add("is-pen");
      window.setTimeout(open, 150);
    }

    function deleteUnit(id) {
      id = unitId(id);
      var unit = findUnit(id);
      if (!unit) return;
      if (UNITS.length < 2) {
        state.unitError = "צריך להשאיר לפחות יחידה אחת";
        render({ focusUnit: true });
        return;
      }
      var count = unitSoldiers(id).length;
      var message = "למחוק את " + unit.name + "?";
      if (count) message += "\n" + count + " " + countWord(count, "חייל", "חיילים") + " ביחידה יימחקו גם הם.";
      message += "\nלא ניתן לשחזר.";
      if (!window.confirm(message)) return;
      var wasViewing = !state.unitsHome && state.unit === id;
      SOLDIERS = SOLDIERS.filter(function (soldier) { return unitId(soldier.unit) !== id; });
      persist();
      UNITS = UNITS.filter(function (item) { return item.id !== id; });
      saveUnits();
      closeUnitEditor();
      if (state.selectedKey && unitIdOfKey(state.selectedKey) === "") state.selectedKey = "";
      if (state.unit === id) {
        state.unit = UNITS[0].id;
        saveUnit();
      }
      if (wasViewing) {
        showUnitsHome();
        return;
      }
      render();
    }

    function commitUnitForm(form) {
      var digitsMessage = digitsFieldMessage(form);
      if (digitsMessage) {
        state.unitDraft = readUnitForm(form);
        state.unitError = digitsMessage;
        render({ focusUnit: true });
        return;
      }
      var data = readUnitForm(form);
      state.unitDraft = data;
      if (form.getAttribute("data-unit") === "new") {
        if (!addUnit(data)) render({ focusUnit: true });
        else render();
        return;
      }
      if (saveUnitDetails(form.getAttribute("data-unit"), data)) render();
      else render({ focusUnit: true });
    }

    function stampFromDate(date) {
      return date.getDate() + "." + (date.getMonth() + 1) + "." + date.getFullYear();
    }

    function stampToDate(value) {
      var normalized = normalizeStamp(value);
      return normalized ? parseDate(normalized) : null;
    }

    function dateFieldControl(field, draft) {
      var raw = clean(draft[field.key] || "");
      var normalized = normalizeStamp(raw);
      var shown = normalized || raw;
      var empty = !shown;
      var off = field.trainedOnly && isUntrained(draft);
      return '<div class="date-field" data-date-key="' + esc(field.key) + '"' + (off ? " hidden" : "") + ">" +
        '<span class="field-label" id="date-label-' + esc(field.key) + '">' + esc(field.label) + "</span>" +
        '<button class="date-trigger' + (empty ? " is-empty" : "") + '" type="button" data-action="toggle-date" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="date-label-' + esc(field.key) + '">' +
          '<span class="date-value">' + (empty ? "בחירת תאריך" : esc(shown)) + "</span>" +
          svg("calendar", 16) +
        "</button>" +
        '<input type="hidden" name="' + esc(field.key) + '" value="' + esc(normalized || raw) + '">' +
        '<div class="date-pop" hidden role="dialog" aria-label="בחירת ' + esc(field.label) + '"></div>' +
      "</div>";
    }

    function syncTrainingDateField(form) {
      var box = form && form.elements.untrained;
      if (!form || !box) return;
      ["trainStart", "studyDate"].forEach(function (key) {
        var field = form.querySelector('[data-date-key="' + key + '"]');
        if (!field) return;
        if (box.checked) closeDateField(field);
        field.hidden = !!box.checked;
      });
      syncStudyDateFromTrain(form);
    }

    function syncStudyDateFromTrain(form) {
      if (!form) return;
      var study = form.querySelector('[data-date-key="studyDate"]');
      if (!study) return;
      var box = form.elements.untrained;
      var trainInput = form.querySelector('[data-date-key="trainStart"] input');
      var stamp = box && box.checked ? "" : studyDateFromTrain(trainInput ? trainInput.value : "");
      setDateFieldValue(study, stamp, { silent: true });
    }

    function closeDateField(field) {
      if (!field) return;
      var pop = field.querySelector(".date-pop");
      var trigger = field.querySelector(".date-trigger");
      if (pop) {
        pop.hidden = true;
        pop.innerHTML = "";
      }
      if (trigger) trigger.setAttribute("aria-expanded", "false");
      field.classList.remove("is-open");
    }

    function closeDateFields(except) {
      var fields = document.querySelectorAll(".date-field.is-open");
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] !== except) closeDateField(fields[i]);
      }
    }

    function renderDatePop(pop, viewDate, selectedDate, focusStamp) {
      var year = viewDate.getFullYear();
      var month = viewDate.getMonth();
      var firstWeekday = new Date(year, month, 1).getDay();
      var count = new Date(year, month + 1, 0).getDate();
      var today = startOfDay(new Date());
      var selectedStamp = selectedDate ? stampFromDate(selectedDate) : "";
      var todayStampValue = stampFromDate(today);
      function inMonth(stamp) {
        var date = stampToDate(stamp);
        return Boolean(date && date.getFullYear() === year && date.getMonth() === month);
      }
      var active = "";
      if (focusStamp && inMonth(focusStamp)) active = focusStamp;
      else if (selectedStamp && inMonth(selectedStamp)) active = selectedStamp;
      else if (inMonth(todayStampValue)) active = todayStampValue;
      else active = "1." + (month + 1) + "." + year;
      var cells = "";
      var pad;
      for (pad = 0; pad < firstWeekday; pad++) cells += '<span class="date-pad"></span>';
      for (var day = 1; day <= count; day++) {
        var stamp = day + "." + (month + 1) + "." + year;
        var classes = "date-day";
        if (stamp === selectedStamp) classes += " is-selected";
        if (stamp === todayStampValue) classes += " is-today";
        cells += '<button class="' + classes + '" type="button" data-action="pick-date" data-date="' + stamp + '" tabindex="' + (stamp === active ? "0" : "-1") + '"' +
          (stamp === todayStampValue ? ' aria-current="date"' : "") +
          (stamp === selectedStamp ? ' aria-pressed="true"' : "") +
          ">" + day + "</button>";
      }
      var week = ["א", "ב", "ג", "ד", "ה", "ו", "ש"].map(function (label) {
        return "<span>" + label + "</span>";
      }).join("");
      pop.dataset.mode = "days";
      pop.dataset.year = String(year);
      pop.dataset.month = String(month);
      pop.innerHTML =
        '<div class="date-nav">' +
          '<button class="date-nav-btn" type="button" data-action="date-prev" aria-label="חודש קודם">' + svg("chevron", 16) + "</button>" +
          '<div class="date-title">' +
            '<span class="date-month">' + esc(MONTHS[month]) + "</span>" +
            '<button class="date-year-btn" type="button" data-action="date-years" aria-label="בחירת שנה">' + year + svg("chevron", 14) + "</button>" +
          "</div>" +
          '<button class="date-nav-btn" type="button" data-action="date-next" aria-label="חודש הבא">' + svg("chevron", 16) + "</button>" +
        "</div>" +
        '<div class="date-week" aria-hidden="true">' + week + "</div>" +
        '<div class="date-grid">' + cells + "</div>" +
        '<div class="date-foot">' +
          '<button class="text-btn" type="button" data-action="date-today">היום</button>' +
          '<button class="text-btn" type="button" data-action="clear-date">ניקוי</button>' +
        "</div>";
    }

    var dateYearTyped = "";
    var dateYearTypeTimer = 0;

    function dateYearBounds(years) {
      var nowYear = new Date().getFullYear();
      var min = nowYear - 60;
      var max = nowYear + 60;
      years.forEach(function (value) {
        if (value < min) min = value;
        if (value > max) max = value;
      });
      return { min: min, max: max };
    }

    function focusDateControl(el) {
      if (!el) return;
      try { el.focus({ preventScroll: true }); }
      catch (err) { el.focus(); }
    }

    function scrollDateYearIntoView(button) {
      var scroller = button.parentNode;
      if (!scroller) return;
      var top = button.offsetTop - scroller.offsetTop - (scroller.clientHeight - button.offsetHeight) / 2;
      scroller.scrollTop = Math.max(0, top);
    }

    function focusDateYear(pop, year) {
      var next = pop.querySelector('.date-year[data-year="' + year + '"]');
      if (!next) return false;
      var years = pop.querySelectorAll(".date-year");
      for (var i = 0; i < years.length; i++) years[i].setAttribute("tabindex", "-1");
      next.setAttribute("tabindex", "0");
      scrollDateYearIntoView(next);
      focusDateControl(next);
      return true;
    }

    function renderYearPop(pop, viewDate, selectedDate) {
      var year = viewDate.getFullYear();
      var month = viewDate.getMonth();
      var selectedYear = selectedDate ? selectedDate.getFullYear() : null;
      var todayYear = new Date().getFullYear();
      var bounds = dateYearBounds(selectedYear == null ? [year] : [year, selectedYear]);
      var cells = "";
      var y;
      for (y = bounds.min; y <= bounds.max; y++) {
        var classes = "date-year";
        if (y === selectedYear) classes += " is-selected";
        if (y === todayYear) classes += " is-today";
        cells += '<button class="' + classes + '" type="button" data-action="pick-year" data-year="' + y + '" tabindex="' + (y === year ? "0" : "-1") + '">' + y + "</button>";
      }
      pop.dataset.mode = "years";
      pop.dataset.year = String(year);
      pop.dataset.month = String(month);
      pop.innerHTML =
        '<div class="date-nav">' +
          '<button class="text-btn" type="button" data-action="date-days">חזרה</button>' +
          "<strong>בחירת שנה</strong>" +
          '<span class="date-nav-gap" aria-hidden="true"></span>' +
        "</div>" +
        '<div class="date-years">' + cells + "</div>";
    }

    function openYearView(field) {
      var pop = field.querySelector(".date-pop");
      var input = field.querySelector("input");
      var selected = stampToDate(input ? input.value : "");
      renderYearPop(pop, new Date(Number(pop.dataset.year), Number(pop.dataset.month), 1), selected);
      placeDatePop(field);
      var active = pop.querySelector(".date-year[tabindex='0']");
      if (active) {
        scrollDateYearIntoView(active);
        focusDateControl(active);
      }
    }

    function showDateDays(field) {
      var pop = field.querySelector(".date-pop");
      var selected = stampToDate(field.querySelector("input").value);
      renderDatePop(pop, new Date(Number(pop.dataset.year), Number(pop.dataset.month), 1), selected, "");
      placeDatePop(field);
      focusDateControl(pop.querySelector(".date-day[tabindex='0']"));
    }

    function pickDateYear(field, year) {
      var pop = field.querySelector(".date-pop");
      var selected = stampToDate(field.querySelector("input").value);
      renderDatePop(pop, new Date(year, Number(pop.dataset.month), 1), selected, "");
      placeDatePop(field);
      focusDateControl(pop.querySelector(".date-day[tabindex='0']"));
    }

    function placeDatePop(field) {
      var pop = field.querySelector(".date-pop");
      var trigger = field.querySelector(".date-trigger");
      if (!pop || pop.hidden || !trigger) return;
      var rect = trigger.getBoundingClientRect();
      var margin = 8;
      var width = Math.min(280, window.innerWidth - margin * 2);
      pop.style.width = Math.round(width) + "px";
      var height = pop.offsetHeight;
      var left = rect.right - width;
      if (left < margin) left = margin;
      if (left + width > window.innerWidth - margin) left = window.innerWidth - margin - width;
      var top = rect.bottom + 6;
      if (top + height > window.innerHeight - margin) {
        var above = rect.top - height - 6;
        if (above >= margin) top = above;
      }
      pop.style.left = Math.round(left) + "px";
      pop.style.top = Math.round(top) + "px";
    }

    function openDateField(field) {
      closeDateFields(field);
      var pop = field.querySelector(".date-pop");
      var input = field.querySelector("input");
      var selected = stampToDate(input ? input.value : "");
      var view = selected || new Date();
      renderDatePop(pop, new Date(view.getFullYear(), view.getMonth(), 1), selected, "");
      pop.hidden = false;
      field.classList.add("is-open");
      var trigger = field.querySelector(".date-trigger");
      if (trigger) trigger.setAttribute("aria-expanded", "true");
      placeDatePop(field);
      var active = pop.querySelector(".date-day[tabindex='0']");
      if (active) active.focus();
    }

    function shiftDateView(field, delta) {
      var pop = field.querySelector(".date-pop");
      var year = Number(pop.dataset.year);
      var month = Number(pop.dataset.month) + delta;
      var selected = stampToDate(field.querySelector("input").value);
      renderDatePop(pop, new Date(year, month, 1), selected, "");
      placeDatePop(field);
      var active = pop.querySelector(".date-day[tabindex='0']");
      if (active) active.focus();
    }

    function setDateFieldValue(field, stamp, opts) {
      opts = opts || {};
      var input = field.querySelector("input");
      var valueEl = field.querySelector(".date-value");
      var trigger = field.querySelector(".date-trigger");
      var normalized = stamp ? normalizeStamp(stamp) : "";
      if (input) input.value = normalized;
      if (valueEl) valueEl.textContent = normalized || "בחירת תאריך";
      if (trigger) {
        trigger.classList.toggle("is-empty", !normalized);
        trigger.setAttribute("aria-expanded", "false");
        if (!opts.silent) trigger.focus();
      }
      closeDateField(field);
      if (!opts.silent && field.getAttribute("data-date-key") === "trainStart") {
        syncStudyDateFromTrain(field.closest("form"));
      }
      if (field.closest(".intake-form")) captureIntake();
    }

    function moveDateFocus(dayBtn, delta) {
      var field = dayBtn.closest(".date-field");
      var date = stampToDate(dayBtn.getAttribute("data-date"));
      if (!field || !date) return;
      date.setDate(date.getDate() + delta);
      var next = stampFromDate(date);
      var pop = field.querySelector(".date-pop");
      var sameMonth = date.getFullYear() === Number(pop.dataset.year) && date.getMonth() === Number(pop.dataset.month);
      if (!sameMonth) {
        var selected = stampToDate(field.querySelector("input").value);
        renderDatePop(pop, new Date(date.getFullYear(), date.getMonth(), 1), selected, next);
        placeDatePop(field);
      } else {
        var days = pop.querySelectorAll(".date-day");
        for (var i = 0; i < days.length; i++) days[i].setAttribute("tabindex", "-1");
      }
      var nextBtn = pop.querySelector('.date-day[data-date="' + next + '"]');
      if (nextBtn) {
        nextBtn.setAttribute("tabindex", "0");
        nextBtn.focus();
      }
    }

    function fieldControl(field, draft, opts) {
      opts = opts || {};
      if (field.date) return dateFieldControl(field, draft);
      if (field.check) {
        var on = isUntrained(draft);
        return '<label class="mark-toggle' + (field.wide ? " editor-wide" : "") + '">' +
          '<input type="checkbox" name="' + esc(field.key) + '" value="1"' + (on ? " checked" : "") + ">" +
          "<span>" + esc(field.label) + "</span>" +
        "</label>";
      }
      var raw = clean(draft[field.key] || "");
      var value = esc(raw);
      var wide = field.wide ? " editor-wide" : "";
      var required = field.required ? " required" : "";
      var control;
      if (field.unit) {
        control =
          '<select name="unit"' + (opts.optionalUnit ? "" : " required") + ">" +
            (opts.optionalUnit ? '<option value="">ללא יחידה</option>' : "") +
            UNITS.map(function (unit) {
              return '<option value="' + esc(unit.id) + '"' + (unit.id === raw ? " selected" : "") + ">" + esc(unit.name) + "</option>";
            }).join("") +
          "</select>";
      } else if (field.options) {
        control =
          '<select name="' + field.key + '"' + required + ">" +
            '<option value="">בחירה</option>' +
            field.options.map(function (option) {
              return '<option value="' + esc(option) + '"' + (option === raw ? " selected" : "") + ">" + esc(option) + "</option>";
            }).join("") +
          "</select>";
      } else if (field.cycles) {
        var choices = cycleChoices();
        var known = !raw || choices.indexOf(raw) !== -1;
        control =
          '<select name="cycle">' +
            '<option value="">בחירה</option>' +
            (choices.length
              ? '<optgroup label="מחזורים קיימים">' +
                  choices.map(function (option) {
                    return '<option value="' + esc(option) + '"' + (option === raw ? " selected" : "") + ">" + esc(option) + "</option>";
                  }).join("") +
                "</optgroup>"
              : "") +
            '<option value="__new__"' + (known ? "" : " selected") + ">מחזור חדש</option>" +
          "</select>" +
          '<input class="cycle-custom" name="cycleCustom" value="' + esc(known ? "" : raw) + '" placeholder="למשל כ״א" aria-label="מחזור חדש"' + (known ? " hidden" : "") + ">";
      } else if (field.wide) {
        control = '<textarea name="' + field.key + '" rows="2">' + value + "</textarea>";
      } else {
        var digitsOnly = field.type === "tel";
        var hint = digitsOnly ? '<span class="field-hint">רק ספרות. תו אחר לא מתקבל.</span>' : "";
        var invalid = digitsOnly && digitsInvalid(raw) ? ' class="is-invalid"' : "";
        control = '<input name="' + field.key + '"' + invalid + ' type="' + (field.type || "text") + '" value="' + value + '"' +
          (digitsOnly ? ' inputmode="numeric" autocomplete="tel" data-digits="1" pattern="[0-9]*"' : "") +
          (field.placeholder ? ' placeholder="' + esc(field.placeholder) + '"' : "") + required + ">" + hint;
      }
      return '<label class="' + wide.trim() + '"><span class="field-label">' + esc(field.label) + "</span>" + control + "</label>";
    }

    function editorLead(draft) {
      if (state.editingIndex >= 0) {
        return "השינויים יישמרו בכרטיס של " + (clean(draft.name) || "החייל") + ".";
      }
      return "החייל יישמר ב" + unitName(draft.unit || state.unit) + " ויופיע בכרטיס מלא.";
    }

    function postingLock(soldier) {
      var undo = soldier && soldier.transfers && soldier.transfers.length
        ? '<button class="btn btn-danger" type="button" data-action="undo-transfer" data-key="' + esc(keyOf(soldier)) + '">מחיקת השינוי</button>'
        : "";
      return '<div class="posting-lock editor-wide"><span class="field-label">שיבוץ נוכחי</span><strong>' + esc(currentPlacementName(soldier)) + '</strong><p>העברה ליחידה אחרת נרשמת כסבב ב׳, עם סיבה ותאריך. השיבוץ הזה נשאר במסלול.</p><div class="posting-lock-actions"><button class="btn btn-secondary" type="button" data-action="open-transfer">סבב ב׳</button>' + undo + "</div></div>";
    }

    function renderEditor(draft) {
      var editing = state.editingIndex >= 0;
      var editingSoldier = editing ? SOLDIERS[state.editingIndex] : null;
      var fields = FIELDS.map(function (field) {
        if (editing && field.unit) return postingLock(editingSoldier || draft);
        return fieldControl(field, draft);
      }).join("");
      return (
        '<form class="editor editor-form" autocomplete="off" novalidate>' +
          "<h2>" + (editing ? "עריכת חייל" : "חייל חדש") + "</h2>" +
          '<p class="editor-lead">' + esc(editorLead(draft)) + "</p>" +
          '<div class="editor-grid">' +
            '<div class="photo-field">' +
              avatarMarkup(clean(draft.name), draft.photo, { large: true, interactive: true, key: "draft" }) +
              '<div class="photo-copy"><span class="field-label">תמונה</span><span class="photo-hint">אופציונלי. בלי תמונה נשארות ראשי התיבות, והתמונה נשמרת בכרטיס.</span></div>' +
              '<input type="hidden" name="photo" value="' + esc(safePhoto(draft.photo)) + '">' +
            "</div>" +
            fields +
          "</div>" +
          '<div class="editor-actions">' +
            '<button class="btn btn-primary" type="submit">שמירה</button>' +
            '<button class="btn btn-secondary" type="button" data-action="cancel-new">ביטול</button>' +
            (editing
              ? '<button class="btn btn-danger" type="button" data-action="delete-soldier">מחיקה</button>'
              : "") +
          "</div>" +
        "</form>"
      );
    }

    function blankTransferDraft() {
      return { to: "", destination: "", reason: "", date: todayStamp() };
    }

    function reasonChips(list, selected) {
      return list.map(function (reason) {
        var on = clean(selected) === reason ? " is-on" : "";
        return '<button class="reason-pick' + on + '" type="button" data-action="pick-reason" data-reason="' + esc(reason) + '">' + esc(reason) + "</button>";
      }).join("");
    }

    function syncTransferExit(form) {
      if (!form) return;
      var exit = selectedExit(form);
      var leaving = EXIT_POSTS.indexOf(exit) !== -1;
      var arm = exit === ARM_EXIT;
      var unitWrap = form.querySelector(".transfer-unit");
      if (unitWrap) unitWrap.classList.toggle("is-aside", leaving);
      var dest = form.querySelector(".transfer-dest");
      if (dest) dest.hidden = !arm;
      var reasonLabel = form.querySelector(".reason-label");
      if (reasonLabel) reasonLabel.textContent = leaving ? "סיבת היציאה" : "סיבת המעבר";
      if (form.elements.reason) form.elements.reason.placeholder = leaving ? "למשל סיום שירות" : "למשל אי התאמה ליחידה";
      var picks = form.querySelector(".reason-picks");
      if (picks) picks.innerHTML = reasonChips(leaving ? EXIT_REASONS : TRANSFER_REASONS, form.elements.reason ? form.elements.reason.value : "");
    }

    function selectedExit(form) {
      var button = form && form.querySelector("[data-action='leave-exit'][aria-pressed='true']");
      return button ? clean(button.getAttribute("data-exit")) : "";
    }

    function captureTransfer() {
      var form = document.querySelector(".transfer-form");
      if (!form) return;
      var exit = selectedExit(form);
      state.transferDraft = {
        to: exit ? "out:" + exit : (form.elements.to ? form.elements.to.value : ""),
        destination: form.elements.destination ? form.elements.destination.value : "",
        reason: form.elements.reason ? form.elements.reason.value : "",
        date: form.elements.date ? form.elements.date.value : ""
      };
    }

    function renderTransferForm(soldier) {
      var draft = state.transferDraft || blankTransferDraft();
      var exit = draft.to.indexOf("out:") === 0 ? draft.to.slice(4) : "";
      var leaving = EXIT_POSTS.indexOf(exit) !== -1;
      var exitButtons = EXIT_POSTS.map(function (name) {
        var on = exit === name;
        return '<button class="leave-army' + (on ? " is-on" : "") + '" type="button" data-action="leave-exit" data-exit="' + esc(name) + '" aria-pressed="' + (on ? "true" : "false") + '">' + esc(name) + "</button>";
      }).join("");
      var currentId = clean(soldier.external) ? "" : unitId(soldier.unit);
      var unitOptions = UNITS.filter(function (unit) { return unit.id !== currentId; }).map(function (unit) {
        return '<option value="' + esc(unit.id) + '"' + (!leaving && draft.to === unit.id ? " selected" : "") + ">" + esc(unit.name) + "</option>";
      }).join("");
      var reasons = reasonChips(leaving ? EXIT_REASONS : TRANSFER_REASONS, draft.reason);
      var arm = exit === ARM_EXIT;
      return (
        '<form class="editor transfer-form" autocomplete="off">' +
          "<h2>שינוי שיבוץ</h2>" +
          '<p class="editor-lead">השיבוץ הנוכחי נשאר במסלול. בוחרים יחידה, יצאה מהצבא או יצאה מהזרוע, ורושמים סיבה ותאריך.</p>' +
          '<div class="transfer-current"><span class="field-label">שיבוץ נוכחי</span><strong>' + esc(currentPlacementName(soldier)) + "</strong></div>" +
          '<div class="editor-grid">' +
            '<label class="editor-wide transfer-unit' + (leaving ? " is-aside" : "") + '"><span class="field-label">סבב ב׳</span><select name="to">' +
              '<option value="">בחירה</option>' +
              '<optgroup label="יחידות">' + unitOptions + "</optgroup>" +
            "</select></label>" +
            '<div class="editor-wide leave-army-wrap"><span class="leave-or">או</span><div class="leave-army-row">' + exitButtons + "</div></div>" +
            '<label class="editor-wide transfer-dest"' + (arm ? "" : " hidden") + '><span class="field-label">לאן עבר</span><input name="destination" value="' + esc(draft.destination || "") + '" placeholder="למשל חיל האוויר" autocomplete="off"></label>' +
            '<div class="editor-wide"><label><span class="field-label reason-label">' + (leaving ? "סיבת היציאה" : "סיבת המעבר") + '</span><input name="reason" required value="' + esc(draft.reason || "") + '" placeholder="' + (leaving ? "למשל סיום שירות" : "למשל אי התאמה ליחידה") + '"></label><div class="reason-picks" role="group" aria-label="סיבות נפוצות">' + reasons + "</div></div>" +
            '<label><span class="field-label">תאריך המעבר</span><input name="date" inputmode="numeric" required value="' + esc(draft.date || "") + '" placeholder="28.9.2026"></label>' +
          "</div>" +
          (state.transferError ? '<p class="form-error">' + esc(state.transferError) + "</p>" : "") +
          '<div class="editor-actions">' +
            '<button class="btn btn-primary" type="submit">שמירת השיבוץ</button>' +
            '<button class="btn btn-secondary" type="button" data-action="cancel-transfer">ביטול</button>' +
          "</div>" +
        "</form>"
      );
    }

    function findSoldierIndex(key) {
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (keyOf(SOLDIERS[i]) === key) return i;
      }
      return -1;
    }

    function openTransfer(key) {
      if (key) state.selectedKey = key;
      if (findSoldierIndex(state.selectedKey) < 0) return;
      state.creating = false;
      state.editingIndex = -1;
      state.transferring = true;
      state.transferError = "";
      state.transferDraft = blankTransferDraft();
      state.profileOpen = true;
      state.shalishutOpen = false;
      closeShalishutEditor();
      render({ focusTransfer: true });
    }

    function closeTransfer() {
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      render();
    }

    function placementBeforeMove(move) {
      var fromId = unitId(move && move.fromId);
      var fromName = clean(move && move.fromName);
      if (fromId) return { unit: fromId, external: "" };
      if (fromName && fromName !== "ללא שיבוץ") return { unit: "", external: fromName };
      return { unit: "", external: "" };
    }

    function showRestoredSoldier(soldier) {
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.logOpen = false;
      state.unitsHome = false;
      state.shalishutOpen = false;
      closeShalishutEditor();
      state.selectedKey = keyOf(soldier);
      state.profileOpen = true;
      state.prevKey = "";
      var placed = unitId(soldier.unit);
      if (!placed) {
        state.outsideOpen = true;
        state.releasedOpen = false;
        render({ scroll: true });
        return;
      }
      state.outsideOpen = false;
      state.releasedOpen = isReleased(soldier);
      if (state.unit !== placed) {
        state.unit = placed;
        saveUnit();
      }
      document.getElementById("search").value = "";
      document.getElementById("filter-profession").value = "";
      document.getElementById("filter-cycle").value = "";
      document.getElementById("filter-grade").value = "";
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-tatash").value = "";
      render({ scroll: true });
    }

    function undoLastTransfer(key, stayOnLog) {
      var index = findSoldierIndex(key);
      if (index < 0) return;
      var soldier = SOLDIERS[index];
      var transfers = soldier.transfers || [];
      if (!transfers.length) return;
      var move = transfers[transfers.length - 1];
      var back = placementBeforeMove(move);
      var name = clean(soldier.name) || "החייל";
      var where = back.external || (back.unit ? unitName(back.unit) : "");
      var backText = where ? "החייל יחזור אל " + where + "." : "החייל יחזור למצב ללא שיבוץ.";
      if (!window.confirm("למחוק את שינוי השיבוץ האחרון של " + name + "? " + backText)) return;
      var previousUnit = soldier.unit;
      var previousExternal = soldier.external;
      transfers.pop();
      soldier.transfers = transfers;
      soldier.unit = back.unit;
      soldier.external = back.external;
      try {
        persist();
      } catch (err) {
        transfers.push(move);
        soldier.transfers = transfers;
        soldier.unit = previousUnit;
        soldier.external = previousExternal;
        window.alert("לא הצלחנו לשמור את המחיקה.");
        return;
      }
      if (stayOnLog && state.logOpen) {
        render();
        return;
      }
      showRestoredSoldier(soldier);
    }

    function commitTransfer(form) {
      var index = findSoldierIndex(state.selectedKey);
      if (index < 0) return;
      var soldier = SOLDIERS[index];
      var exitChoice = selectedExit(form);
      var to = exitChoice ? "out:" + exitChoice : clean(form.elements.to.value);
      var destination = exitChoice === ARM_EXIT ? clean(form.elements.destination ? form.elements.destination.value : "") : "";
      var reason = clean(form.elements.reason.value);
      var date = normalizeStamp(form.elements.date.value);
      state.transferDraft = { to: to, destination: destination, reason: reason, date: form.elements.date.value };
      if (!to) {
        state.transferError = "בחרו יחידה, יצאה מהצבא או יצאה מהזרוע";
        render({ focusTransfer: true });
        return;
      }
      var external = to.indexOf("out:") === 0;
      var toId = "";
      var toName = "";
      if (external) {
        toName = to.slice(4);
        if (exitChoice === ARM_EXIT && destination) toName = ARM_EXIT + " · " + destination;
        if (!toName) {
          state.transferError = "כתבו את שם היעד";
          render({ focusTransfer: true });
          return;
        }
      } else {
        toId = unitId(to);
        toName = toId ? unitName(toId) : "";
        if (!toId || !toName) {
          state.transferError = "היחידה לא נמצאה";
          render({ focusTransfer: true });
          return;
        }
      }
      var fromExternal = clean(soldier.external);
      var fromId = fromExternal ? "" : unitId(soldier.unit);
      var fromName = fromExternal || unitName(fromId) || "ללא שיבוץ";
      if ((!external && !fromExternal && toId === fromId) || (external && toName === fromExternal)) {
        state.transferError = "זה השיבוץ הנוכחי. בחרו שיבוץ אחר.";
        render({ focusTransfer: true });
        return;
      }
      if (!reason) {
        state.transferError = "רשמו את סיבת המעבר";
        render({ focusTransfer: true });
        return;
      }
      if (!date) {
        state.transferError = "תאריך בפורמט 28.9.2026";
        render({ focusTransfer: true });
        return;
      }
      if (!soldier.transfers) soldier.transfers = [];
      soldier.transfers.push({
        fromId: fromId,
        fromName: fromName,
        toId: external ? "" : toId,
        toName: toName,
        destination: destination,
        external: external,
        reason: reason,
        date: date
      });
      if (external) {
        soldier.unit = "";
        soldier.external = toName;
      } else {
        soldier.unit = toId;
        soldier.external = "";
      }
      persist();
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.selectedKey = keyOf(soldier);
      state.profileOpen = true;
      state.creating = false;
      state.editingIndex = -1;
      if (external) {
        state.logOpen = false;
        state.unitsHome = false;
        state.outsideOpen = true;
        state.outsideKind = "departed";
        state.prevKey = "";
        render({ scroll: true });
        return;
      }
      state.logOpen = false;
      state.outsideOpen = false;
      state.unitsHome = false;
      state.prevKey = "";
      if (state.unit !== soldier.unit) {
        state.unit = soldier.unit;
        saveUnit();
      }
      document.getElementById("search").value = "";
      document.getElementById("filter-profession").value = "";
      document.getElementById("filter-cycle").value = "";
      document.getElementById("filter-grade").value = "";
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-tatash").value = "";
      render({ scroll: true });
    }

    function transferRows() {
      var rows = [];
      var order = 0;
      SOLDIERS.forEach(function (soldier) {
        (soldier.transfers || []).forEach(function (move) {
          rows.push({ soldier: soldier, move: move, order: order });
          order += 1;
        });
      });
      rows.sort(function (a, b) {
        var da = parseDate(a.move.date);
        var db = parseDate(b.move.date);
        var ta = da ? da.getTime() : 0;
        var tb = db ? db.getTime() : 0;
        if (ta !== tb) return tb - ta;
        return b.order - a.order;
      });
      return rows;
    }

    function studyDueSoldiers() {
      return SOLDIERS.filter(function (soldier) {
        return needsStudyDay(soldier) && !noticeDismissed(studyAlertId(soldier));
      }).sort(function (a, b) {
        var byCycle = compareHe(clean(a.cycle) || "ללא מחזור", clean(b.cycle) || "ללא מחזור");
        if (byCycle) return byCycle;
        var da = stampToDate(a.trainStart);
        var db = stampToDate(b.trainStart);
        var ta = da ? da.getTime() : 0;
        var tb = db ? db.getTime() : 0;
        if (ta !== tb) return ta - tb;
        return compareHe(a.name || "", b.name || "");
      });
    }

    function studyCycleGroups(list) {
      var map = new Map();
      list.forEach(function (soldier) {
        var key = clean(soldier.cycle) || "ללא מחזור";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(soldier);
      });
      return Array.from(map.keys()).sort(function (a, b) {
        if (a === "ללא מחזור") return 1;
        if (b === "ללא מחזור") return -1;
        return compareHe(a, b);
      }).map(function (key) {
        var items = map.get(key).slice().sort(function (a, b) {
          var da = stampToDate(a.trainStart);
          var db = stampToDate(b.trainStart);
          var ta = da ? da.getTime() : 0;
          var tb = db ? db.getTime() : 0;
          if (ta !== tb) return ta - tb;
          return compareHe(a.name || "", b.name || "");
        });
        var dates = [];
        items.forEach(function (soldier) {
          var date = trainingDate(soldier);
          if (date && dates.indexOf(date) === -1) dates.push(date);
        });
        return { key: key, items: items, dates: dates };
      });
    }

    function renderStudyCycleLog(list) {
      return '<div class="log-cycles">' + studyCycleGroups(list).map(function (group) {
        var shared = group.dates.length === 1 ? group.dates[0] : "";
        var dateNote = shared
          ? "הכשרה " + shared
          : group.dates.length > 1
            ? "תאריכי הכשרה שונים"
            : "";
        var people = group.items.map(function (soldier) {
          return '<div class="log-person">' +
            '<div class="log-person-who">' + logWho(soldier) + "</div>" +
            '<div class="log-person-place">' + esc(logPlace(soldier)) + "</div>" +
            '<div class="log-person-done">' + studyDoneBox(soldier) + dismissNoticeButton(studyAlertId(soldier), soldier.name) + "</div>" +
            (shared ? "" : '<div class="log-person-date">' + esc(trainingDate(soldier)) + "</div>") +
          "</div>";
        }).join("");
        return '<section class="log-cycle">' +
          '<header class="log-cycle-head">' +
            "<strong>" + esc(cycleLabel(group.key)) + "</strong>" +
            '<span class="pill-count">' + group.items.length + "</span>" +
            (dateNote ? '<span class="log-cycle-date">' + esc(dateNote) + "</span>" : "") +
            '<span class="flag flag-study-due">צריך יום עיון</span>' +
            '<span class="log-cycle-actions">' +
              '<button class="text-btn text-btn-danger" type="button" data-action="dismiss-study-cycle" data-cycle="' + esc(group.key) + '" aria-label="' + esc("מחיקת ההתראה של " + cycleLabel(group.key)) + '">מחיקת ההתראה</button>' +
              '<label class="study-done"><input type="checkbox" data-action="study-done-cycle" aria-label="' + esc("יום העיון של " + cycleLabel(group.key) + " בוצע") + '"><span>המחזור ביצע</span></label>' +
            "</span>" +
          "</header>" +
          '<div class="log-people">' + people + "</div>" +
        "</section>";
      }).join("") + "</div>";
    }

    function releaseSoonSoldiers() {
      return SOLDIERS.filter(function (soldier) {
        return releaseSoon(soldier) && !noticeDismissed(soonAlertId(soldier));
      }).sort(function (a, b) {
        var da = releaseDayCount(a);
        var db = releaseDayCount(b);
        if (da !== db) return da - db;
        return compareHe(a.name || "", b.name || "");
      });
    }

    function releasedLogSoldiers() {
      return SOLDIERS.filter(function (soldier) {
        return isReleased(soldier) && !noticeDismissed(releaseAlertId(soldier));
      }).sort(function (a, b) {
        var aKey = releaseKey(a.tatash);
        var bKey = releaseKey(b.tatash);
        if (aKey !== bKey) return aKey < bKey ? 1 : -1;
        return compareHe(a.name || "", b.name || "");
      });
    }

    function logQueryHit(parts, query) {
      if (!query) return true;
      return parts.map(function (value) { return clean(value).toLowerCase(); }).join(" ").indexOf(query) !== -1;
    }

    function logPlace(soldier) {
      if (clean(soldier.external)) return clean(soldier.external);
      if (!unitId(soldier.unit)) return "ללא יחידה";
      return unitName(soldier.unit);
    }

    function logWho(soldier) {
      var outside = Boolean(clean(soldier.external)) || !unitId(soldier.unit);
      var name = esc(clean(soldier.name) || "ללא שם");
      var who = outside
        ? "<span>" + name + "</span>"
        : '<button class="log-jump" type="button" data-action="open-posted" data-key="' + esc(keyOf(soldier)) + '">' + name + "</button>";
      var sub = [clean(soldier.profession), clean(soldier.personalId)].filter(Boolean).join(" · ");
      if (clean(soldier.external)) sub = (sub ? sub + " · " : "") + "מחוץ ליחידות";
      return who + (sub ? '<span class="log-sub">' + esc(sub) + "</span>" : "");
    }

    function openLog() {
      state.logOpen = true;
      state.logQuery = "";
      state.logTab = "transfers";
      state.creating = false;
      state.editingIndex = -1;
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.shalishutOpen = false;
      closeShalishutEditor();
      render({ focusLogSearch: true });
    }

    function closeLog() {
      state.logOpen = false;
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.logQuery = "";
      state.logTab = "transfers";
      render();
    }

    function openPosted(key) {
      var soldier = findSoldier(SOLDIERS, key);
      if (!soldier || clean(soldier.external) || !unitId(soldier.unit)) return;
      state.logOpen = false;
      state.outsideOpen = false;
      state.releasedOpen = isReleased(soldier);
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.unitsHome = false;
      state.unit = unitId(soldier.unit);
      saveUnit();
      state.selectedKey = keyOf(soldier);
      state.prevKey = "";
      state.profileOpen = true;
      state.creating = false;
      state.editingIndex = -1;
      document.getElementById("search").value = "";
      document.getElementById("filter-profession").value = "";
      document.getElementById("filter-cycle").value = "";
      document.getElementById("filter-grade").value = "";
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-tatash").value = "";
      render({ scroll: true });
    }

    function renderTransferLog(opts) {
      opts = opts || {};
      if (state.transferring) captureTransfer();
      document.body.classList.remove("home-query");
      document.getElementById("add-btn").hidden = true;
      document.getElementById("profile").setAttribute("aria-label", "יומן");
      var profile = document.getElementById("profile");
      if (state.transferring) {
        var editingSoldier = findSoldier(SOLDIERS, state.selectedKey);
        profile.innerHTML = editingSoldier
          ? renderTransferForm(editingSoldier)
          : '<div class="log-empty">החייל לא נמצא</div>';
        document.getElementById("print-root").innerHTML = "";
        document.title = "שינוי שיבוץ · " + CONFIG.title;
        if (opts.focusTransfer) {
          var focusTo = profile.querySelector("[name='to']");
          if (focusTo) focusTo.focus();
        }
        return;
      }
      var tabs = [
        { id: "transfers", label: "מעברים" },
        { id: "study", label: "ימי עיון" },
        { id: "soon", label: "לפני שחרור" },
        { id: "releases", label: "שחרורים" }
      ];
      var tab = state.logTab;
      if (!tabs.some(function (item) { return item.id === tab; })) tab = "transfers";
      state.logTab = tab;
      var unseenStudy = tab === "study" ? 0 : unseenStudyNotices().length;
      if (tab === "study") acknowledgeStudyNotices();
      var unseenSoon = tab === "soon" ? 0 : unseenReleaseSoon().length;
      if (tab === "soon") acknowledgeReleaseSoon();
      var query = clean(state.logQuery).toLowerCase();
      var moves = transferRows();
      var studyAll = studyDueSoldiers();
      var soonAll = releaseSoonSoldiers();
      var releasedAll = releasedLogSoldiers();
      var counts = {
        transfers: moves.length,
        study: studyCycleGroups(studyAll).length,
        soon: soonAll.length,
        releases: releasedAll.length
      };
      var summary = "";
      var note = "";
      var placeholder = "חייל, יחידה או מקצוע";
      var table = "";
      if (tab === "study") {
        var studyRows = studyAll.filter(function (soldier) {
          return logQueryHit([soldier.name, soldier.personalId, soldier.profession, soldier.cycle, logPlace(soldier), soldier.trainStart], query);
        });
        var studyGroups = studyCycleGroups(studyRows);
        summary = studyGroups.length
          ? (query ? "מוצגים " + studyGroups.length + " מחזורים מתוך " + counts.study : studyGroups.length + " " + countWord(studyGroups.length, "מחזור צריך יום עיון", "מחזורים צריכים יום עיון") + " · " + studyRows.length + " " + countWord(studyRows.length, "חייל", "חיילים"))
          : "אין מחזורים שצריכים יום עיון";
        note = "יום עיון משותף למחזור, 10 חודשים אחרי תחילת ההכשרה. «בוצע» מסמן שהיום נעשה. מחיקה מסירה רק את ההתראה מהיומן, ואפשר גם להשאיר אותה.";
        placeholder = "מחזור, חייל או יחידה";
        table = studyGroups.length
          ? renderStudyCycleLog(studyRows)
          : '<div class="log-empty">' + (counts.study ? "אין מחזורים תואמים" : "כשמגיע תאריך יום העיון, 10 חודשים אחרי תחילת ההכשרה, המחזור מופיע כאן.") + "</div>";
      } else if (tab === "soon") {
        var soonRows = soonAll.filter(function (soldier) {
          var days = releaseDayCount(soldier);
          return logQueryHit([soldier.name, soldier.personalId, soldier.profession, logPlace(soldier), soldier.tatash, days == null ? "" : relativeDay(days)], query);
        });
        summary = counts.soon
          ? (query ? "מוצגים " + soonRows.length + " מתוך " + counts.soon : counts.soon + " " + countWord(counts.soon, "חייל לפני שחרור", "חיילים לפני שחרור"))
          : "אין חיילים לפני שחרור";
        note = "חייל שתאריך התת״ש שלו בתוך חודש מופיע כאן, כדי לתכנן שיבוץ לפני שהמקום בתקן מתפנה. אפשר למחוק התראה אחרי שקוראים, או להשאיר אותה עד יום השחרור.";
        placeholder = "חייל, יחידה או תת״ש";
        table = soonRows.length
          ? '<div class="transfer-log-wrap"><table class="transfer-log"><thead><tr><th>חייל</th><th>יחידה</th><th>תת״ש</th><th>נשאר</th><th></th></tr></thead><tbody>' +
            soonRows.map(function (soldier) {
              var days = releaseDayCount(soldier);
              return "<tr><td>" + logWho(soldier) + "</td><td>" + esc(logPlace(soldier)) + "</td><td>" + esc(clean(soldier.tatash)) + '</td><td><span class="flag flag-release-soon">' + esc(days == null ? "" : relativeDay(days)) + "</span></td><td>" + dismissNoticeButton(soonAlertId(soldier), soldier.name) + "</td></tr>";
            }).join("") +
            "</tbody></table></div>"
          : '<div class="log-empty">' + (counts.soon ? "אין חיילים תואמים" : "אין חיילים שמשתחררים בחודש הקרוב.") + "</div>";
      } else if (tab === "releases") {
        var releaseRows = releasedAll.filter(function (soldier) {
          return logQueryHit([soldier.name, soldier.personalId, soldier.profession, logPlace(soldier), soldier.tatash], query);
        });
        summary = counts.releases
          ? (query ? "מוצגים " + releaseRows.length + " מתוך " + counts.releases : counts.releases + " " + countWord(counts.releases, "משוחרר", "משוחררים"))
          : "אין משוחררים";
        note = "חייל שתאריך התת״ש שלו הגיע מסומן כאן, והמקום שלו בתקן מתפנה. אפשר למחוק את השורה מהיומן, או להשאיר אותה. החייל נשאר משוחרר.";
        placeholder = "חייל, יחידה או תת״ש";
        table = releaseRows.length
          ? '<div class="transfer-log-wrap"><table class="transfer-log"><thead><tr><th>חייל</th><th>יחידה</th><th>תת״ש</th><th>סטטוס</th><th></th></tr></thead><tbody>' +
            releaseRows.map(function (soldier) {
              return "<tr><td>" + logWho(soldier) + "</td><td>" + esc(logPlace(soldier)) + "</td><td>" + esc(clean(soldier.tatash)) + '</td><td><span class="flag flag-released">משוחרר</span></td><td>' + dismissNoticeButton(releaseAlertId(soldier), soldier.name) + "</td></tr>";
            }).join("") +
            "</tbody></table></div>"
          : '<div class="log-empty">' + (counts.releases ? "אין משוחררים תואמים" : "חייל שתאריך התת״ש שלו הגיע מופיע כאן.") + "</div>";
      } else {
        var rows = moves.filter(function (row) {
          return logQueryHit([
            row.soldier.name, row.soldier.personalId, row.soldier.profession,
            row.move.fromName, row.move.toName, row.move.reason, row.move.date
          ], query);
        });
        summary = counts.transfers
          ? (query ? "מוצגים " + rows.length + " מתוך " + counts.transfers : counts.transfers + " " + countWord(counts.transfers, "מעבר", "מעברים"))
          : "עדיין אין מעברים";
        note = "מחיקת השינוי האחרון מחזירה את החייל לשיבוץ שממנו יצא.";
        placeholder = "חייל, יחידה או סיבה";
        var body = rows.map(function (row) {
          var soldier = row.soldier;
          var outside = Boolean(clean(soldier.external));
          var again = outside
            ? '<button class="text-btn" type="button" data-action="open-transfer" data-key="' + esc(keyOf(soldier)) + '">סבב ב׳</button>'
            : "";
          var history = soldier.transfers || [];
          var latest = history.length && history[history.length - 1] === row.move;
          var undo = latest
            ? '<button class="text-btn text-btn-danger" type="button" data-action="undo-transfer" data-stay="log" data-key="' + esc(keyOf(soldier)) + '">מחיקה</button>'
            : "";
          return "<tr><td>" + logWho(soldier) + again + "</td><td>" + esc(row.move.fromName) + "</td><td>" + esc(row.move.toName) + "</td><td class=\"log-reason\">" + esc(row.move.reason) + "</td><td>" + esc(row.move.date) + "</td><td>" + undo + "</td></tr>";
        }).join("");
        table = rows.length
          ? '<div class="transfer-log-wrap"><table class="transfer-log"><thead><tr><th>חייל</th><th>שיבוץ קודם</th><th>סבב ב׳</th><th>סיבה</th><th>תאריך</th><th></th></tr></thead><tbody>' + body + "</tbody></table></div>"
          : '<div class="log-empty">' + (counts.transfers ? "אין מעברים תואמים" : "סבב ב׳ נרשם מכרטיס החייל. השיבוץ הקודם נשאר במסלול, עם סיבת המעבר.") + "</div>";
      }
      var tabButtons = tabs.map(function (item) {
        var on = item.id === tab;
        var alerted = (item.id === "study" && unseenStudy) || (item.id === "soon" && unseenSoon);
        var dot = alerted ? '<span class="notice-dot" aria-hidden="true"></span>' : "";
        return '<button class="log-tab' + (on ? " is-on" : "") + '" type="button" role="tab" id="log-tab-' + item.id + '" data-action="log-tab" data-tab="' + item.id + '" aria-selected="' + (on ? "true" : "false") + '" aria-controls="log-panel">' +
          dot + esc(item.label) + '<span class="log-tab-count">' + counts[item.id] + "</span></button>";
      }).join("");
      profile.innerHTML =
        '<div class="units-board">' +
          '<div class="log-head"><div><button class="text-btn" type="button" data-action="close-log">חזרה</button><h2>יומן</h2><p>' + esc(summary) + ". " + esc(note) + "</p></div>" +
          '<input class="log-search" id="log-search" type="search" value="' + esc(state.logQuery) + '" placeholder="' + esc(placeholder) + '" aria-label="חיפוש ביומן">' +
          "</div>" +
          '<div class="log-tabs" role="tablist" aria-label="מדורי היומן">' + tabButtons + "</div>" +
          '<div id="log-panel" role="tabpanel" aria-labelledby="log-tab-' + tab + '">' + table + "</div>" +
        "</div>";
      document.getElementById("print-root").innerHTML = "";
      document.title = "יומן · " + CONFIG.title;
      syncHash("");
      var search = document.getElementById("log-search");
      if (search && opts.focusLogSearch) {
        search.focus();
        var pos = search.value.length;
        if (search.setSelectionRange) search.setSelectionRange(pos, pos);
      }
      if (opts.focusStudy) focusStudyBox(opts.focusStudy);
      var announce = "יומן. " + summary;
      if (state.announced !== announce) {
        state.announced = announce;
        document.getElementById("live").textContent = announce;
      }
    }

    function draftFromSoldier(soldier) {
      var draft = blankDraft();
      FIELDS.forEach(function (field) {
        draft[field.key] = clean(soldier[field.key] || "");
      });
      draft.unit = unitId(soldier.unit) || state.unit;
      draft.photo = safePhoto(soldier.photo);
      if (!isUntrained(draft) && present(draft.trainStart) && !present(draft.studyDate)) {
        draft.studyDate = studyDateFromTrain(draft.trainStart);
      }
      return draft;
    }

    function openCreator() {
      state.creating = true;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.shalishutOpen = false;
      closeShalishutEditor();
      state.profileOpen = true;
      render({ focusEditor: true, freshDraft: true });
    }

    function openSoldierEditor() {
      var soldier = null;
      var index = -1;
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (keyOf(SOLDIERS[i]) === state.selectedKey && soldierInView(SOLDIERS[i])) {
          soldier = SOLDIERS[i];
          index = i;
          break;
        }
      }
      if (!soldier) return;
      state.creating = false;
      state.editingIndex = index;
      state.draft = draftFromSoldier(soldier);
      state.shalishutOpen = false;
      closeShalishutEditor();
      state.profileOpen = true;
      render({ focusEditor: true, freshDraft: true });
    }

    function closeCreator() {
      var stayOnProfile = state.editingIndex >= 0;
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      if (!stayOnProfile) state.profileOpen = false;
      render();
    }

    function deleteEditingSoldier() {
      var index = state.editingIndex;
      if (index < 0 || index >= SOLDIERS.length) return;
      var soldier = SOLDIERS[index];
      var name = clean(soldier.name) || "החייל";
      if (!window.confirm("למחוק את " + name + "? לא ניתן לשחזר את הכרטיס.")) return;
      var removedUnit = unitId(soldier.unit) || state.unit;
      SOLDIERS.splice(index, 1);
      persist();
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.profileOpen = true;
      var next = null;
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (soldierInView(SOLDIERS[i], removedUnit)) {
          next = SOLDIERS[i];
          break;
        }
      }
      state.selectedKey = next ? keyOf(next) : "";
      render();
    }

    function render(opts) {
      opts = opts || {};
      hideHitPop();
      var openPalette = document.getElementById("color-palette");
      if (openPalette) openPalette.remove();
      syncShell();
      if (state.logOpen) {
        renderTransferLog(opts);
        return;
      }
      if (state.unitsHome) {
        renderUnitsHome(opts);
        return;
      }
      document.body.classList.remove("home-query");
      document.getElementById("add-btn").hidden = state.transferring;
      document.getElementById("profile").setAttribute("aria-label", "רשימת חיילים");
      if (!unitId(state.unit)) state.unit = UNITS[0].id;
      renderUnitSide();
      var editing = state.editingIndex >= 0;
      if ((state.creating || editing) && !opts.freshDraft) captureDraft();
      if (state.editingShalishut) captureShalishut();
      var queryRaw = clean(document.getElementById("search").value);
      var query = queryRaw.toLowerCase();
      var filters = {
        profession: document.getElementById("filter-profession").value,
        cycle: document.getElementById("filter-cycle").value,
        grade: document.getElementById("filter-grade").value,
        date: document.getElementById("filter-date").value,
        tatash: document.getElementById("filter-tatash").value
      };
      var view = SOLDIERS.filter(function (soldier) { return soldierInView(soldier); });

      fillSelect(document.getElementById("filter-profession"), valuesOf(view, "profession"), "כל המקצועות");
      fillSelect(document.getElementById("filter-cycle"), valuesOf(view, "cycle"), "כל המחזורים");
      fillSelect(document.getElementById("filter-grade"), valuesOf(view, "grade"), "כל המדרגים");
      fillSelect(document.getElementById("filter-date"), view.map(effectiveStudyStamp), "כל התאריכים");
      ["filter-profession", "filter-cycle", "filter-grade", "filter-date", "filter-tatash"].forEach(function (id) {
        var el = document.getElementById(id);
        el.classList.toggle("is-active", el.value !== "");
      });

      var placeLabel = state.outsideOpen ? (state.outsideKind === "fresh" ? "חיילים חדשים ללא יחידה" : "ללא יחידה") : (state.releasedOpen ? unitName(state.unit) + " · משוחררים" : unitName(state.unit));
      var inUnit = view.length;
      var visibleTotal = view.length;
      var professions = new Set(valuesOf(view, "profession")).size;
      var stats = placeLabel + " · " + inUnit + " " + countWord(inUnit, state.releasedOpen ? "משוחרר" : "חייל", state.releasedOpen ? "משוחררים" : "חיילים") + " · " + professions + " " + countWord(professions, "מקצוע", "מקצועות");
      var filtered = view.filter(function (soldier) { return matches(soldier, query, filters); });
      var active = Boolean(query || filters.profession || filters.cycle || filters.grade || filters.date || filters.tatash);
      var result = document.getElementById("result-line");
      var clearBtn = document.getElementById("clear-btn");

      if (!SOLDIERS.length) {
        result.textContent = "המבנה מוכן להזנת חיילים";
        clearBtn.hidden = true;
      } else if (!visibleTotal) {
        result.textContent = "אין חיילים ב" + placeLabel;
        clearBtn.hidden = true;
      } else if (!filtered.length) {
        var elsewhere = matchesElsewhere(query, filters);
        result.textContent = elsewhere
          ? (state.outsideOpen ? "אין תוצאות ברשימה הזו · " : "אין תוצאות ביחידה הזו · ") + elsewhere
          : "אין תוצאות לסינון הזה";
        clearBtn.hidden = !active;
      } else if (active) {
        var note = filters.tatash ? "תת״ש: " + releaseLabel(filters.tatash) + " · " : "";
        result.textContent = note + "מוצגים " + filtered.length + " מתוך " + visibleTotal;
        clearBtn.hidden = false;
      } else {
        result.textContent = stats;
        clearBtn.hidden = true;
      }

      if (state.transferring && !opts.focusTransfer) captureTransfer();
      var keys = filtered.map(keyOf);
      if (!state.transferring && keys.indexOf(state.selectedKey) === -1) state.selectedKey = keys[0] || "";
      var selectionChanged = state.selectedKey !== state.prevKey;

      var listEl = document.getElementById("list");
      listEl.hidden = true;
      listEl.innerHTML = "";
      var rosterBody = document.querySelector(".roster-body");
      if (rosterBody) rosterBody.classList.remove("has-list");

      var profile = document.getElementById("profile");
      var soldier = findSoldier(filtered, state.selectedKey);
      var narrow = window.matchMedia("(max-width: 860px)").matches;
      var mainHtml = "";
      if (state.creating || editing) {
        mainHtml = renderEditor(state.draft || blankDraft());
      } else if (state.transferring) {
        var transferSoldier = findSoldier(SOLDIERS, state.selectedKey);
        mainHtml = transferSoldier ? renderTransferForm(transferSoldier) : emptyProfile("none");
      } else if (!SOLDIERS.length) {
        mainHtml = emptyProfile("nodata");
      } else if (!visibleTotal) {
        mainHtml = emptyProfile("unit");
      } else if (!soldier) {
        mainHtml = emptyProfile("none");
      } else {
        mainHtml = renderDirectory(filtered, { interactive: true, query: queryRaw });
      }
      var profileScroll = opts.keepProfileScroll ? profile.scrollTop : 0;
      profile.innerHTML = mainHtml;
      if (opts.keepProfileScroll) {
        holdProfileSpy();
        profile.scrollTop = profileScroll;
      }
      if (opts.focusList) {
        var currentRow = profile.querySelector(".dir-row[aria-current='true']");
        if (currentRow) currentRow.focus({ preventScroll: true });
      }
      if (opts.focusSort) {
        var sortFocus = profile.querySelector('.dir-sort[data-sort="' + opts.focusSort + '"]');
        if (sortFocus) sortFocus.focus({ preventScroll: true });
      }
      if (opts.focusRoutes) {
        var routesFocus = profile.querySelector(".dir-columns [data-action='toggle-routes']") || profile.querySelector("[data-action='toggle-routes']");
        if (routesFocus) routesFocus.focus({ preventScroll: true });
      }
      if (opts.focusStudy) focusStudyBox(opts.focusStudy);
      if ((state.creating || editing) && opts.focusEditor) {
        var focusField = profile.querySelector('[name="' + (editing ? "name" : "profession") + '"]');
        if (focusField) focusField.focus();
      }
      if (state.transferring && opts.focusTransfer) {
        var focusTo = profile.querySelector("[name='to']");
        if (focusTo) focusTo.focus();
      }
      if (selectionChanged && !opts.keepProfileScroll && !state.creating && !editing && !state.transferring && !opts.focusShalishut) {
        var frames = profile.querySelectorAll("[data-soldier]");
        var target = null;
        for (var frameIndex = 0; frameIndex < frames.length; frameIndex++) {
          if (frames[frameIndex].getAttribute("data-soldier") === state.selectedKey) target = frames[frameIndex];
        }
        if (target) {
          holdProfileSpy();
          target.scrollIntoView({ block: "start" });
        } else profile.scrollTop = 0;
      }

      var summary = filterSummary(filters, queryRaw);
      var printWord = state.releasedOpen ? ["משוחרר", "משוחררים"] : ["חייל", "חיילים"];
      var printLabel = filtered.length + " " + countWord(filtered.length, printWord[0], printWord[1]);
      document.getElementById("print-root").innerHTML =
        '<header class="print-mast"><img class="print-logo print-logo-hebet" src="hebet-logo-full.png" alt="הבט"><img class="print-logo print-logo-idf" src="idf-goc.svg" alt=""><div><h1>' + esc(CONFIG.title) + "</h1><p>" +
        esc(placeLabel + " · " + printLabel + (summary ? " · " + summary : "") + " · " + prettyDate(new Date())) + "</p></div></header>" +
        (state.outsideOpen ? "" : renderShalishutPrint(currentUnit())) +
        renderRoster(filtered, { compact: true });

      if (state.transferring) document.title = "שינוי שיבוץ · " + CONFIG.title;

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);

        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "-1000px";
        document.body.appendChild(area);
        area.select();
        try {
          var ok = document.execCommand("copy");
          document.body.removeChild(area);
          if (ok) resolve();

          document.body.removeChild(area);
