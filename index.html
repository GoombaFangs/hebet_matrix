          if (leaveOn && leaveForm) {
            var armOn = leaveBtn.getAttribute("data-exit") === ARM_EXIT;
            var focusField = armOn ? leaveForm.elements.destination : leaveForm.elements.reason;
            if (focusField) focusField.focus();
          }
          return;
        }
        var reasonBtn = event.target.closest("[data-action='pick-reason']");
        if (reasonBtn) {
          var reasonForm = reasonBtn.closest("form");
          var reasonInput = reasonForm && reasonForm.elements.reason;
          if (reasonInput) {
            reasonInput.value = reasonBtn.getAttribute("data-reason") || "";
            reasonInput.focus();
          }
          var picks = reasonForm ? reasonForm.querySelectorAll(".reason-pick") : [];
          for (var pickIndex = 0; pickIndex < picks.length; pickIndex++) {
            picks[pickIndex].classList.toggle("is-on", picks[pickIndex] === reasonBtn);
          }
          return;
        }
        var undoTransferBtn = event.target.closest("[data-action='undo-transfer']");
        if (undoTransferBtn) {
          undoLastTransfer(undoTransferBtn.getAttribute("data-key") || state.selectedKey, undoTransferBtn.getAttribute("data-stay") === "log");
          return;
        }
        var transferBtn = event.target.closest("[data-action='open-transfer']");
        if (transferBtn) {
          var transferKey = transferBtn.getAttribute("data-key");
          if (transferKey) state.selectedKey = transferKey;
          openTransfer();
          return;
        }
        var postedBtn = event.target.closest("[data-action='open-posted']");
        if (postedBtn) {
          openPosted(postedBtn.getAttribute("data-key"));
          return;
        }
        var unassignedBtn = event.target.closest("[data-action='open-unassigned']");
        if (unassignedBtn) {
          openUnassigned(unassignedBtn.getAttribute("data-key") || "");
          return;
        }
        if (state.unitsHome) {
          var homeClearPhoto = event.target.closest("[data-action='clear-photo']");
          if (homeClearPhoto) {
            setSoldierPhoto(homeClearPhoto.getAttribute("data-key") || "", "");
            return;
          }
          if (event.target.closest("[data-action='toggle-intake']")) {
            captureIntake();
            state.intakeOpen = !state.intakeOpen;
            render(state.intakeOpen ? { focusIntake: "name", openIntake: true } : {});
            return;
          }
          if (event.target.closest("[data-action='close-intake']")) {
            captureIntake();
            state.intakeOpen = false;
            state.intakeError = "";
            render();
            var intakeToggle = document.querySelector("[data-action='toggle-intake']");
            if (intakeToggle) intakeToggle.focus();
            return;
          }
          var freshBtn = event.target.closest("[data-action='open-fresh']");
          if (freshBtn) {
            if (suppressFreshClick) {
              suppressFreshClick = false;
              return;
            }
            openUnassigned(freshBtn.getAttribute("data-key") || "", "fresh");
            return;
          }
          if (event.target.closest("[data-action='cancel-unit']")) {
            closeUnitEditor();
            render();
            return;
          }
          if (event.target.closest("[data-action='add-unit']")) {
            closeUnitEditor();
            state.unitEdit = "new";
            state.unitDraft = blankUnitDraft();
            state.unitError = "";
            render({ focusUnit: true });
            return;
          }
          var colorBtn = event.target.closest("[data-action='pick-color']");
          if (colorBtn) {
            var colorId = colorBtn.getAttribute("data-unit");
            var nextColor = state.colorUnit === colorId ? "" : colorId;
            state.unitEdit = "";
            state.unitDraft = null;
            state.unitError = "";
            state.colorUnit = nextColor;
            render({ focusPalette: Boolean(nextColor) });
            return;
          }
          var setColorBtn = event.target.closest("[data-action='set-color']");
          if (setColorBtn) {
            setUnitColor(setColorBtn.getAttribute("data-unit"), setColorBtn.getAttribute("data-color") || "");
            render();
            return;
          }
          var editBtn = event.target.closest("[data-action='edit-unit']");
          if (editBtn) {
            openUnitEditor(editBtn.getAttribute("data-unit"), editBtn);
            return;
          }
          if (event.target.closest("[data-action='delete-unit']")) {
            var deleteForm = event.target.closest(".unit-edit");
            deleteUnit(deleteForm && deleteForm.getAttribute("data-unit"));
            return;
          }
          var shalishutBtn = event.target.closest("[data-action='open-shalishut']");
          if (shalishutBtn) {
            enterUnit(shalishutBtn.getAttribute("data-unit"), { shalishut: true });
            return;
          }
          var releasedBtn = event.target.closest("[data-action='open-released']");
          if (releasedBtn) {
            enterReleased(releasedBtn.getAttribute("data-unit"));
            return;
          }
          var openBtn = event.target.closest("[data-action='open-unit']");
          if (openBtn) beginEnterUnit(openBtn.getAttribute("data-unit"));
          return;
        }
        var clearPhoto = event.target.closest("[data-action='clear-photo']");
        if (clearPhoto) {
          setSoldierPhoto(clearPhoto.getAttribute("data-key") || "", "");
          return;
        }
        var soldierEdit = event.target.closest("[data-action='edit-soldier']");
        if (soldierEdit) {
          var soldierKey = soldierEdit.getAttribute("data-key");
          if (soldierKey) state.selectedKey = soldierKey;
          openSoldierEditor();
          return;
        }
        if (event.target.closest("[data-action='edit-shalishut']")) {
          var unit = currentUnit();
          state.shalishutDraft = null;
          state.editingShalishut = true;
          state.shalishutError = "";
          state.shalishutDraft = shalishutValue(unit);
          state.shalishutOpen = true;
          state.profileOpen = true;
          render({ focusShalishut: true });
          return;
        }
        if (event.target.closest("[data-action='cancel-shalishut']")) {
          closeShalishutEditor();
          render();
          return;
        }
        if (event.target.closest("[data-action='cancel-new']")) {
          closeCreator();
          return;
        }
        if (event.target.closest("[data-action='delete-soldier']")) {
          deleteEditingSoldier();
          return;
        }
        if (event.target.closest("[data-action='clear']")) {
          clearFilters();
          return;
        }
        if (event.target.closest("[data-action='back']")) {
          state.profileOpen = false;
          state.shalishutOpen = false;
          closeShalishutEditor();
          syncShell();
          var current = document.querySelector("#list .person[aria-current='true']");
          if (current) current.focus();
          return;
        }
        var routeToggle = event.target.closest("[data-action='toggle-route']");
        if (routeToggle) {
          var routeEl = routeToggle.closest(".dir-route");
          if (!routeEl) return;
          var nextOpen = routeToggle.getAttribute("aria-expanded") !== "true";
          setRouteOpen(routeEl.getAttribute("data-key") || "", nextOpen);
          routeEl.classList.toggle("is-open", nextOpen);
          routeToggle.setAttribute("aria-expanded", nextOpen ? "true" : "false");
          var routeBody = routeEl.querySelector(".dir-route-body");
          if (routeBody) routeBody.setAttribute("aria-hidden", nextOpen ? "false" : "true");
          return;
        }
        var routesAll = event.target.closest("[data-action='toggle-routes']");
        if (routesAll) {
          state.routesOpen = !state.routesOpen;
          state.routeKeys = {};
          render({ keepProfileScroll: true, focusRoutes: true });
          return;
        }
        var plainRow = event.target.closest(".dir-row");
        if (plainRow && !event.target.closest("button, a, input, label, textarea, select")) {
          followProfileSoldier(plainRow.getAttribute("data-soldier") || "");
        }
      });
      document.addEventListener("click", function (event) {
        if (!event.target.closest) return;
        var setColorBtn = event.target.closest("[data-action='set-color']");
        if (setColorBtn) {
          event.preventDefault();
          event.stopPropagation();
          setUnitColor(setColorBtn.getAttribute("data-unit"), setColorBtn.getAttribute("data-color") || "");
          render();
          return;
        }
        if (!state.colorUnit) return;
        if (event.target.closest("#color-palette") || event.target.closest("[data-action='pick-color']")) return;
        dismissColorPalette();
      }, true);
      document.addEventListener("click", function (event) {
        if (event.target.closest && event.target.closest(".date-field")) return;
        closeDateFields();
      });
      document.getElementById("profile").addEventListener("scroll", function () {
        var openDate = document.querySelector(".date-field.is-open");
        if (openDate) placeDatePop(openDate);
        if (document.getElementById("color-palette")) placeColorPalette();
      });
      document.addEventListener("scroll", function () {
        if (document.getElementById("color-palette")) placeColorPalette();
      }, true);
      window.addEventListener("resize", function () {
        var openDate = document.querySelector(".date-field.is-open");
        if (openDate) placeDatePop(openDate);
        if (document.getElementById("color-palette")) placeColorPalette();
      });
      document.addEventListener("keydown", function (event) {
        var datePopKey = event.target.closest && event.target.closest(".date-pop");
        if (datePopKey && datePopKey.dataset.mode === "years" && event.key >= "0" && event.key <= "9") {
          event.preventDefault();
          dateYearTyped = (dateYearTyped + event.key).slice(-4);
          var typedYear = datePopKey.querySelector('.date-year[data-year^="' + dateYearTyped + '"]');
          if (typedYear) focusDateYear(datePopKey, typedYear.getAttribute("data-year"));
          window.clearTimeout(dateYearTypeTimer);
          dateYearTypeTimer = window.setTimeout(function () { dateYearTyped = ""; }, 800);
          return;
        }
        var yearBtn = event.target.closest && event.target.closest(".date-year");
        if (yearBtn && (event.key === "ArrowRight" || event.key === "ArrowLeft" || event.key === "ArrowUp" || event.key === "ArrowDown")) {
          event.preventDefault();
          var yearDelta = event.key === "ArrowRight" ? -1 : event.key === "ArrowLeft" ? 1 : event.key === "ArrowUp" ? -4 : 4;
          var yearPop = yearBtn.closest(".date-pop");
          if (yearPop) focusDateYear(yearPop, Number(yearBtn.getAttribute("data-year")) + yearDelta);
          return;
        }
        var dateDay = event.target.closest && event.target.closest(".date-day");
        if (dateDay && (event.key === "ArrowRight" || event.key === "ArrowLeft" || event.key === "ArrowUp" || event.key === "ArrowDown")) {
          event.preventDefault();
          var dateDelta = event.key === "ArrowRight" ? -1 : event.key === "ArrowLeft" ? 1 : event.key === "ArrowUp" ? -7 : 7;
          moveDateFocus(dateDay, dateDelta);
          return;
        }
        var typing = event.target && (event.target.tagName === "INPUT" || event.target.tagName === "SELECT" || event.target.tagName === "TEXTAREA");
        if (event.key === "/" && !typing) {
          event.preventDefault();
          document.getElementById("search").focus();
          return;
        }
        if (event.key === "Escape" && document.querySelector(".date-field.is-open")) {
          var openDateField = document.querySelector(".date-field.is-open");
          var openDatePop = openDateField && openDateField.querySelector(".date-pop");
          if (openDatePop && openDatePop.dataset.mode === "years") {
            showDateDays(openDateField);
            return;
          }
          closeDateField(openDateField);
          var dateTrigger = openDateField && openDateField.querySelector(".date-trigger");
          if (dateTrigger) dateTrigger.focus();
          return;
        }
        if (event.key === "Escape" && state.unitsHome && state.intakeOpen) {
          var intakeBoard = document.getElementById("intake-board");
          if (intakeBoard && intakeBoard.contains(document.activeElement)) {
            captureIntake();
            state.intakeOpen = false;
            state.intakeError = "";
            render();
            var intakeToggleBtn = document.querySelector("[data-action='toggle-intake']");
            if (intakeToggleBtn) intakeToggleBtn.focus();
            return;
          }
        }
        if (event.key === "Escape" && state.colorUnit) {
          state.colorUnit = "";
          render();
          return;
        }
        if (event.key === "Escape" && (state.unitOpen || state.unitEdit)) {
          if (state.unitEdit) closeUnitEditor();
          else state.unitOpen = false;
          render();
          return;
        }
        if (event.key === "Escape" && state.transferring) {
          closeTransfer();
          return;
        }
        if (event.key === "Escape" && state.logOpen) {
          closeLog();
          return;
        }
        if (event.key === "Escape" && state.editingShalishut) {
          closeShalishutEditor();
          render();
          return;
        }
        if (event.key === "Escape" && (state.creating || state.editingIndex >= 0)) {
          closeCreator();
          return;
        }
        if (event.key === "Escape" && document.body.classList.contains("profile-open")) {
          state.profileOpen = false;
          state.shalishutOpen = false;
          closeShalishutEditor();
          syncShell();
          return;
        }
        if ((event.key === "ArrowDown" || event.key === "ArrowUp") && !typing && !state.unitsHome) {
          event.preventDefault();
          moveSelection(event.key === "ArrowDown" ? 1 : -1);
        }
      });
      var mq = window.matchMedia("(max-width: 860px)");
      if (mq.addEventListener) mq.addEventListener("change", syncShell);
      render(state.unitsHome ? { intro: true } : {});
      var releaseDay = todayKey();
      function refreshIfReleaseDayChanged() {
        var nextDay = todayKey();
        if (nextDay === releaseDay) return;
        releaseDay = nextDay;
        render();
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") refreshIfReleaseDayChanged();
      });
      setInterval(refreshIfReleaseDayChanged, 60000);
    }

    function waitImage(src) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () { resolve(); };
        img.onerror = function () { resolve(); };
        img.src = src;
      });
    }

    function hideBootScreen() {
      var screen = document.getElementById("boot-screen");
      if (!screen || screen.classList.contains("is-done")) return;
      screen.classList.add("is-done");
      window.setTimeout(function () { screen.hidden = true; }, 360);
    }

    function settle(promise, ms) {
      return new Promise(function (resolve) {
        var done = false;
        function finish() {
          if (done) return;
          done = true;
          resolve();
        }
        promise.then(finish, finish);
        if (ms) window.setTimeout(finish, ms);
      });
    }

    var appStarted = false;
    var serverWatch = 0;

    function beginApp() {
      if (serverWatch) {
        window.clearInterval(serverWatch);
        serverWatch = 0;
      }
      if (!appStarted) {
        appStarted = true;
        try { startApp(); } catch (err) {}
      }
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(hideBootScreen);
      });
    }

    function bindBootDrop() {
      var screen = document.getElementById("boot-screen");
      if (!screen || screen.getAttribute("data-drop") === "1") return;
      screen.setAttribute("data-drop", "1");
      screen.addEventListener("dragover", function (event) { event.preventDefault(); });
      screen.addEventListener("drop", function (event) {
        event.preventDefault();
        var items = event.dataTransfer && event.dataTransfer.items;
        var item = items && items.length ? items[0] : null;
        if (!item || !item.getAsFileSystemHandle) return;
        var status = document.getElementById("boot-status");
        if (status) status.textContent = "טוען את hebet-data.txt";
        item.getAsFileSystemHandle().then(function (handle) {
          return acceptDataHandle(handle).then(activateHandle);
        }).then(function (ok) {
          if (ok) beginApp();
        }).catch(function (err) {
          var message = explainFileError(err);
          if (message) window.alert(message);
          if (status) status.textContent = "גררו לכאן את hebet-data.txt, או פתחו את הקיצור «תקן מצבה זרועי».";
        });
      });
    }

    function watchServer() {
      if (serverWatch || appStarted) return;
      serverWatch = window.setInterval(function () {
        if (appStarted) {
          window.clearInterval(serverWatch);
          serverWatch = 0;
          return;
        }
        openProjectFile().then(function (ok) {
          if (ok && !appStarted) beginApp();
        });
      }, 1000);
    }

    function showFolderPrompt(message) {
      var status = document.getElementById("boot-status");
      var bar = document.getElementById("boot-bar");
      var btn = document.getElementById("boot-connect");
      var hint = document.getElementById("boot-hint");
      if (status) status.textContent = message || "פתחו את «תקן מצבה זרועי» שבתיקייה";
      if (bar) bar.hidden = true;
      if (hint) hint.hidden = false;
      if (btn) btn.hidden = true;
      watchServer();
    }

    function init() {
      Promise.all([
        waitImage("Heber_Loader.gif"),
        waitImage("hebet-logo-full.png"),
        waitImage("idf-goc.svg"),
        openProjectFile()
      ]).then(function (results) {
        if (results[3]) beginApp();
        else showFolderPrompt(fileBroken ? "קובץ hebet-data.txt פגום ולא נטען." : "כדי לטעון את הנתונים, פתחו את הקיצור «תקן מצבה זרועי»");
      }, function () {
        showFolderPrompt("כדי לטעון את הנתונים, פתחו את הקיצור «תקן מצבה זרועי»");
      });
    }

    init();
  </script>
</body>
</html>
