        if (noteText) noteText.textContent = "קובץ הנתונים בתיקייה פגום, ולכן הוא לא נטען ולא נדרס. אפשר לתקן את hebet-data.txt או למחוק אותו ואז לרענן.";
        if (connect) connect.hidden = true;
        return;
      }
      if (noteText) noteText.textContent = "המחשב הזה עוד לא קורא את hebet-data.txt. פתחו את הקיצור «תקן מצבה זרועי» שבתיקייה.";
      if (connect) connect.hidden = false;
    }

    function queueProjectSave() {
      if (!projectFileActive || fileBroken) return;
      if (bootstrapping) return;
      savePending = true;
      pumpSave();
    }

    function scheduleSaveRetry() {
      if (saveTimer) return;
      saveTimer = window.setTimeout(function () {
        saveTimer = 0;
        if (!projectFileActive || fileBroken) return;
        savePending = true;
        pumpSave();
      }, 1500);
    }

    function pumpSave() {
      if (saveRunning || !savePending) return;
      savePending = false;
      saveRunning = true;
      setSaveStatus("saving");
      var body;
      try { body = JSON.stringify(projectSnapshot()); }
      catch (err) {
        saveRunning = false;
        setSaveStatus("error");
        savePending = true;
        scheduleSaveRetry();
        return;
      }
      writeBody(body).then(function () {
        saveRunning = false;
        if (savePending) pumpSave();
        else setSaveStatus("saved");
      }, function (err) {
        saveRunning = false;
        if (err && err.message === "stale") {
          refreshFromServer();
          return;
        }
        setSaveStatus("error");
        savePending = true;
        scheduleSaveRetry();
      });
    }

    function writeBody(body) {
      function once() {
        if (fileMode === "server" && dataUrl) {
          return fetch(dataUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: body
          }).then(function (res) {
            if (res.status === 409) throw new Error("stale");
            if (!res.ok) throw new Error("save");
          });
        }
        if (fileMode === "file" && fileHandle) return writeFileHandle(fileHandle, body);
        return Promise.reject(new Error("mode"));
      }
      function attempt(left) {
        return once().catch(function (err) {
          if (err && err.message === "stale") throw err;
          if (left <= 1) throw new Error("save");
          return new Promise(function (resolve) { setTimeout(resolve, 400); }).then(function () {
            return attempt(left - 1);
          });
        });
      }
      return attempt(4);
    }

    function refreshFromServer() {
      if (fileMode !== "server" || !dataUrl) return;
      fetch(dataUrl, { cache: "no-store" }).then(function (res) {
        if (!res.ok) throw new Error("load");
        return res.text();
      }).then(function (text) {
        var data = normalizeRecord(JSON.parse(text));
        fileRecord = data;
        fileRevision = data && data.revision ? data.revision : 0;
        if (data && Array.isArray(data.soldiers)) SOLDIERS = data.soldiers.map(blankSoldier);
        if (data && Array.isArray(data.units) && data.units.length) {
          var next = [];
          data.units.forEach(function (item) {
            var unit = normalizeUnit(item);
            if (!unit.id || !unit.name) return;
            if (next.some(function (existing) { return existing.id === unit.id; })) return;
            next.push(unit);
          });
          if (next.length) UNITS = next;
        }
        savePending = false;
        setSaveStatus("saved");
        if (appStarted) render();
      }).catch(function () {
        setSaveStatus("error");
        savePending = true;
        scheduleSaveRetry();
      });
    }

    function flushProjectSave() {
      if (!projectFileActive || fileBroken || fileMode !== "server" || !dataUrl) return;
      try {
        fetch(dataUrl, {
          method: "PUT",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(projectSnapshot()),
          keepalive: true
        });
      } catch (err) {}
    }

    function tryServerUrl(urls, index) {
      if (index >= urls.length) return Promise.resolve(false);
      var url = urls[index];
      var ctrl = typeof AbortController === "function" ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 600);
      var opts = { cache: "no-store" };
      if (ctrl) opts.signal = ctrl.signal;
      return fetch(url, opts).then(function (res) {
        clearTimeout(timer);
        if (!res.ok || res.headers.get("X-Hebet-Project") !== "1") throw new Error("no");
        return res.text();
      }).then(function (text) {
        if (text == null) return false;
        var data;
        try { data = JSON.parse(text); }
        catch (err) {
          sawCorrupt = true;
          throw err;
        }
        dataUrl = url;
        fileMode = "server";
        projectFileActive = true;
        fileRecord = normalizeRecord(data);
        fileRevision = fileRecord && fileRecord.revision ? fileRecord.revision : 0;
        return true;
      }).catch(function () {
        clearTimeout(timer);
        return tryServerUrl(urls, index + 1);
      });
    }

    function tryServer() {
      var urls = [];
      if (location.protocol === "http:" || location.protocol === "https:") urls.push("/api/data");
      return tryServerUrl(urls, 0);
    }

    function idbOpen() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) {
          reject(new Error("idb"));
          return;
        }
        var req = indexedDB.open("hebet-matrix-files", 1);
        req.onupgradeneeded = function () {
          if (!req.result.objectStoreNames.contains("handles")) req.result.createObjectStore("handles");
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    }

    function idbGet(key) {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction("handles", "readonly");
          var req = tx.objectStore("handles").get(key);
          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function idbSet(key, value) {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction("handles", "readwrite");
          tx.objectStore("handles").put(value, key);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }

    function readFileHandle(handle) {
      return handle.getFile().then(function (file) {
        return file.text();
      }).then(function (text) {
        if (!String(text || "").trim()) return { fresh: true };
        try { return normalizeRecord(JSON.parse(text)); }
        catch (err) {
          sawCorrupt = true;
          throw new Error("corrupt");
        }
      });
    }

    function writeFileHandle(handle, body) {
      return handle.createWritable().then(function (stream) {
        return stream.write(body).then(function () {
          return stream.close();
        }, function (err) {
          return stream.close().then(function () { throw err; }, function () { throw err; });
        });
      });
    }

    function tryStoredHandle() {
      return idbGet("dataFile").then(function (handle) {
        if (!handle || !handle.queryPermission) return false;
        savedFileHandle = handle;
        return handle.queryPermission({ mode: "readwrite" }).then(function (perm) {
          if (perm !== "granted") return false;
          return readFileHandle(handle).then(function (data) {
            fileHandle = handle;
            fileMode = "file";
            projectFileActive = true;
            fileRecord = data;
            return true;
          });
        });
      }).catch(function () { return false; });
    }

    function findDataInDirectory(dir) {
      var expected = DATA_NAME.toLowerCase();
      function listed() {
        if (!dir.entries) return Promise.reject(new Error("missing"));
        var iter = dir.entries();
        function step() {
          return iter.next().then(function (item) {
            if (item.done) return Promise.reject(new Error("missing"));
            var name = item.value[0];
            var handle = item.value[1];
            if (handle && handle.kind === "file" && String(name).toLowerCase() === expected) return handle;
            return step();
          });
        }
        return step();
      }
      if (dir.getFileHandle) {
        return dir.getFileHandle(DATA_NAME).catch(function () { return listed(); });
      }
      return listed();
    }

    function acceptDataHandle(handle) {
      if (!handle || handle.kind === "directory") {
        if (handle && handle.kind === "directory") return findDataInDirectory(handle);
        return Promise.reject(new Error("missing"));
      }
      var name = handle.name ? String(handle.name).toLowerCase() : "";
      if (!name || name === DATA_NAME.toLowerCase()) return Promise.resolve(handle);
      return readFileHandle(handle).then(function (data) {
        if (!data || data.fresh || (!Array.isArray(data.soldiers) && !Array.isArray(data.units))) {
          throw new Error("wrong-file");
        }
        return handle;
      });
    }

    function pickDataFile() {
      if (window.showOpenFilePicker) {
        return window.showOpenFilePicker({
          id: "hebet-data-file",
          multiple: false,
          excludeAcceptAllOption: false,
          types: [{ description: "hebet-data.txt", accept: { "text/plain": [".txt"] } }]
        }).then(function (handles) {
          return acceptDataHandle(handles && handles[0]);
        });
      }
      if (!window.showDirectoryPicker) {
        window.alert("פתחו את הקיצור «תקן מצבה זרועי» שבתיקייה, ב-Edge או ב-Chrome.");
        return Promise.reject(new Error("picker"));
      }
      return window.showDirectoryPicker({ id: "hebet-matrix-dir", mode: "readwrite" }).then(findDataInDirectory);
    }

    function activateHandle(handle) {
      fileHandle = handle;
      savedFileHandle = handle;
      return readFileHandle(handle).then(function (data) {
        fileMode = "file";
        projectFileActive = true;
        fileBroken = false;
        fileRecord = data || { fresh: true };
        return idbSet("dataFile", handle).then(function () { return true; });
      });
    }

    function explainFileError(err) {
      if (!err || err.name === "AbortError" || err.message === "picker") return "";
      if (err.message === "corrupt") return "קובץ hebet-data.txt פגום, ולכן הוא לא נטען ולא נדרס.";
      if (err.message === "wrong-file") return "זה לא קובץ הנתונים. בחרו את hebet-data.txt שבתיקיית הפרויקט.";
      if (err.message === "missing" || err.name === "NotFoundError") return "hebet-data.txt לא נמצא בתיקייה שנבחרה. בחרו את הקובץ עצמו, או פתחו את הקיצור «תקן מצבה זרועי».";
      if (err.name === "NotAllowedError" || err.name === "SecurityError") return "הדפדפן לא קיבל גישה לקובץ. פתחו את הקיצור «תקן מצבה זרועי» שבתיקייה.";
      return "לא הצלחנו לפתוח את hebet-data.txt. פתחו את הקיצור «תקן מצבה זרועי» שבתיקייה.";
    }

    function connectProjectFolder() {
      var next;
      if (savedFileHandle && savedFileHandle.requestPermission) {
        next = savedFileHandle.requestPermission({ mode: "readwrite" }).then(function (perm) {
          if (perm === "granted") return savedFileHandle;
          savedFileHandle = null;
          return null;
        });
      } else if (window.showOpenFilePicker || window.showDirectoryPicker) {
        next = pickDataFile();
      } else {
        window.alert("פתחו את הקיצור «תקן מצבה זרועי» שבתיקייה, ב-Edge או ב-Chrome.");
        return Promise.resolve(false);
      }
      return Promise.resolve(next).then(function (handle) {
        if (!handle) return false;
        return acceptDataHandle(handle).then(activateHandle);
      }).catch(function (err) {
        var message = explainFileError(err);
        if (!message) return false;
        if (err && err.message === "corrupt") fileBroken = true;
        window.alert(message);
        return false;
      });
    }

    function openProjectFile() {
      sawCorrupt = false;
      fileBroken = false;
      return tryServer().then(function (found) {
        if (!found && sawCorrupt) fileBroken = true;
        return !!found;
      }).catch(function () {
        if (sawCorrupt) fileBroken = true;
        return false;
      });
    }

    function loadStored() {
      var defaults = SOLDIERS.map(blankSoldier);
      var added = false;
      try {
        var raw = storedRaw("soldiers", STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) SOLDIERS = parsed.map(blankSoldier);
        }
      } catch (err) {}
      defaults.forEach(function (soldier) {
        var id = clean(soldier.personalId);
        var exists = SOLDIERS.some(function (existing) {
          if (id && clean(existing.personalId) === id) return true;
          return !id && clean(existing.name) === clean(soldier.name) && unitId(existing.unit) === unitId(soldier.unit);
        });
        if (exists) return;
        SOLDIERS.push(soldier);
        added = true;
      });
      SOLDIERS.forEach(function (soldier) {
        if (clean(soldier.profession) === "סטוריטאי וידאו") {
          soldier.profession = "";
          added = true;
        }
      });
      if (added) persist();
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(SOLDIERS));
      } catch (err) {
        if (!projectFileActive) throw err;
      }
      queueProjectSave();
    }

    function loadUnits() {
      var defaults = UNITS.map(normalizeUnit);
      var added = false;
      try {
        var raw = storedRaw("units", UNITS_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            var next = [];
            parsed.forEach(function (item) {
              var unit = normalizeUnit(item);
              if (!unit.id || !unit.name) return;
              if (next.some(function (existing) { return existing.id === unit.id; })) return;
              next.push(unit);
            });
            if (next.length) UNITS = next;
          }
        }
      } catch (err) {}
      defaults.forEach(function (unit) {
        var exists = UNITS.some(function (existing) {
          return existing.id === unit.id || existing.name === unit.name;
        });
        if (exists) return;
        UNITS.push(unit);
        added = true;
      });
      if (added) saveUnits();
    }

    function quotaPartsFrom(source) {
      var raw = source && source.quotaBy;
      var parts = {};
      QUOTA_PARTS.forEach(function (part) {
        parts[part.profession] = digits(raw && raw[part.profession]);
      });
      return parts;
    }

    function quotaModeOf(source) {
      return source && source.quotaMode === "profession" ? "profession" : "general";
    }

    function assignQuota(target, source) {
      target.quotaMode = quotaModeOf(source);
      target.quotaBy = quotaPartsFrom(source);
      target.quota = digits(source && source.quota);
    }

    function quotaBits(unit) {
      if (quotaModeOf(unit) !== "profession") return [];
      var bits = [];
      QUOTA_PARTS.forEach(function (part) {
        var count = digits(unit.quotaBy && unit.quotaBy[part.profession]);
        if (count === "" || Number(count) === 0) return;
        bits.push({ name: part.profession, count: String(Number(count)) });
      });
      return bits;
    }

    function quotaDetail(unit) {
      var bits = quotaBits(unit);
      if (bits.length) return bits.map(function (bit) { return bit.count + " " + bit.name; }).join(", ");
      if (quotaModeOf(unit) === "profession") return "";
      if (!present(unit && unit.quota)) return "";
      return clean(unit.quota) + " כללי";
    }

    function quotaSentence(unit) {
      var detail = quotaDetail(unit);
      return detail ? "תקן: " + detail : "";
    }

    function readQuota(form, data) {
      var selected = form.querySelector('input[name="quotaMode"]:checked');
      data.quotaMode = selected && selected.value === "profession" ? "profession" : "general";
      data.quota = clean(data.quota);
      data.quotaBy = {};
      QUOTA_PARTS.forEach(function (part) {
        var input = form.elements[part.field];
        data.quotaBy[part.profession] = clean(input ? input.value : "");
      });
      return data;
    }

    function normalizeUnit(item) {
      var unit = {
        id: clean(item && item.id),
        name: clean(item && item.name)
      };
      UNIT_PARAMS.forEach(function (key) {
        unit[key] = clean(item && item[key]);
      });
      assignQuota(unit, item);
      unit.color = paletteColor(item && item.color);
      return unit;
    }

    function paletteColor(value) {
      var text = clean(value).toUpperCase();
      if (!text) return "";
      if (text.charAt(0) !== "#") text = "#" + text;
      return PALETTE_COLORS[text] || "";
    }

    function unitColor(unit) {
      return paletteColor(unit && unit.color);
    }

    function colorFill(color) {
      return '<span class="unit-color-fill"' + (color ? ' style="background:' + color + '"' : "") + "></span>";
    }

    function paletteCell(unit, hex) {
      var selected = unitColor(unit) === hex;
      return '<button class="palette-cell' + (selected ? " is-selected" : "") + '" type="button" data-action="set-color" data-unit="' + esc(unit.id) + '" data-color="' + hex + '" style="background:' + hex + '" aria-label="' + hex + '"' + (selected ? ' aria-pressed="true"' : "") + "></button>";
    }

    function renderPalette(unit) {
      var current = unitColor(unit);
      var theme = THEME_COLORS.map(function (row) {
        return '<div class="palette-row">' + row.map(function (hex) { return paletteCell(unit, hex); }).join("") + "</div>";
      }).join("");
      var standard = '<div class="palette-row">' + STANDARD_COLORS.map(function (hex) { return paletteCell(unit, hex); }).join("") + "</div>";
      return '<div class="palette" role="group" aria-label="בחירת צבע">' +
        '<button class="palette-auto' + (current ? "" : " is-selected") + '" type="button" data-action="set-color" data-unit="' + esc(unit.id) + '" data-color=""' + (current ? "" : ' aria-pressed="true"') + ">" +
          colorFill("") + "<span>אוטומטי</span></button>" +
        '<p class="palette-label">צבעי ערכת נושא</p>' + theme +
        '<p class="palette-label">צבעים רגילים</p>' + standard +
      "</div>";
    }

    function setUnitColor(id, color) {
      var unit = null;
      for (var i = 0; i < UNITS.length; i++) {
        if (UNITS[i].id === id) unit = UNITS[i];
      }
      if (!unit) return;
      unit.color = paletteColor(color);
      saveUnits();
      state.colorUnit = "";
    }

    function colorButtonFor(id) {
      var buttons = document.querySelectorAll("[data-action='pick-color']");
      var fallback = null;
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute("data-unit") !== id) continue;
        if (!fallback) fallback = buttons[i];
        var rect = buttons[i].getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) return buttons[i];
      }
      return fallback;
    }

    function dismissColorPalette() {
      if (!state.colorUnit) return;
      var id = state.colorUnit;
      state.colorUnit = "";
      var palette = document.getElementById("color-palette");
      if (palette) palette.remove();
      var buttons = document.querySelectorAll("[data-action='pick-color']");
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute("data-unit") === id) buttons[i].setAttribute("aria-expanded", "false");
      }
    }

    function usedZoom(el) {
      var zoom = 1;
      var node = el;
      while (node && node.nodeType === 1) {
        var z = parseFloat(window.getComputedStyle(node).zoom);
        if (z && isFinite(z) && z > 0) zoom *= z;
        node = node.parentElement;
      }
      return zoom;
    }

    function popupRect(el) {
      var rect = el.getBoundingClientRect();
      var zoom = usedZoom(el);
      var layoutW = el.offsetWidth || rect.width;
      var includesZoom = Math.abs(zoom - 1) < 0.02 || Math.abs(rect.width - layoutW * zoom) <= Math.abs(rect.width - layoutW);
      if (includesZoom) {
        return { left: rect.left, top: rect.top, width: rect.width, height: rect.height, right: rect.right, bottom: rect.bottom };
      }
      return {
        left: rect.left * zoom,
        top: rect.top * zoom,
        width: rect.width * zoom,
        height: rect.height * zoom,
        right: rect.right * zoom,
        bottom: rect.bottom * zoom
      };
    }

    function placeColorPalette() {
      var palette = document.getElementById("color-palette");
      if (!palette) return;
      var btn = colorButtonFor(state.colorUnit);
      if (!btn) {
        palette.remove();
        return;
      }
      var rect = popupRect(btn);
      var scroller = btn.closest(".profile-scroll, .sidebar");
      var visible = rect.width > 0 && rect.height > 0;
      if (visible && scroller) {
        var box = popupRect(scroller);
        if (rect.bottom < box.top || rect.top > box.bottom || rect.right < box.left || rect.left > box.right) visible = false;
      }
      if (!visible) {
        palette.style.visibility = "hidden";
        return;
      }
      palette.style.visibility = "visible";
      var margin = 8;
      var gap = 8;
      var width = palette.offsetWidth;
      var height = palette.offsetHeight;
      var left = rect.right - width;
      if (left < margin) left = margin;
      if (left + width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - margin - width);
      var top = rect.top - height - gap;
      if (top < margin) {
        var below = rect.bottom + gap;
        top = below + height <= window.innerHeight - margin ? below : Math.max(margin, window.innerHeight - margin - height);
      }
      palette.style.left = Math.round(left) + "px";
      palette.style.top = Math.round(top) + "px";
    }

    function mountColorPalette(opts) {
      var existing = document.getElementById("color-palette");
      if (existing) existing.remove();
      if (!state.colorUnit) return;
      var unit = findUnit(state.colorUnit);
      if (!unit || !colorButtonFor(state.colorUnit)) return;
      var holder = document.createElement("div");
      holder.innerHTML = renderPalette(unit);
      var palette = holder.firstChild;
      if (!palette) return;
      palette.id = "color-palette";
      document.body.appendChild(palette);
      placeColorPalette();
      if (opts && opts.focusPalette) {
        var selected = palette.querySelector("[aria-pressed='true']") || palette.querySelector("button");
        if (selected) selected.focus();
      }
    }

    function currentUnit() {

      for (var i = 0; i < UNITS.length; i++) {
        if (UNITS[i].id === id) return UNITS[i];
      }
      return UNITS[0];
    }

    function phoneMarkup(phone) {

    function shalishutValue(unit) {

    function metricCell(label, value) {

    function shalishutField(name, label, value, extra, wide) {
      var numeric = extra && extra.indexOf("data-digits") !== -1;
      var hint = numeric ? '<span class="field-hint">רק ספרות</span>' : "";
      var invalid = numeric && digitsInvalid(value) ? ' class="is-invalid"' : "";
      return '<label' + (wide ? ' class="editor-wide"' : "") + '><span class="field-label">' + esc(label) + '</span><input name="' + name + '"' + invalid + ' value="' + esc(value || "") + '"' + (extra || "") + ">" + hint + "</label>";

    function contactDigitsMessage(data) {
      if (!data) return "";
      if (digitsInvalid(data.quota)) return "בתקן חייב להיות מספר. יש תו לא חוקי, אי אפשר לשמור.";
      var parts = data.quotaBy || {};
      for (var i = 0; i < QUOTA_PARTS.length; i++) {
        var part = QUOTA_PARTS[i];
        if (digitsInvalid(parts[part.profession])) return "ב" + part.profession + " חייב להיות מספר. יש תו לא חוקי, אי אפשר לשמור.";
      }
      for (var r = 0; r < SHALISHUT_ROLES.length; r++) {
        var role = SHALISHUT_ROLES[r];
        if (digitsInvalid(data[role.phone])) return "בטלפון של " + role.label + " חייב להיות מספר. יש תו לא חוקי, אי אפשר לשמור.";
      }
      return "";

    function quotaFields(data) {
      var mode = quotaModeOf(data);
      var parts = quotaPartsFrom(data);
      var choices = '<div class="quota-mode" role="radiogroup" aria-label="אופן התקן">' +
        '<label class="quota-choice"><input type="radio" name="quotaMode" value="general"' + (mode === "general" ? " checked" : "") + "> כללי</label>" +
        '<label class="quota-choice"><input type="radio" name="quotaMode" value="profession"' + (mode === "profession" ? " checked" : "") + "> לפי מקצוע</label>" +
        "</div>";
      var general = '<div class="quota-general"><div class="editor-grid">' +
        shalishutField("quota", "מספר", data.quota, ' inputmode="numeric" autocomplete="off" maxlength="6" data-digits="1" pattern="[0-9]*"') +
        "</div></div>";
      var partInputs = QUOTA_PARTS.map(function (part) {
        var shown = data.quotaBy && data.quotaBy[part.profession] != null ? data.quotaBy[part.profession] : parts[part.profession];
        return shalishutField(part.field, part.profession, shown, ' inputmode="numeric" autocomplete="off" maxlength="4" data-digits="1" pattern="[0-9]*"');
      }).join("");
      var split = '<div class="quota-parts"><p class="quota-note">חובה מספר. תו שאינו ספרה לא מתקבל, ואי אפשר לשמור כל עוד הוא נשאר בשדה. מקצוע ריק או 0 לא מופיע בכרטיס.</p><div class="editor-grid">' +

    function unitStaffCounts(id) {
      var counts = {};
      var total = 0;
      unitSoldiers(id).forEach(function (soldier) {
        if (isReleased(soldier)) return;
        total += 1;
        var name = clean(soldier.profession);
        if (!name) return;
        counts[name] = (counts[name] || 0) + 1;
      });
      return { total: total, counts: counts };
    }

    function quotaGap(unit) {
      var bits = quotaBits(unit);
      if (bits.length) {
        var staff = unitStaffCounts(unit.id);
        var missing = [];
        var extra = [];
        var target = 0;
        var filled = 0;
        bits.forEach(function (bit) {
          var need = Number(bit.count);
          var have = staff.counts[bit.name] || 0;
          target += need;
          filled += Math.min(have, need);
          if (have < need) missing.push({ name: bit.name, count: String(need - have) });
          else if (have > need) extra.push({ name: bit.name, count: String(have - need) });
        });
        return { kind: "profession", missing: missing, extra: extra, target: target, filled: filled };
      }
      if (quotaModeOf(unit) === "profession" || !present(unit && unit.quota)) return null;
      var target = Number(digits(unit.quota));
      if (!isFinite(target)) return null;
      var have = unitStaffCounts(unit.id).total;
      return {
        kind: "general",
        missing: Math.max(target - have, 0),
        extra: Math.max(have - target, 0),
        target: target,
        filled: Math.min(have, target)
      };
    }

    function vacancyText(count) {
      count = Number(count) || 0;
      return count === 1 ? "1 מקום פנוי בתקן" : count + " מקומות פנויים בתקן";
    }

    function quotaGapTitle(gap) {
      if (!gap) return "";
      if (gap.kind === "general") {
        if (gap.missing) return vacancyText(gap.missing);
        if (gap.extra) return "עודף של " + gap.extra + " מעל התקן הכללי";
        return "התקן הכללי מלא";
      }
      if (gap.missing.length) {
        var text = "מקום פנוי: " + gap.missing.map(function (bit) { return bit.count + " " + bit.name; }).join(", ");
        if (gap.extra.length) text += ". עודף " + gap.extra.map(function (bit) { return bit.count + " " + bit.name; }).join(", ");
        return text;
      }
      if (gap.extra.length) return "עודף " + gap.extra.map(function (bit) { return bit.count + " " + bit.name; }).join(", ");
      return "התקן לפי מקצוע מלא";
    }

    function quotaGapHtml(unit) {
      var gap = quotaGap(unit);
      if (!gap) return { html: "", title: "" };
      var fill = gap.target > 0 ? Math.max(0, Math.min(100, Math.round(gap.filled / gap.target * 100))) : 100;
      var stateClass = "is-full";
      var body = '<span class="unit-gap-text">בתקן</span>';
      if (gap.kind === "general") {
        if (gap.missing) {
          stateClass = "is-short";
          body = '<span class="unit-gap-text"><b>' + gap.missing + "</b> " + (gap.missing === 1 ? "מקום פנוי בתקן" : "מקומות פנויים בתקן") + "</span>";
        } else if (gap.extra) {
          stateClass = "is-over";
          body = '<span class="unit-gap-text">עודף <b>' + gap.extra + "</b></span>";
        }
      } else if (gap.missing.length) {
        stateClass = "is-short";
        body = '<span class="unit-gap-kicker">מקום פנוי</span>' + gap.missing.map(function (bit) {
          return '<span class="unit-gap-bit"><b>' + esc(bit.count) + "</b> " + esc(bit.name) + "</span>";
        }).join("");
        if (gap.extra.length) {
          body += '<span class="unit-gap-extra">עודף ' + esc(gap.extra.map(function (bit) {
            return bit.count + " " + bit.name;
          }).join(", ")) + "</span>";
        }
      } else if (gap.extra.length) {
        stateClass = "is-over";
        body = '<span class="unit-gap-kicker">עודף</span>' + gap.extra.map(function (bit) {
          return '<span class="unit-gap-bit"><b>' + esc(bit.count) + "</b> " + esc(bit.name) + "</span>";
        }).join("");

      var title = quotaGapTitle(gap);
      return {

    function ensureUnits() {
      var normalized = false;
      SOLDIERS.forEach(function (soldier) {
        if (clean(soldier.external)) {
          if (soldier.unit) {
            soldier.unit = "";
            normalized = true;
          }
          return;
        }
        var text = clean(soldier.unit);
        if (!text) return;
        var id = unitId(text);
        var next = id || (UNITS[0] && UNITS[0].id) || "";
        if (soldier.unit !== next) {
          soldier.unit = next;
          normalized = true;
        }
      });
      var pending = SOLDIERS.filter(function (soldier) {
        return !unitId(soldier.unit) && !clean(soldier.external);
      });
      if (!pending.length || pending.length !== SOLDIERS.length) return normalized;
      var half = Math.ceil(pending.length / 2);
      var assigned = 0;
      pending.forEach(function (soldier) {
        var second = UNITS.length > 1 ? UNITS[1].id : UNITS[0].id;
        soldier.unit = assigned >= half ? second : UNITS[0].id;
        assigned += 1;
      });
      return true;
    }

    var HIT_FIELDS = [
      { key: "personalId", label: "מ״א" },
      { key: "phone", label: "טלפון" },
      { key: "profession", label: "" },
      { key: "residence", label: "עיר" },

    ];
    var hitPopUnit = "";

    function highlightMatch(text, query) {
      var raw = String(text == null ? "" : text);
      var q = clean(query);
      if (!q) return esc(raw);
      var idx = raw.toLowerCase().indexOf(q.toLowerCase());
      if (idx !== -1) {
        return esc(raw.slice(0, idx)) + "<mark>" + esc(raw.slice(idx, idx + q.length)) + "</mark>" + esc(raw.slice(idx + q.length));
      }
      var queryDigits = digits(q);
      if (!queryDigits) return esc(raw);
      var rawDigits = digits(raw);
      var digitAt = rawDigits.indexOf(queryDigits);
      if (digitAt === -1) return esc(raw);
      var seen = 0;
      var start = -1;
      var end = raw.length;
      for (var i = 0; i < raw.length; i++) {
        if (!/\d/.test(raw.charAt(i))) continue;
        if (seen === digitAt) start = i;
        if (seen === digitAt + queryDigits.length - 1) {
          end = i + 1;
          break;
        }
        seen += 1;
      }
      if (start === -1) return esc(raw);
      return esc(raw.slice(0, start)) + "<mark>" + esc(raw.slice(start, end)) + "</mark>" + esc(raw.slice(end));
    }

    function fieldContains(value, query) {
      var text = clean(value);
      var q = clean(query);
      if (!text || !q) return false;
      if (text.toLowerCase().indexOf(q.toLowerCase()) !== -1) return true;
      var queryDigits = digits(q);
      if (!queryDigits) return false;
      return digits(text).indexOf(queryDigits) !== -1;
    }

    function searchReasons(soldier, query, filters) {
      var hits = [];
      function addHit(label, value) {
        var text = clean(value);
        if (!text || !query || !fieldContains(text, query)) return;
        if (hits.some(function (item) { return item.label === label && item.value === text; })) return;
        hits.push({ label: label, value: text, hit: true });
      }
      HIT_FIELDS.forEach(function (field) { addHit(field.label, soldier[field.key]); });
      (soldier.transfers || []).forEach(function (move) {
        addHit("מיחידה", move.fromName);
        addHit("ליחידה", move.toName);
        addHit("סיבה", move.reason);
        addHit("בתאריך", move.date);
      });
      var extras = [];
      function addExtra(label, value) {
        var text = clean(value);
        if (!text) return;
        if (hits.concat(extras).some(function (item) { return item.label === label && item.value === text; })) return;
        extras.push({ label: label, value: text, hit: false });
      }
      if (filters && filters.cycle) addExtra("מחזור", soldier.cycle);
      if (filters && filters.tatash) addExtra("תת״ש", soldier.tatash);
      if (!hits.some(function (item) { return item.label === ""; })) addExtra("", soldier.profession);
      return hits.concat(extras).slice(0, 3);
    }

    function clearHitDesc() {
      var nodes = document.querySelectorAll("[aria-describedby='hit-pop']");
      for (var i = 0; i < nodes.length; i++) nodes[i].removeAttribute("aria-describedby");
    }

    function hideHitPop() {
      clearTimeout(hitPopTimer);
      var pop = document.getElementById("hit-pop");
      if (!pop) return;
      pop.hidden = true;
      pop.innerHTML = "";
      pop.classList.remove("has-color");
      pop.style.removeProperty("--unit");
      pop.style.removeProperty("width");
      hitPopUnit = "";
      clearHitDesc();
    }

    function placeHitPop(anchor) {
      var pop = document.getElementById("hit-pop");
      if (!pop || pop.hidden || !anchor) return;
      var profile = document.getElementById("profile");
      var rect = anchor.getBoundingClientRect();
      if (profile) {
        var box = profile.getBoundingClientRect();
        if (rect.bottom < box.top + 24 || rect.top > box.bottom - 24) {
          hideHitPop();
          return;
        }
      }
      var margin = 8;
      pop.style.width = Math.round(rect.width) + "px";
      var width = pop.offsetWidth;
      var height = pop.offsetHeight;
      var left = rect.left;
      if (left < margin) left = margin;
      if (left + width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - margin - width);
      var top = rect.top;
      if (top + height > window.innerHeight - margin) {
        top = Math.max(margin, window.innerHeight - margin - height);
      }
      if (top < margin) top = margin;
      pop.style.left = Math.round(left) + "px";
      pop.style.top = Math.round(top) + "px";
    }

    function finishHitPop() {
      clearTimeout(hitPopTimer);
      hitPopTimer = setTimeout(function () {
        var profile = document.getElementById("profile");
        var el = hitPointer.ready ? document.elementFromPoint(hitPointer.x, hitPointer.y) : null;
        var tile = el && el.closest && el.closest(".unit-tile.is-hit");
        if (tile && profile && profile.contains(tile)) showHitPop(tile);
        else hideHitPop();
      }, 40);
    }

    function showHitPop(tile) {
      clearTimeout(hitPopTimer);
      var pop = document.getElementById("hit-pop");
      if (!pop || !tile || state.colorUnit || !homeNarrowed()) {
        hideHitPop();
        return;
      }
      var openBtn = tile.querySelector("[data-action='open-unit'], [data-action='open-released'], [data-action='open-unassigned']");
      var action = openBtn ? openBtn.getAttribute("data-action") : "";
      var id = openBtn ? unitId(openBtn.getAttribute("data-unit")) : "";
      var unit = id && findUnit(id);
      var titleName = "";
      var popKey = "";
      var people = [];
      if (action === "open-unassigned") {
        titleName = "ללא יחידה";
        popKey = "outside";
        people = unassignedPeople();
      } else if (action === "open-released") {
        if (!unit) {
          hideHitPop();
          return;
        }
        titleName = unit.name;
        popKey = "released:" + id;
        people = releasedInUnit(id);
      } else {
        if (!unit) {
          hideHitPop();
          return;
        }
        titleName = unit.name;
        popKey = id;
        people = soldiersInUnit(id);
      }
      people = people.slice().sort(function (a, b) {
        return compareHe(a.name || "", b.name || "");
      });
      if (hitPopUnit === popKey && !pop.hidden) {
        placeHitPop(tile);
        return;
      }
      var query = homeSearchQuery();
      var queryRaw = clean(document.getElementById("search").value);
      var filters = homeScopeFilters();
      if (!people.length) {
        hideHitPop();
        return;
      }
      var detail = queryRaw || filterSummary(filters, "") || "סינון";
      var title = titleName + " · " + detail;
      var limit = 6;
      var rows = people.slice(0, limit).map(function (soldier) {
        var name = clean(soldier.name) || "ללא שם";
        var reasons = searchReasons(soldier, query, filters).map(function (reason) {
          var shown = reason.hit ? highlightMatch(reason.value, queryRaw) : esc(reason.value);
          return reason.label ? esc(reason.label) + " " + shown : shown;
        });
        var meta = reasons.join(" · ");
        if (isReleased(soldier)) meta = "משוחרר" + (meta ? " · " + meta : "");
        return '<li class="hit-pop-row' + (isReleased(soldier) ? " is-released" : "") + '">' +
          avatarMarkup(name, soldier.photo) +
          "<span><span class=\"hit-pop-name\">" + highlightMatch(name, queryRaw) + "</span>" +
          (meta ? '<span class="hit-pop-meta">' + meta + "</span>" : "") +
          "</span></li>";
      }).join("");
      var rest = people.length - Math.min(people.length, limit);
      var accent = action === "open-unit" ? unitAccent(unit) : "";
      pop.classList.toggle("has-color", Boolean(accent));
      if (accent) pop.style.setProperty("--unit", accent);
      else pop.style.removeProperty("--unit");
      pop.setAttribute("aria-label", title);
      pop.innerHTML =
        '<div class="hit-pop-head"><p class="hit-pop-title"><b>' + esc(titleName) + "</b> · " + esc(detail) + '</p><span class="pill-count">' + people.length + "</span></div>" +
        '<ul class="hit-pop-list">' + rows + "</ul>" +
        (rest ? '<p class="hit-pop-more">ועוד ' + rest + "</p>" : "");
      pop.hidden = false;
      hitPopUnit = popKey;
      clearHitDesc();
      if (openBtn) openBtn.setAttribute("aria-describedby", "hit-pop");
      placeHitPop(tile);
    }

    function syncHitPop() {
      var profile = document.getElementById("profile");
      if (!profile || !document.body.classList.contains("units-home") || !document.body.classList.contains("home-query") || state.colorUnit) {
        hideHitPop();
        return;
      }
      var active = document.activeElement && document.activeElement.closest && document.activeElement.closest(".unit-tile.is-hit");
      if (active && profile.contains(active)) {
        showHitPop(active);
        return;
      }
      if (!hitPointer.ready) {
        hideHitPop();
        return;
      }
      var el = document.elementFromPoint(hitPointer.x, hitPointer.y);
      var tile = el && el.closest && el.closest(".unit-tile.is-hit");
      if (tile && profile.contains(tile)) showHitPop(tile);
      else hideHitPop();
    }

      var narrowed = homeNarrowed();
      var cards = [];

        var people = releasedInUnit(unit.id);
        if (!people.length) return;

        }));

    function openUnassigned(key, kind) {
      state.outsideOpen = true;
      state.outsideKind = kind === "fresh" ? "fresh" : "departed";
      state.releasedOpen = false;
      state.unitsHome = false;
      state.logOpen = false;
      state.unitOpen = false;
      state.creating = false;
      state.editingIndex = -1;
      state.transferring = false;
      state.transferError = "";

      state.shalishutOpen = false;
      closeUnitEditor();
      closeShalishutEditor();

    function blankIntake() {
      var draft = {};
      FIELDS.forEach(function (field) { draft[field.key] = ""; });
      draft.photo = "";
      return draft;
    }

    function captureIntake() {
      var form = document.querySelector(".intake-form");
      if (!form) return;
      var data = {};
      FIELDS.forEach(function (field) {
        data[field.key] = field.cycles ? cycleStored(form) : fieldStored(field, form.elements[field.key]);
      });
      var photoInput = form.elements.photo;
      data.photo = safePhoto(photoInput ? photoInput.value : "");

    }

    function renderIntake() {
      var draft = state.intake || blankIntake();
      var open = Boolean(state.intakeOpen);

            "</div>" +

    function renderFreshBoard() {
      var people = freshPeople().slice().sort(function (a, b) {
        return compareHe(a.name || "", b.name || "");
      });
      var count = people.length;
      var lead = count
        ? count + " " + countWord(count, "חייל ממתין לשיבוץ", "חיילים ממתינים לשיבוץ")
        : "חייל בלי יחידה נשמר כאן, עד שבוחרים לו יחידה.";
      var queryRaw = clean(document.getElementById("search").value);
      var rows = people.map(function (soldier) {
        var name = clean(soldier.name) || "ללא שם";
        var meta = [clean(soldier.profession), clean(soldier.personalId)].filter(Boolean).join(" · ");
        return '<button class="fresh-row" type="button" draggable="true" data-action="open-fresh" data-key="' + esc(keyOf(soldier)) + '" title="גרירה אל כרטיס יחידה">' +
          avatarMarkup(name, soldier.photo) +
          '<span class="fresh-copy"><span class="fresh-name">' + highlight(name, queryRaw) + "</span>" +
          (meta ? '<span class="fresh-meta">' + highlight(meta, queryRaw) + "</span>" : "") +
          "</span></button>";
      }).join("");
      var list = rows
        ? '<p class="fresh-drag-note">אפשר לגרור חייל אל כרטיס היחידה כדי לשבץ אותו.</p><div class="fresh-list">' + rows + "</div>"
        : (homeNarrowed() ? "" : '<p class="fresh-empty">אין כרגע חיילים שממתינים לשיבוץ.</p>');
      return '<section class="fresh-board" aria-label="חיילים חדשים ללא יחידה">' +
        '<div class="home-lead"><h2>חיילים חדשים ללא יחידה</h2><p>' + esc(lead) + "</p></div>" +
        list +
      "</section>";

    function commitIntake(form) {
      var digitsMessage = digitsFieldMessage(form);
      if (digitsMessage) {
        captureIntake();
        state.intakeError = digitsMessage;
        state.intakeNote = "";
        render({ focusIntake: "phone" });
        return;
      }
      var soldier = soldierFromForm(form);
      var name = clean(soldier.name);
      var profession = clean(soldier.profession);
      var unit = unitId(soldier.unit);
      var personalId = clean(soldier.personalId);
      if (!name) {
        captureIntake();
        state.intakeError = "צריך שם";
        state.intakeNote = "";
        render({ focusIntake: "name" });
        return;
      }
      if (!profession) {
        captureIntake();
        state.intakeError = "בחרו מקצוע";
        state.intakeNote = "";
        render({ focusIntake: "profession" });
        return;
      }
      if (personalId && SOLDIERS.some(function (existing) { return clean(existing.personalId) === personalId; })) {
        captureIntake();
        state.intakeError = "כבר יש חייל עם המ״א הזה";
        state.intakeNote = "";
        render({ focusIntake: "personalId" });
        return;
      }
      soldier.unit = unit;
      soldier.external = "";
      soldier.transfers = [];
      SOLDIERS.push(soldier);
      try {
        persist();
      } catch (err) {
        SOLDIERS.pop();
        captureIntake();
        state.intakeError = "אין מספיק מקום לשמור";
        state.intakeNote = "";
        render({ focusIntake: "name" });
        return;
      }
      var next = blankIntake();
      next.profession = profession;
      next.unit = unit;
      state.intakeOpen = true;
      state.intakeError = "";
      state.intake = next;
      state.intakeNote = unit ? "נוסף ל" + unitName(unit) : "נוסף לחיילים ללא יחידה";
      state.intakeLand = {
        kind: unit ? "unit" : "fresh",
        id: unit,
        key: keyOf(soldier),
        name: name
      };
      render({ focusIntake: "name" });
    }

    var freshDragKey = "";
    var suppressFreshClick = false;

    function clearFreshDrop() {
      var marked = document.querySelectorAll(".unit-tile.is-drop");
      for (var i = 0; i < marked.length; i++) marked[i].classList.remove("is-drop");
    }

    function assignFreshToUnit(key, unitIdValue) {
      var unit = unitId(unitIdValue);
      if (!key || !unit) return;
      var index = -1;
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (keyOf(SOLDIERS[i]) !== key || !freshUnassigned(SOLDIERS[i])) continue;
        index = i;
        break;
      }
      if (index < 0) return;
      var soldier = SOLDIERS[index];
      var name = clean(soldier.name) || "ללא שם";
      var fromRow = document.querySelector('.fresh-row[data-key="' + (window.CSS && CSS.escape ? CSS.escape(key) : String(key).replace(/"/g, "")) + '"]');
      var from = fromRow ? fromRow.getBoundingClientRect() : null;
      soldier.unit = unit;
      try {
        persist();
      } catch (err) {
        soldier.unit = "";
        window.alert("אין מספיק מקום לשמור.");
        return;
      }
      state.intakeLand = {
        kind: "unit",
        id: unit,
        key: keyOf(soldier),
        name: name,
        from: from && from.width ? { left: from.left, top: from.top, width: from.width, height: from.height } : null
      };
      render();
    }

    function bindFreshDrag(profile) {
      profile.addEventListener("dragstart", function (event) {
        var row = event.target.closest && event.target.closest(".fresh-row");
        if (!row || !state.unitsHome) return;
        freshDragKey = row.getAttribute("data-key") || "";
        suppressFreshClick = true;
        if (event.dataTransfer) {
          event.dataTransfer.setData("text/plain", freshDragKey);
          event.dataTransfer.effectAllowed = "move";
        }
        row.classList.add("is-dragging");
      });
      profile.addEventListener("dragend", function (event) {
        var row = event.target.closest && event.target.closest(".fresh-row");
        if (row) row.classList.remove("is-dragging");
        clearFreshDrop();
        freshDragKey = "";
        window.setTimeout(function () { suppressFreshClick = false; }, 0);
      });
      profile.addEventListener("dragover", function (event) {
        if (!freshDragKey) return;
        var tile = event.target.closest && event.target.closest(".unit-tile");
        var openBtn = tile && tile.querySelector("[data-action='open-unit']");
        if (!openBtn) return;
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
        if (!tile.classList.contains("is-drop")) {
          clearFreshDrop();
          tile.classList.add("is-drop");
        }
      });
      profile.addEventListener("dragleave", function (event) {
        var tile = event.target.closest && event.target.closest(".unit-tile");
        if (!tile || tile.contains(event.relatedTarget)) return;
        tile.classList.remove("is-drop");
      });
      profile.addEventListener("drop", function (event) {
        var tile = event.target.closest && event.target.closest(".unit-tile");
        var openBtn = tile && tile.querySelector("[data-action='open-unit']");
        if (!openBtn || !freshDragKey) return;
        event.preventDefault();
        var key = freshDragKey;
        if (event.dataTransfer) key = event.dataTransfer.getData("text/plain") || key;
        clearFreshDrop();
        freshDragKey = "";
        window.setTimeout(function () { suppressFreshClick = false; }, 0);
        assignFreshToUnit(key, openBtn.getAttribute("data-unit"));
      });
    }

    function playIntakeLand() {
      var land = state.intakeLand;
      if (!land) return;
      state.intakeLand = null;
      if (land.kind === "fresh") {
        var safeKey = window.CSS && CSS.escape ? CSS.escape(land.key) : String(land.key).replace(/"/g, "\\$&");
        var row = document.querySelector('.fresh-row[data-key="' + safeKey + '"]');
        if (row && motionOk()) {
          window.requestAnimationFrame(function () {
            if (row.isConnected) row.classList.add("is-just-added");
          });
        }
        return;
      }
      var openBtn = document.querySelector(unitTileSelector(land.id));
      var tile = openBtn && openBtn.closest(".unit-tile");
      if (!tile) return;
      var count = tile.querySelector(".unit-tile-count");
      if (count) count.classList.add("is-bump");
      tile.classList.add("is-received");
      if (!motionOk()) return;
      var from = land.from;
      if (!from) {
        var fromEl = document.querySelector(".intake-form .btn-primary");
        if (!fromEl) return;
        from = fromEl.getBoundingClientRect();
      }
      var target = count || tile;
      var to = target.getBoundingClientRect();
      var scroller = document.getElementById("profile");
      var view = scroller ? scroller.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
      var seen = to.width > 0 && to.top < view.bottom - 12 && to.bottom > view.top + 12;
      var chip = document.createElement("div");
      chip.className = "intake-flight";
      chip.setAttribute("aria-hidden", "true");
      chip.innerHTML = '<span class="intake-flight-mark" style="' + avatarStyle(land.name) + '">' + esc(initials(land.name)) + "</span><span>" + esc(land.name) + "</span>";
      document.body.appendChild(chip);
      var startLeft = from.left + Math.max(0, (from.width - 140) / 2);
      var startTop = from.top + from.height / 2 - 18;
      chip.style.left = startLeft + "px";
      chip.style.top = startTop + "px";
      var endLeft = seen ? to.left + Math.min(24, Math.max(0, to.width / 2 - 50)) : startLeft;
      var endTop = seen ? to.top + Math.max(0, to.height / 2 - 18) : Math.min(view.bottom - 36, startTop + 72);
      var dx = endLeft - startLeft;
      var dy = endTop - startTop;
      var anim = chip.animate([
        { transform: "translate(0px, 0px) scale(0.92)", opacity: 0 },
        { transform: "translate(" + (dx * 0.42) + "px," + (dy * 0.28 - 12) + "px) scale(1)", opacity: 1, offset: 0.38 },
        { transform: "translate(" + dx + "px," + dy + "px) scale(" + (seen ? "0.84" : "0.92") + ")", opacity: seen ? 0.15 : 0 }
      ], {
        duration: 640,
        easing: "cubic-bezier(0.22, 1, 0.36, 1)",
        fill: "forwards"
      });

    function renderUnitsHome(opts) {

        : totalUnits + " " + countWord(totalUnits, "יחידה", "יחידות") + " · " + totalSoldiers + " " + countWord(totalSoldiers, "חייל", "חיילים");
      document.body.classList.toggle("home-query", narrowed);

      var profile = document.getElementById("profile");

          renderArchiveBoard() +
        "</div>";
      document.getElementById("add-btn").hidden = true;

        document.getElementById("live").textContent = announce;

      if (!opts.focusPalette && !opts.focusUnit && !opts.openEditor) profile.scrollTop = scrollTop;

          if (tile) tile.scrollIntoView({ block: "nearest" });

      if (opts.intro && motionOk()) {

        var introHead = profile.querySelector(".units-board-head");
        if (introHead) introHead.classList.add("is-intro");

          }, 680 + Math.max(0, introCards.length - 1) * 42);

    var motionToken = 0;

    function motionOk() {
      return !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function clearFlights() {
      var flights = document.querySelectorAll(".unit-flight");
      for (var i = 0; i < flights.length; i++) flights[i].remove();
    }

    function clearMotionClasses() {
      var roster = document.querySelector(".roster-column");
      var sidebar = document.querySelector(".sidebar");
      if (roster) roster.classList.remove("is-held", "is-arriving", "is-leaving");
      if (sidebar) sidebar.classList.remove("is-arriving", "is-leaving");

      for (var i = 0; i < parked.length; i++) {
        parked[i].classList.remove("is-landing");

    function unitTileSelector(id) {
      var safe = window.CSS && CSS.escape ? CSS.escape(id) : String(id).replace(/"/g, "");
      return '#units-board [data-action="open-unit"][data-unit="' + safe + '"]';
    }

    function hitTileFor(key) {
      if (!key) return null;
      if (key === "outside") {
        var outsideBtn = document.querySelector('#units-board [data-action="open-unassigned"]');
        return outsideBtn && outsideBtn.closest(".unit-tile");
      }
      if (String(key).indexOf("released:") === 0) {
        var releasedId = String(key).slice("released:".length);
        var safe = window.CSS && CSS.escape ? CSS.escape(releasedId) : releasedId.replace(/"/g, "");
        var releasedBtn = document.querySelector('#units-board [data-action="open-released"][data-unit="' + safe + '"]');
        return releasedBtn && releasedBtn.closest(".unit-tile");
      }
      var openHit = document.querySelector(unitTileSelector(key));
      return openHit && openHit.closest(".unit-tile");
    }

    function placeFlight(clone, rect) {
      clone.style.top = rect.top + "px";
      clone.style.left = rect.left + "px";
      clone.style.width = rect.width + "px";
      clone.style.height = rect.height + "px";
      clone.style.transformOrigin = "center center";
    }

    function flyClone(clone, from, to, done, opts) {
      opts = opts || {};
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        if (done) done();
      }
      if (!to.width || !to.height || !from.width || !from.height) {
        finish();
        return;
      }
      var scale = Math.min(to.width / from.width, to.height / from.height);
      var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
      var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
      clone.style.transformOrigin = "center center";
      var end = "translate(" + dx + "px," + dy + "px) scale(" + scale + ")";
      var frames = [{ transform: "none", boxShadow: "0 8px 22px rgba(16, 24, 40, 0.08)", offset: 0 }];
      if (opts.approach) {
        frames.push({
          transform: "translate(" + (dx * 0.42) + "px," + (dy * 0.24 - 8) + "px) scale(" + (scale * 1.05) + ")",
          boxShadow: "0 28px 60px rgba(16, 24, 40, 0.18)",
          offset: 0.46
        });
      }
      frames.push({ transform: end, boxShadow: "0 8px 22px rgba(16, 24, 40, 0.06)", offset: 1 });
      var anim = clone.animate(frames, {
        duration: opts.approach ? 880 : 640,
        easing: "cubic-bezier(0.16, 1, 0.3, 1)",
        fill: "both"
      });
      anim.onfinish = finish;
      anim.oncancel = finish;
    }

    function fallCard(node) {
      var rect = node.getBoundingClientRect();
      if (!rect.width) return;
      var clone = node.cloneNode(true);
      clone.classList.remove("is-dismissed", "is-chosen");
      clone.classList.add("unit-flight", "is-falling");
      clone.setAttribute("aria-hidden", "true");
      document.body.appendChild(clone);
      placeFlight(clone, rect);
      var fade = clone.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration: 120, easing: "ease", fill: "forwards" }
      );
      fade.onfinish = function () { clone.remove(); };
    }

    function fadeFlight(clone) {
      var fade = clone.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: "ease", fill: "forwards" });
      fade.onfinish = function () { clone.remove(); };
    }

    function revealEnteredUnit(token) {
      settleEnteredUnit(token, true);
    }

    function settleEnteredUnit(token, immediate) {
      if (token !== motionToken) return;
      var back = document.querySelector(".back-units");
      var roster = document.querySelector(".roster-column");
      var sidebar = document.querySelector(".sidebar");
      var dest = document.querySelector("#unit-picker .unit-tile");
      if (dest) dest.classList.remove("is-landing");
      if (back) back.classList.remove("is-held");
      if (sidebar) {
        sidebar.classList.add("is-emerging");
        window.setTimeout(function () { sidebar.classList.remove("is-emerging"); }, 560);
      }
      window.setTimeout(function () {
        if (token !== motionToken) return;
        if (!roster) return;
        roster.classList.remove("is-held");
        roster.classList.add("is-emerging");
        window.setTimeout(function () { roster.classList.remove("is-emerging"); }, 980);
        if (back) back.focus();
      }, immediate ? 0 : 130);
    }

    function beginEnterUnit(id) {
      id = unitId(id);
      if (!id) return;
      if (!state.unitsHome || !motionOk()) {
        enterUnit(id);
        return;
      }
      var openBtn = document.querySelector(unitTileSelector(id));
      var tile = openBtn && openBtn.closest(".unit-tile");
      if (!tile) {
        enterUnit(id);
        return;
      }
      var token = ++motionToken;
      clearFlights();
      var from = tile.getBoundingClientRect();
      var board = document.getElementById("units-board");
      var nodes = board ? board.querySelectorAll(".unit-tile, .unit-tile-add") : [];
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i] !== tile) fallCard(nodes[i]);
      }
      var clone = tile.cloneNode(true);
      clone.classList.remove("is-chosen");
      clone.classList.add("unit-flight");
      clone.setAttribute("aria-hidden", "true");
      document.body.appendChild(clone);
      placeFlight(clone, from);
      enterUnit(id);
      if (token !== motionToken) {
        clone.remove();
        return;
      }
      var picker = document.getElementById("unit-picker");
      if (picker && from.width) picker.style.setProperty("--unit-card-w", Math.round(from.width) + "px");
      var dest = document.querySelector("#unit-picker .unit-tile");
      var back = document.querySelector(".back-units");
      var roster = document.querySelector(".roster-column");
      if (back) back.classList.add("is-held");
      if (roster) roster.classList.add("is-held");
      if (dest) dest.classList.add("is-landing");
      if (!dest || !from.width) {
        clone.remove();
        revealEnteredUnit(token);
        return;
      }
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          if (token !== motionToken) {
            clone.remove();
            return;
          }
          var to = visualRect(dest);
          flyClone(clone, from, to, function () {
            if (token !== motionToken) {
              clone.remove();
              return;
            }
            fadeFlight(clone);
            settleEnteredUnit(token, false);
          }, { approach: true });
        });
      });
    }

    function visualRect(el) {
      var rect = el.getBoundingClientRect();
      var zoom = parseFloat(window.getComputedStyle(el).zoom);
      if (!zoom || !isFinite(zoom) || zoom <= 0) zoom = 1;
      var layoutW = el.offsetWidth || rect.width;
      var includesZoom = Math.abs(zoom - 1) < 0.02 || Math.abs(rect.width - layoutW * zoom) <= Math.abs(rect.width - layoutW);
      if (includesZoom) return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
      return {
        left: rect.left * zoom,
        top: rect.top * zoom,
        width: rect.width * zoom,
        height: rect.height * zoom
      };
    }

    function cardFlightBox(article) {
      var visual = visualRect(article);
      var layoutW = article.offsetWidth;
      var layoutH = article.offsetHeight;
      var palette = article.querySelector(".palette");
      if (palette) {
        var paletteStyle = getComputedStyle(palette);
        var extra = palette.offsetHeight + (parseFloat(paletteStyle.marginTop) || 0) + (parseFloat(paletteStyle.marginBottom) || 0);
        var zoom = layoutW ? visual.width / layoutW : 1;
        layoutH -= extra;
        visual = { left: visual.left, top: visual.top, width: visual.width, height: visual.height - extra * zoom };
      }
      if (!visual.width || !visual.height || !layoutW || layoutH < 1) return null;
      return {
        left: visual.left,
        top: visual.top,
        width: layoutW,
        height: layoutH,
        scale: visual.width / layoutW
      };
    }

    function spawnHomeFlight(article) {
      var origin = cardFlightBox(article);
      if (!origin) return null;
      var clone = article.cloneNode(true);
      clone.classList.remove("is-landing", "is-chosen", "is-held", "is-leaving");
      var palette = clone.querySelector(".palette");
      if (palette) palette.remove();
      var host = document.createElement("div");
      host.className = "unit-grid unit-flight-host";
      host.appendChild(clone);
      var shell = document.createElement("div");
      shell.className = "unit-flight";
      shell.setAttribute("aria-hidden", "true");
      shell.style.left = origin.left + "px";
      shell.style.top = origin.top + "px";
      shell.style.width = origin.width + "px";
      shell.style.height = origin.height + "px";
      shell.style.transformOrigin = "0 0";
      shell.style.transform = "scale(" + origin.scale + ")";
      shell.appendChild(host);
      document.body.appendChild(shell);
      article.classList.add("is-landing");
      origin.shell = shell;
      return origin;
    }

    function placeReturningTile(tile) {
      var scroller = document.querySelector(".profile-scroll");
      if (!tile || !scroller) return;
      var tileRect = tile.getBoundingClientRect();
      var box = scroller.getBoundingClientRect();
      var pad = 20;
      if (tileRect.top >= box.top + pad && tileRect.bottom <= box.bottom - pad) return;
      var next = scroller.scrollTop + (tileRect.top - box.top) - Math.max(12, (box.height - tileRect.height) / 2);
      var max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      if (next < 0) next = 0;
      if (next > max) next = max;
      scroller.scrollTop = next;
    }

    function flyHome(shell, origin, to, done) {
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        if (done) done();
      }
      if (!shell || !to.width || !origin.width) {
        finish();
        return;
      }
      var dx = to.left - origin.left;
      var dy = to.top - origin.top;
      var endScale = to.width / origin.width;
      var anim = shell.animate([
        { transform: "translate(0px, 0px) scale(" + origin.scale + ")" },
        { transform: "translate(" + dx + "px, " + dy + "px) scale(" + endScale + ")" }
      ], {
        duration: 580,
        easing: "cubic-bezier(0.22, 1, 0.36, 1)",
        fill: "both"
      });
      anim.onfinish = finish;
      anim.oncancel = finish;
    }

    function beginShowUnitsHome() {
      if (state.unitsHome || state.outsideOpen || state.releasedOpen || !motionOk()) {
        showUnitsHome();
        return;
      }
      var token = ++motionToken;
      clearFlights();
      var article = document.querySelector("#unit-picker .unit-tile");
      var visual = article && article.querySelector(".unit-tile-static");
      var returningId = state.unit;
      var flight = visual ? spawnHomeFlight(article) : null;
      var roster = document.querySelector(".roster-column");
      var back = document.querySelector(".back-units");
      var sidebar = document.querySelector(".sidebar");
      if (roster) roster.classList.add("is-leaving");
      if (back) back.classList.add("is-leaving");
      if (sidebar) sidebar.classList.add("is-leaving");
      window.setTimeout(function () {
        if (token !== motionToken) {
          if (flight) flight.shell.remove();
          return;
        }
        showUnitsHome();
        if (token !== motionToken) {
          if (flight) flight.shell.remove();
          return;
        }
        var board = document.getElementById("units-board");
        var grid = board ? board.querySelector(".unit-grid") : null;
        var head = board ? board.querySelector(".units-board-head") : null;
        if (board) board.classList.add("is-returning");
        if (grid) grid.classList.add("is-arriving");
        if (head) head.classList.add("is-arriving");
        var landed = document.querySelector(unitTileSelector(returningId));
        var tile = landed && landed.closest(".unit-tile");
        if (tile) tile.classList.add("is-landing");
        if (grid) {
          var cards = grid.children;
          for (var cardIndex = 0; cardIndex < cards.length; cardIndex++) {
            cards[cardIndex].style.setProperty("--enter", String(cardIndex));
          }
        }
        placeReturningTile(tile);
        var cardCount = grid ? grid.children.length : 0;
        window.setTimeout(function () {
          if (token !== motionToken) return;
          if (board && board.isConnected) board.classList.remove("is-returning");
          if (grid && grid.isConnected) grid.classList.remove("is-arriving");
          if (head && head.isConnected) head.classList.remove("is-arriving");
          if (tile && tile.isConnected) {
            tile.classList.remove("is-landing");
            tile.classList.remove("is-settled");
          }
        }, Math.max(640, 460 + Math.max(0, cardCount - 1) * 32) + 80);
        if (!flight || !tile) {
          if (flight) flight.shell.remove();
          if (tile) tile.classList.remove("is-landing");
          return;
        }
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            if (token !== motionToken || !flight.shell.isConnected) return;
            if (!tile.isConnected) {
              flight.shell.remove();
              return;
            }
            flyHome(flight.shell, flight, visualRect(tile), function () {
              if (!flight.shell.isConnected) return;
              if (tile.isConnected) {
                tile.classList.add("is-settled");
                tile.classList.remove("is-landing");
                var openBtn = tile.querySelector("[data-action='open-unit']");
                if (openBtn) openBtn.focus({ preventScroll: true });
              }
              flight.shell.remove();
            });
          });
        });
      }, 160);
    }

    function showUnitsHome() {
      clearMotionClasses();
      state.unitsHome = true;
      state.unitOpen = false;
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.logOpen = false;
      state.outsideOpen = false;
      state.releasedOpen = false;
      state.profileOpen = false;
      state.shalishutOpen = false;
      state.selectedKey = "";
      closeShalishutEditor();
      closeUnitEditor();
      render();

    function enterUnit(id, opts) {
      opts = opts || {};
      id = unitId(id);
      if (!id) return;
      clearMotionClasses();
      var fromHome = state.unitsHome;
      var entering = fromHome || id !== state.unit;
      state.unitsHome = false;
      state.outsideOpen = false;
      state.releasedOpen = false;
      state.unitOpen = false;
      closeUnitEditor();
      if (id !== state.unit) {
        state.unit = id;
        saveUnit();

      if (entering) resetRosterView({ keepSearch: fromHome });
      if (opts.shalishut) {
        state.creating = false;
        state.editingIndex = -1;
        state.shalishutOpen = true;

      render(opts.shalishut ? { focusShalishut: true } : {});

    function enterReleased(id) {
      id = unitId(id);
      if (!id) return;
      clearMotionClasses();
      var fromHome = state.unitsHome;
      state.unitsHome = false;
      state.outsideOpen = false;
      state.unitOpen = false;
      closeUnitEditor();
      if (id !== state.unit) {
        state.unit = id;
        saveUnit();
      }
      resetRosterView({ keepSearch: fromHome });
      state.releasedOpen = true;
      render();
    }

    function commanderLine(role, unit, linkPhone) {
      var name = clean(unit[role.name]);
      var phone = clean(unit[role.phone]);
      var hasName = present(name);
      var hasPhone = present(phone);
      var phoneHtml = "";
      if (hasPhone) {
        phoneHtml = linkPhone && digits(phone).length >= 7
          ? '<a class="unit-commander-phone" href="tel:' + esc(digits(phone)) + '"><bdi dir="ltr">' + esc(phone) + "</bdi></a>"
          : '<bdi class="unit-commander-phone" dir="ltr">' + esc(phone) + "</bdi>";
      }
      var nameHtml = hasName
        ? '<span class="unit-commander-name" title="' + esc(name) + '">' + esc(name) + "</span>"
        : (hasPhone ? "" : '<span class="unit-commander-name">לא הוגדר</span>');
      if (hasName) {
        nameHtml = '<span class="unit-commander-name-wrap">' + nameHtml +
          copyButton(name, "העתק שם " + role.label, "unit-commander-copy", linkPhone ? "button" : "span") +
          "</span>";
      }
      return '<span class="unit-commander' + (!hasName && !hasPhone ? " is-missing" : "") + '">' +
        '<span class="unit-commander-role">' + esc(role.label) + "</span>" +
        '<span class="unit-commander-line">' + nameHtml + phoneHtml + "</span></span>";
    }

    function unitCommandersHtml(unit, linkPhone) {
      return SHALISHUT_ROLES.map(function (role) {
        return commanderLine(role, unit, linkPhone);
      }).join("");
    }

    function unitCardView(unit, interactive) {
      var accent = unitAccent(unit);
      var editing = state.unitEdit === unit.id;
      var sub = present(unit.shalishutName) ? clean(unit.shalishutName) : (present(unit.organ) ? clean(unit.organ) : "");
      var narrowed = homeNarrowed();
      var people = soldiersInUnit(unit.id);
      var count = people.length;
      var chipSource = people;
      var professions = {};
      chipSource.forEach(function (soldier) {
        var name = clean(soldier.profession) || "ללא מקצוע";
        professions[name] = (professions[name] || 0) + 1;
      });
      var chipNames = Object.keys(professions).sort(compareHe);
      var chips = chipNames.map(function (name) {

            '<span class="unit-tile-head">' +
              '<span class="unit-tile-name-line">' +
                '<span class="unit-tile-name">' + esc(unit.name) + "</span>" +
                (quota.split ? "" : quota.html) +
              "</span>" +
              (quota.split ? quota.html : "") +
              '<span class="unit-tile-sub' + (sub ? "" : " is-missing") + '"' + (sub ? ' title="' + esc(sub) + '"' : "") + ">" + esc(sub || "לא הוגדר") + "</span>" +
            "</span>" +
            '<span class="unit-tile-stat">' +
              '<span class="unit-tile-figure">' +
                '<span class="unit-tile-count">' + count + "</span>" +
                ofTotal +
                '<span class="unit-tile-count-label">' + esc(countWord(narrowed ? rosterCount : count, "חייל", "חיילים")) + "</span>" +
              "</span>" +
              '<span class="unit-tile-chips"' + (chipTitle ? ' title="' + esc(chipTitle) + '"' : "") + ">" + chips + "</span>" +
            "</span>" +
            gap.html +
            '<span class="unit-commanders">' + unitCommandersHtml(unit, !interactive) + "</span>" +
            '<span class="unit-tile-enter">הצגת חיילים</span>' +
          (interactive ? "</button>" : "</div>");
      var tools = editing ? "" :
        '<div class="unit-tile-tools">' +
          '<button class="unit-color-btn" type="button" data-action="pick-color" data-unit="' + esc(unit.id) + '" title="צבע היחידה" aria-label="צבע של ' + esc(unit.name) + '" aria-expanded="' + (state.colorUnit === unit.id ? "true" : "false") + '">' + colorFill(unitColor(unit)) + "</button>" +
          '<button class="icon-btn" type="button" data-action="edit-unit" data-unit="' + esc(unit.id) + '" title="עריכת היחידה" aria-label="עריכת ' + esc(unit.name) + '">' + svg("pencil", 16) + "</button>" +
        "</div>";
      var searchState = !editing && interactive && narrowed ? (count ? " is-hit" : " is-quiet") : "";
      return '<article class="unit-tile' + (editing ? " is-editing" : "") + searchState + (accent ? " has-color" : "") + '"' + (accent ? ' style="--unit:' + accent + '"' : "") + ">" +
        body + tools +
      "</article>";
    }

    function renderUnitSide() {
      var picker = document.getElementById("unit-picker");
      if (state.outsideOpen || state.releasedOpen) {
        var freshView = state.outsideOpen && state.outsideKind === "fresh";
        var sideUnit = state.releasedOpen ? currentUnit() : null;
        var sideCount = state.releasedOpen
          ? (sideUnit ? unitReleasedCount(sideUnit.id) : 0)
          : SOLDIERS.filter(freshView ? freshUnassigned : function (soldier) {
            return isUnassigned(soldier) && !freshUnassigned(soldier);
          }).length;
        var sideName = state.releasedOpen ? (sideUnit ? sideUnit.name : "") : (freshView ? "חיילים חדשים" : "ללא יחידה");
        var sideSub = state.releasedOpen ? "משוחררים" : (freshView ? "ממתינים לשיבוץ ליחידה" : "חיילים שיצאו משיבוץ, מכל סיבה");
        var sideOne = state.releasedOpen ? "משוחרר" : "חייל";
        var sideMany = state.releasedOpen ? "משוחררים" : "חיילים";
        picker.innerHTML =

          '<article class="unit-tile archive-card">' +
            '<div class="unit-tile-open unit-tile-static">' +
              '<span class="unit-tile-name">' + esc(sideName) + "</span>" +
              '<span class="unit-tile-sub">' + esc(sideSub) + "</span>" +
              '<span class="unit-tile-count">' + sideCount + "</span>" +
              '<span class="unit-tile-count-label">' + esc(countWord(sideCount, sideOne, sideMany)) + "</span>" +

    function resetRosterView(opts) {
      opts = opts || {};
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.selectedKey = "";
      state.prevKey = "";
      state.profileOpen = false;
      state.shalishutOpen = false;
