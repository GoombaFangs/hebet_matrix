        parked[i].classList.remove("is-held");
      }
    }

    function unitTileSelector(id) {
      var safe = window.CSS && CSS.escape ? CSS.escape(id) : String(id).replace(/"/g, "");
      return '#units-board [data-action="open-unit"][data-unit="' + safe + '"]';
    }

    function hitTileFor(key) {
      if (!key) return null;
      if (key === "outside") {
        var outsideBtn = document.querySelector('#units-board [data-action="open-unassigned"]');
        return outsideBtn && outsideBtn.closest(".unit-tile");
      }
      if (String(key).indexOf("released:") === 0) {
        var releasedId = String(key).slice("released:".length);
        var safe = window.CSS && CSS.escape ? CSS.escape(releasedId) : releasedId.replace(/"/g, "");
        var releasedBtn = document.querySelector('#units-board [data-action="open-released"][data-unit="' + safe + '"]');
        return releasedBtn && releasedBtn.closest(".unit-tile");
      }
      var openHit = document.querySelector(unitTileSelector(key));
      return openHit && openHit.closest(".unit-tile");
    }

    function placeFlight(clone, rect) {
      clone.style.top = rect.top + "px";
      clone.style.left = rect.left + "px";
      clone.style.width = rect.width + "px";
      clone.style.height = rect.height + "px";
      clone.style.transformOrigin = "center center";
    }

    function flyClone(clone, from, to, done, opts) {
      opts = opts || {};
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        if (done) done();
      }
      if (!to.width || !to.height || !from.width || !from.height) {
        finish();
        return;
      }
      var scale = Math.min(from.width / to.width, from.height / to.height);
      var dx = (from.left + from.width / 2) - (to.left + to.width / 2);
      var dy = (from.top + from.height / 2) - (to.top + to.height / 2);
      clone.style.top = to.top + "px";
      clone.style.left = to.left + "px";
      clone.style.width = to.width + "px";
      clone.style.height = to.height + "px";
      clone.style.transformOrigin = "center center";
      var start = "translate(" + dx + "px," + dy + "px) scale(" + scale + ")";
      var frames = [{ transform: start, boxShadow: "0 8px 22px rgba(16, 24, 40, 0.08)", offset: 0 }];
      if (opts.approach) {
        frames.push({
          transform: "translate(" + (dx * 0.36) + "px," + (dy * 0.2 - 12) + "px) scale(" + (scale * 1.065) + ")",
          boxShadow: "0 28px 60px rgba(16, 24, 40, 0.18)",
          offset: 0.42
        });
      }
      frames.push({ transform: "none", boxShadow: "0 8px 22px rgba(16, 24, 40, 0.06)", offset: 1 });
      clone.style.transform = start;
      var anim = clone.animate(frames, {
        duration: opts.approach ? 880 : 640,
        easing: "cubic-bezier(0.16, 1, 0.3, 1)",
        fill: "both"
      });
      anim.onfinish = finish;
      anim.oncancel = finish;
    }

    function fallCard(node) {
      var rect = node.getBoundingClientRect();
      if (!rect.width) return;
      var clone = node.cloneNode(true);
      clone.classList.remove("is-dismissed", "is-chosen");
      clone.classList.add("unit-flight", "is-falling");
      clone.setAttribute("aria-hidden", "true");
      document.body.appendChild(clone);
      placeFlight(clone, rect);
      var fade = clone.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration: 120, easing: "ease", fill: "forwards" }
      );
      fade.onfinish = function () { clone.remove(); };
    }

    function fadeFlight(clone) {
      var fade = clone.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: "ease", fill: "forwards" });
      fade.onfinish = function () { clone.remove(); };
    }

    function revealEnteredUnit(token) {
      settleEnteredUnit(token, true);
    }

    function settleEnteredUnit(token, immediate) {
      if (token !== motionToken) return;
      var back = document.querySelector(".back-units");
      var roster = document.querySelector(".roster-column");
      var sidebar = document.querySelector(".sidebar");
      var dest = document.querySelector("#unit-picker .unit-tile");
      if (dest) dest.classList.remove("is-landing");
      if (back) back.classList.remove("is-held");
      if (sidebar) {
        sidebar.classList.add("is-emerging");
        window.setTimeout(function () { sidebar.classList.remove("is-emerging"); }, 560);
      }
      window.setTimeout(function () {
        if (token !== motionToken) return;
        if (!roster) return;
        roster.classList.remove("is-held");
        roster.classList.add("is-emerging");
        window.setTimeout(function () { roster.classList.remove("is-emerging"); }, 980);
        if (back) back.focus();
      }, immediate ? 0 : 130);
    }

    function beginEnterUnit(id) {
      id = unitId(id);
      if (!id) return;
      if (!state.unitsHome || !motionOk()) {
        enterUnit(id);
        return;
      }
      var openBtn = document.querySelector(unitTileSelector(id));
      var tile = openBtn && openBtn.closest(".unit-tile");
      if (!tile) {
        enterUnit(id);
        return;
      }
      var token = ++motionToken;
      clearFlights();
      var from = tile.getBoundingClientRect();
      var board = document.getElementById("units-board");
      var nodes = board ? board.querySelectorAll(".unit-tile, .unit-tile-add") : [];
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i] !== tile) fallCard(nodes[i]);
      }
      var clone = tile.cloneNode(true);
      clone.classList.remove("is-chosen");
      clone.classList.add("unit-flight");
      clone.setAttribute("aria-hidden", "true");
      document.body.appendChild(clone);
      placeFlight(clone, from);
      enterUnit(id);
      if (token !== motionToken) {
        clone.remove();
        return;
      }
      var picker = document.getElementById("unit-picker");
      if (picker && from.width) picker.style.setProperty("--unit-card-w", Math.round(from.width) + "px");
      var dest = document.querySelector("#unit-picker .unit-tile");
      var back = document.querySelector(".back-units");
      var roster = document.querySelector(".roster-column");
      if (back) back.classList.add("is-held");
      if (roster) roster.classList.add("is-held");
      if (dest) dest.classList.add("is-landing");
      if (!dest || !from.width) {
        clone.remove();
        revealEnteredUnit(token);
        return;
      }
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          if (token !== motionToken) {
            clone.remove();
            return;
          }
          var to = dest.getBoundingClientRect();
          flyClone(clone, from, to, function () {
            if (token !== motionToken) {
              clone.remove();
              return;
            }
            fadeFlight(clone);
            settleEnteredUnit(token, false);
          }, { approach: true });
        });
      });
    }

    function beginShowUnitsHome() {
      if (state.unitsHome || state.outsideOpen || state.releasedOpen || !motionOk()) {
        showUnitsHome();
        return;
      }
      var token = ++motionToken;
      clearFlights();
      var article = document.querySelector("#unit-picker .unit-tile");
      var visual = article && article.querySelector(".unit-tile-static");
      var from = visual ? article.getBoundingClientRect() : null;
      var returningId = state.unit;
      var roster = document.querySelector(".roster-column");
      var clone = null;
      if (visual && from && from.width) {
        clone = article.cloneNode(true);
        clone.classList.add("unit-flight");
        clone.setAttribute("aria-hidden", "true");
        document.body.appendChild(clone);
        placeFlight(clone, from);
        article.classList.add("is-landing");
      }
      if (roster) roster.classList.add("is-leaving");
      var back = document.querySelector(".back-units");
      if (back) back.classList.add("is-held");
      window.setTimeout(function () {
        if (token !== motionToken) {
          if (clone) clone.remove();
          return;
        }
        showUnitsHome();
        if (token !== motionToken) {
          if (clone) clone.remove();
          return;
        }
        var grid = document.querySelector(".unit-grid");
        var head = document.querySelector(".units-board-head");
        if (grid) grid.classList.add("is-arriving");
        if (head) head.classList.add("is-arriving");
        var landed = document.querySelector(unitTileSelector(returningId));
        var tile = landed && landed.closest(".unit-tile");
        if (tile) tile.classList.add("is-landing");
        window.setTimeout(function () {
          if (grid) grid.classList.remove("is-arriving");
          if (head) head.classList.remove("is-arriving");
          if (tile) {
            tile.classList.remove("is-landing");
            tile.classList.remove("is-settled");
          }
        }, 780);
        if (!clone || !tile || !from) {
          if (clone) clone.remove();
          if (tile) tile.classList.remove("is-landing");
          return;
        }
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            if (token !== motionToken) {
              clone.remove();
              return;
            }
            var to = tile.getBoundingClientRect();
            flyClone(clone, from, to, function () {
              if (token !== motionToken) {
                clone.remove();
                return;
              }
              tile.classList.add("is-settled");
              tile.classList.remove("is-landing");
              fadeFlight(clone);
            });
          });
        });
      }, 200);
    }

        "</div>";

    function addUnit(data) {
      data = data || blankUnitDraft();
      var name = clean(data.name);
      if (!name) {
        state.unitError = "צריך שם ליחידה";
        return false;
      }
      if (nameTaken(name, "")) {
        state.unitError = "כבר יש יחידה בשם הזה";
        return false;
      }
      var unit = normalizeUnit({
        id: nextUnitId(),
        name: name,
        quota: data.quota,
        shalishutName: data.shalishutName,
        organ: data.organ,
        gepahName: data.gepahName,
        gepahPhone: data.gepahPhone,
        officerName: data.officerName,
        officerPhone: data.officerPhone,
        ramadName: data.ramadName,
        ramadPhone: data.ramadPhone
      });
      UNITS.push(unit);
      saveUnits();
      closeUnitEditor();
      return true;

    function saveUnitDetails(id, data) {
      var unit = findUnit(id);
      if (!unit) return false;
      data = data || blankUnitDraft();
      var name = clean(data.name);
      if (!name) {
        state.unitError = "צריך שם ליחידה";
        return false;
      }
      if (nameTaken(name, id)) {
        state.unitError = "כבר יש יחידה בשם הזה";
        return false;
      }
      unit.name = name;
      UNIT_PARAMS.forEach(function (key) { unit[key] = clean(data[key]); });
      unit.quota = digits(unit.quota);
      saveUnits();
      closeUnitEditor();
      return true;

    function deleteUnit(id) {
      id = unitId(id);
      var unit = findUnit(id);
      if (!unit) return;
      if (UNITS.length < 2) {
        state.unitError = "צריך להשאיר לפחות יחידה אחת";
        render({ focusUnit: true });
        return;
      }
      var count = unitSoldiers(id).length;
      var message = "למחוק את " + unit.name + "?";
      if (count) message += "\n" + count + " " + countWord(count, "חייל", "חיילים") + " ביחידה יימחקו גם הם.";
      message += "\nלא ניתן לשחזר.";
      if (!window.confirm(message)) return;
      var wasViewing = !state.unitsHome && state.unit === id;
      SOLDIERS = SOLDIERS.filter(function (soldier) { return unitId(soldier.unit) !== id; });
      persist();
      UNITS = UNITS.filter(function (item) { return item.id !== id; });
      saveUnits();
      closeUnitEditor();
      if (state.selectedKey && unitIdOfKey(state.selectedKey) === "") state.selectedKey = "";
      if (state.unit === id) {
        state.unit = UNITS[0].id;
        saveUnit();
      }
      if (wasViewing) {
        showUnitsHome();
        return;
      }
      render();
    }

          svg("calendar", 16) +
        "</button>" +
        '<input type="hidden" name="' + esc(field.key) + '" value="' + esc(normalized || raw) + '">' +
        '<div class="date-pop" hidden role="dialog" aria-label="בחירת ' + esc(field.label) + '"></div>' +
      "</div>";
    }

    function closeDateField(field) {
      if (!field) return;
      var pop = field.querySelector(".date-pop");
      var trigger = field.querySelector(".date-trigger");
      if (pop) {
        pop.hidden = true;
        pop.innerHTML = "";
      }
      if (trigger) trigger.setAttribute("aria-expanded", "false");
      field.classList.remove("is-open");
    }

    function closeDateFields(except) {
      var fields = document.querySelectorAll(".date-field.is-open");
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] !== except) closeDateField(fields[i]);
      }
    }

    function renderDatePop(pop, viewDate, selectedDate, focusStamp) {
      var year = viewDate.getFullYear();
      var month = viewDate.getMonth();
      var firstWeekday = new Date(year, month, 1).getDay();
      var count = new Date(year, month + 1, 0).getDate();
      var today = startOfDay(new Date());
      var selectedStamp = selectedDate ? stampFromDate(selectedDate) : "";
      var todayStampValue = stampFromDate(today);
      function inMonth(stamp) {
        var date = stampToDate(stamp);
        return Boolean(date && date.getFullYear() === year && date.getMonth() === month);
      }
      var active = "";
      if (focusStamp && inMonth(focusStamp)) active = focusStamp;
      else if (selectedStamp && inMonth(selectedStamp)) active = selectedStamp;
      else if (inMonth(todayStampValue)) active = todayStampValue;
      else active = "1." + (month + 1) + "." + year;
      var cells = "";
      var pad;
      for (pad = 0; pad < firstWeekday; pad++) cells += '<span class="date-pad"></span>';
      for (var day = 1; day <= count; day++) {
        var stamp = day + "." + (month + 1) + "." + year;
        var classes = "date-day";
        if (stamp === selectedStamp) classes += " is-selected";
        if (stamp === todayStampValue) classes += " is-today";
        cells += '<button class="' + classes + '" type="button" data-action="pick-date" data-date="' + stamp + '" tabindex="' + (stamp === active ? "0" : "-1") + '"' +
          (stamp === todayStampValue ? ' aria-current="date"' : "") +
          (stamp === selectedStamp ? ' aria-pressed="true"' : "") +
          ">" + day + "</button>";
      }
      var week = ["א", "ב", "ג", "ד", "ה", "ו", "ש"].map(function (label) {
        return "<span>" + label + "</span>";
      }).join("");
      pop.dataset.year = String(year);
      pop.dataset.month = String(month);
      pop.innerHTML =
        '<div class="date-nav">' +
          '<button class="date-nav-btn" type="button" data-action="date-prev" aria-label="חודש קודם">' + svg("chevron", 16) + "</button>" +
          "<strong>" + esc(MONTHS[month] + " " + year) + "</strong>" +
          '<button class="date-nav-btn" type="button" data-action="date-next" aria-label="חודש הבא">' + svg("chevron", 16) + "</button>" +
        "</div>" +
        '<div class="date-week" aria-hidden="true">' + week + "</div>" +
        '<div class="date-grid">' + cells + "</div>" +
        '<div class="date-foot">' +
          '<button class="text-btn" type="button" data-action="date-today">היום</button>' +
          '<button class="text-btn" type="button" data-action="clear-date">ניקוי</button>' +
        "</div>";
    }

    function placeDatePop(field) {
      var pop = field.querySelector(".date-pop");
      var trigger = field.querySelector(".date-trigger");
      if (!pop || pop.hidden || !trigger) return;
      var rect = trigger.getBoundingClientRect();
      var margin = 8;
      var width = Math.min(280, window.innerWidth - margin * 2);
      pop.style.width = Math.round(width) + "px";
      var height = pop.offsetHeight;
      var left = rect.right - width;
      if (left < margin) left = margin;
      if (left + width > window.innerWidth - margin) left = window.innerWidth - margin - width;
      var top = rect.bottom + 6;
      if (top + height > window.innerHeight - margin) {
        var above = rect.top - height - 6;
        if (above >= margin) top = above;
      }
      pop.style.left = Math.round(left) + "px";
      pop.style.top = Math.round(top) + "px";
    }

    function openDateField(field) {
      closeDateFields(field);
      var pop = field.querySelector(".date-pop");
      var input = field.querySelector("input");
      var selected = stampToDate(input ? input.value : "");
      var view = selected || new Date();
      renderDatePop(pop, new Date(view.getFullYear(), view.getMonth(), 1), selected, "");
      pop.hidden = false;
      field.classList.add("is-open");
      var trigger = field.querySelector(".date-trigger");
      if (trigger) trigger.setAttribute("aria-expanded", "true");
      placeDatePop(field);
      var active = pop.querySelector(".date-day[tabindex='0']");
      if (active) active.focus();
    }

    function shiftDateView(field, delta) {
      var pop = field.querySelector(".date-pop");
      var year = Number(pop.dataset.year);
      var month = Number(pop.dataset.month) + delta;
      var selected = stampToDate(field.querySelector("input").value);
      renderDatePop(pop, new Date(year, month, 1), selected, "");
      placeDatePop(field);
      var active = pop.querySelector(".date-day[tabindex='0']");
      if (active) active.focus();
    }

    function setDateFieldValue(field, stamp) {
      var input = field.querySelector("input");
      var valueEl = field.querySelector(".date-value");
      var trigger = field.querySelector(".date-trigger");
      var normalized = stamp ? normalizeStamp(stamp) : "";
      if (input) input.value = normalized;
      if (valueEl) valueEl.textContent = normalized || "בחירת תאריך";
      if (trigger) {
        trigger.classList.toggle("is-empty", !normalized);
        trigger.setAttribute("aria-expanded", "false");
        trigger.focus();
      }
      closeDateField(field);
    }

    function moveDateFocus(dayBtn, delta) {
      var field = dayBtn.closest(".date-field");
      var date = stampToDate(dayBtn.getAttribute("data-date"));
      if (!field || !date) return;
      date.setDate(date.getDate() + delta);
      var next = stampFromDate(date);
      var pop = field.querySelector(".date-pop");
      var sameMonth = date.getFullYear() === Number(pop.dataset.year) && date.getMonth() === Number(pop.dataset.month);
      if (!sameMonth) {
        var selected = stampToDate(field.querySelector("input").value);
        renderDatePop(pop, new Date(date.getFullYear(), date.getMonth(), 1), selected, next);
        placeDatePop(field);
      } else {
        var days = pop.querySelectorAll(".date-day");
        for (var i = 0; i < days.length; i++) days[i].setAttribute("tabindex", "-1");
      }
      var nextBtn = pop.querySelector('.date-day[data-date="' + next + '"]');
      if (nextBtn) {
        nextBtn.setAttribute("tabindex", "0");
        nextBtn.focus();
      }
    }

    function fieldControl(field, draft) {
      if (field.date) return dateFieldControl(field, draft);
      if (field.check) {
        var on = isUntrained(draft);
        return '<label class="mark-toggle' + (field.wide ? " editor-wide" : "") + '">' +
          '<input type="checkbox" name="' + esc(field.key) + '" value="1"' + (on ? " checked" : "") + ">" +
          "<span>" + esc(field.label) + "</span>" +
        "</label>";
      }
      var raw = clean(draft[field.key] || "");
      var value = esc(raw);
      var wide = field.wide ? " editor-wide" : "";
      var required = field.required ? " required" : "";
      var control;
      if (field.unit) {
        control =
          '<select name="unit" required>' +
            UNITS.map(function (unit) {
              return '<option value="' + esc(unit.id) + '"' + (unit.id === raw ? " selected" : "") + ">" + esc(unit.name) + "</option>";
            }).join("") +
          "</select>";
      } else if (field.options) {
        control =
          '<select name="' + field.key + '"' + required + ">" +
            '<option value="">בחירה</option>' +
            field.options.map(function (option) {
              return '<option value="' + esc(option) + '"' + (option === raw ? " selected" : "") + ">" + esc(option) + "</option>";
            }).join("") +
          "</select>";
      } else if (field.wide) {
        control = '<textarea name="' + field.key + '" rows="2">' + value + "</textarea>";
      } else {
        control = '<input name="' + field.key + '" type="' + (field.type || "text") + '" value="' + value + '"' + (field.placeholder ? ' placeholder="' + esc(field.placeholder) + '"' : "") + required + ">";
      }
      return '<label class="' + wide.trim() + '"><span class="field-label">' + esc(field.label) + "</span>" + control + "</label>";
    }

    function editorLead(draft) {
      if (state.editingIndex >= 0) {
        return "השינויים יישמרו בכרטיס של " + (clean(draft.name) || "החייל") + ".";
      }
      return "החייל יישמר ב" + unitName(draft.unit || state.unit) + " ויופיע בכרטיס מלא.";
    }

    function postingLock(soldier) {
      return '<div class="posting-lock editor-wide"><span class="field-label">שיבוץ נוכחי</span><strong>' + esc(currentPlacementName(soldier)) + '</strong><p>העברה ליחידה אחרת נרשמת כסבב ב׳, עם סיבה ותאריך. השיבוץ הזה נשאר במסלול.</p><button class="btn btn-secondary" type="button" data-action="open-transfer">סבב ב׳</button></div>';
    }

    function renderEditor(draft) {
      var editing = state.editingIndex >= 0;
      var editingSoldier = editing ? SOLDIERS[state.editingIndex] : null;
      var fields = FIELDS.map(function (field) {
        if (editing && field.unit) return postingLock(editingSoldier || draft);
        return fieldControl(field, draft);
      }).join("");
      return (
        '<form class="editor editor-form" autocomplete="off">' +
          "<h2>" + (editing ? "עריכת חייל" : "חייל חדש") + "</h2>" +
          '<p class="editor-lead">' + esc(editorLead(draft)) + "</p>" +
          '<div class="editor-grid">' +
            '<div class="photo-field">' +
              avatarMarkup(clean(draft.name), draft.photo, { large: true, interactive: true, key: "draft" }) +
              '<div class="photo-copy"><span class="field-label">תמונה</span><span class="photo-hint">אופציונלי. בלי תמונה נשארות ראשי התיבות, והתמונה נשמרת בכרטיס.</span></div>' +
              '<input type="hidden" name="photo" value="' + esc(safePhoto(draft.photo)) + '">' +
            "</div>" +
            fields +
          "</div>" +
          '<div class="editor-actions">' +
            '<button class="btn btn-primary" type="submit">שמירה</button>' +
            '<button class="btn btn-secondary" type="button" data-action="cancel-new">ביטול</button>' +
            (editing
              ? '<button class="btn btn-danger" type="button" data-action="delete-soldier">מחיקה</button>'
              : "") +
          "</div>" +
        "</form>"
      );
    }

    function blankTransferDraft() {
      return { to: "", destination: "", reason: "", date: todayStamp() };
    }

    function reasonChips(list, selected) {
      return list.map(function (reason) {
        var on = clean(selected) === reason ? " is-on" : "";
        return '<button class="reason-pick' + on + '" type="button" data-action="pick-reason" data-reason="' + esc(reason) + '">' + esc(reason) + "</button>";
      }).join("");
    }

    function syncTransferExit(form) {
      if (!form) return;
      var exit = selectedExit(form);
      var leaving = EXIT_POSTS.indexOf(exit) !== -1;
      var arm = exit === ARM_EXIT;
      var unitWrap = form.querySelector(".transfer-unit");
      if (unitWrap) unitWrap.classList.toggle("is-aside", leaving);
      var dest = form.querySelector(".transfer-dest");
      if (dest) dest.hidden = !arm;
      var reasonLabel = form.querySelector(".reason-label");
      if (reasonLabel) reasonLabel.textContent = leaving ? "סיבת היציאה" : "סיבת המעבר";
      if (form.elements.reason) form.elements.reason.placeholder = leaving ? "למשל סיום שירות" : "למשל אי התאמה ליחידה";
      var picks = form.querySelector(".reason-picks");
      if (picks) picks.innerHTML = reasonChips(leaving ? EXIT_REASONS : TRANSFER_REASONS, form.elements.reason ? form.elements.reason.value : "");
    }

    function selectedExit(form) {
      var button = form && form.querySelector("[data-action='leave-exit'][aria-pressed='true']");
      return button ? clean(button.getAttribute("data-exit")) : "";
    }

    function captureTransfer() {
      var form = document.querySelector(".transfer-form");
      if (!form) return;
      var exit = selectedExit(form);
      state.transferDraft = {
        to: exit ? "out:" + exit : (form.elements.to ? form.elements.to.value : ""),
        destination: form.elements.destination ? form.elements.destination.value : "",
        reason: form.elements.reason ? form.elements.reason.value : "",
        date: form.elements.date ? form.elements.date.value : ""
      };
    }

    function renderTransferForm(soldier) {
      var draft = state.transferDraft || blankTransferDraft();
      var exit = draft.to.indexOf("out:") === 0 ? draft.to.slice(4) : "";
      var leaving = EXIT_POSTS.indexOf(exit) !== -1;
      var exitButtons = EXIT_POSTS.map(function (name) {
        var on = exit === name;
        return '<button class="leave-army' + (on ? " is-on" : "") + '" type="button" data-action="leave-exit" data-exit="' + esc(name) + '" aria-pressed="' + (on ? "true" : "false") + '">' + esc(name) + "</button>";
      }).join("");
      var currentId = clean(soldier.external) ? "" : unitId(soldier.unit);
      var unitOptions = UNITS.filter(function (unit) { return unit.id !== currentId; }).map(function (unit) {
        return '<option value="' + esc(unit.id) + '"' + (!leaving && draft.to === unit.id ? " selected" : "") + ">" + esc(unit.name) + "</option>";
      }).join("");
      var reasons = reasonChips(leaving ? EXIT_REASONS : TRANSFER_REASONS, draft.reason);
      var arm = exit === ARM_EXIT;
      return (
        '<form class="editor transfer-form" autocomplete="off">' +
          "<h2>שינוי שיבוץ</h2>" +
          '<p class="editor-lead">השיבוץ הנוכחי נשאר במסלול. בוחרים יחידה, יצאה מהצבא או יצאה מהזרוע, ורושמים סיבה ותאריך.</p>' +
          '<div class="transfer-current"><span class="field-label">שיבוץ נוכחי</span><strong>' + esc(currentPlacementName(soldier)) + "</strong></div>" +
          '<div class="editor-grid">' +
            '<label class="editor-wide transfer-unit' + (leaving ? " is-aside" : "") + '"><span class="field-label">סבב ב׳</span><select name="to">' +
              '<option value="">בחירה</option>' +
              '<optgroup label="יחידות">' + unitOptions + "</optgroup>" +
            "</select></label>" +
            '<div class="editor-wide leave-army-wrap"><span class="leave-or">או</span><div class="leave-army-row">' + exitButtons + "</div></div>" +
            '<label class="editor-wide transfer-dest"' + (arm ? "" : " hidden") + '><span class="field-label">לאן עבר</span><input name="destination" value="' + esc(draft.destination || "") + '" placeholder="למשל חיל האוויר" autocomplete="off"></label>' +
            '<div class="editor-wide"><label><span class="field-label reason-label">' + (leaving ? "סיבת היציאה" : "סיבת המעבר") + '</span><input name="reason" required value="' + esc(draft.reason || "") + '" placeholder="' + (leaving ? "למשל סיום שירות" : "למשל אי התאמה ליחידה") + '"></label><div class="reason-picks" role="group" aria-label="סיבות נפוצות">' + reasons + "</div></div>" +
            '<label><span class="field-label">תאריך המעבר</span><input name="date" inputmode="numeric" required value="' + esc(draft.date || "") + '" placeholder="28.9.2026"></label>' +
          "</div>" +
          (state.transferError ? '<p class="form-error">' + esc(state.transferError) + "</p>" : "") +
          '<div class="editor-actions">' +
            '<button class="btn btn-primary" type="submit">שמירת השיבוץ</button>' +
            '<button class="btn btn-secondary" type="button" data-action="cancel-transfer">ביטול</button>' +
          "</div>" +
        "</form>"
      );
    }

    function findSoldierIndex(key) {
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (keyOf(SOLDIERS[i]) === key) return i;
      }
      return -1;
    }

    function openTransfer(key) {
      if (key) state.selectedKey = key;
      if (findSoldierIndex(state.selectedKey) < 0) return;
      state.creating = false;
      state.editingIndex = -1;
      state.transferring = true;
      state.transferError = "";
      state.transferDraft = blankTransferDraft();
      state.profileOpen = true;
      state.shalishutOpen = false;
      closeShalishutEditor();
      render({ focusTransfer: true });
    }

    function closeTransfer() {
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      render();
    }

    function commitTransfer(form) {
      var index = findSoldierIndex(state.selectedKey);
      if (index < 0) return;
      var soldier = SOLDIERS[index];
      var exitChoice = selectedExit(form);
      var to = exitChoice ? "out:" + exitChoice : clean(form.elements.to.value);
      var destination = exitChoice === ARM_EXIT ? clean(form.elements.destination ? form.elements.destination.value : "") : "";
      var reason = clean(form.elements.reason.value);
      var date = normalizeStamp(form.elements.date.value);
      state.transferDraft = { to: to, destination: destination, reason: reason, date: form.elements.date.value };
      if (!to) {
        state.transferError = "בחרו יחידה, יצאה מהצבא או יצאה מהזרוע";
        render({ focusTransfer: true });
        return;
      }
      var external = to.indexOf("out:") === 0;
      var toId = "";
      var toName = "";
      if (external) {
        toName = to.slice(4);
        if (exitChoice === ARM_EXIT && destination) toName = ARM_EXIT + " · " + destination;
        if (!toName) {
          state.transferError = "כתבו את שם היעד";
          render({ focusTransfer: true });
          return;
        }
      } else {
        toId = unitId(to);
        toName = toId ? unitName(toId) : "";
        if (!toId || !toName) {
          state.transferError = "היחידה לא נמצאה";
          render({ focusTransfer: true });
          return;
        }
      }
      var fromExternal = clean(soldier.external);
      var fromId = fromExternal ? "" : unitId(soldier.unit);
      var fromName = fromExternal || unitName(fromId) || "ללא שיבוץ";
      if ((!external && !fromExternal && toId === fromId) || (external && toName === fromExternal)) {
        state.transferError = "זה השיבוץ הנוכחי. בחרו שיבוץ אחר.";
        render({ focusTransfer: true });
        return;
      }
      if (!reason) {
        state.transferError = "רשמו את סיבת המעבר";
        render({ focusTransfer: true });
        return;
      }
      if (!date) {
        state.transferError = "תאריך בפורמט 28.9.2026";
        render({ focusTransfer: true });
        return;
      }
      if (!soldier.transfers) soldier.transfers = [];
      soldier.transfers.push({
        fromId: fromId,
        fromName: fromName,
        toId: external ? "" : toId,
        toName: toName,
        destination: destination,
        external: external,
        reason: reason,
        date: date
      });
      if (external) {
        soldier.unit = "";
        soldier.external = toName;
      } else {
        soldier.unit = toId;
        soldier.external = "";
      }
      persist();
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.selectedKey = keyOf(soldier);
      state.profileOpen = true;
      state.creating = false;
      state.editingIndex = -1;
      if (external) {
        state.logOpen = false;
        state.unitsHome = false;
        state.outsideOpen = true;
        state.prevKey = "";
        render({ scroll: true });
        return;
      }
      state.logOpen = false;
      state.outsideOpen = false;
      state.unitsHome = false;
      state.prevKey = "";
      if (state.unit !== soldier.unit) {
        state.unit = soldier.unit;
        saveUnit();
      }
      document.getElementById("search").value = "";
      document.getElementById("filter-profession").value = "";
      document.getElementById("filter-cycle").value = "";
      document.getElementById("filter-grade").value = "";
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-tatash").value = "";
      render({ scroll: true });
    }

    function transferRows() {
      var rows = [];
      var order = 0;
      SOLDIERS.forEach(function (soldier) {
        (soldier.transfers || []).forEach(function (move) {
          rows.push({ soldier: soldier, move: move, order: order });
          order += 1;
        });
      });
      rows.sort(function (a, b) {
        var da = parseDate(a.move.date);
        var db = parseDate(b.move.date);
        var ta = da ? da.getTime() : 0;
        var tb = db ? db.getTime() : 0;
        if (ta !== tb) return tb - ta;
        return b.order - a.order;
      });
      return rows;
    }

    function openLog() {
      state.logOpen = true;
      state.logQuery = "";
      state.creating = false;
      state.editingIndex = -1;
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.shalishutOpen = false;
      closeShalishutEditor();
      render({ focusLogSearch: true });
    }

    function closeLog() {
      state.logOpen = false;
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.logQuery = "";
      render();
    }

    function openPosted(key) {
      var soldier = findSoldier(SOLDIERS, key);
      if (!soldier || clean(soldier.external) || !unitId(soldier.unit)) return;
      state.logOpen = false;
      state.outsideOpen = false;
      state.transferring = false;
      state.transferError = "";
      state.transferDraft = null;
      state.unitsHome = false;
      state.unit = unitId(soldier.unit);
      saveUnit();
      state.selectedKey = keyOf(soldier);
      state.prevKey = "";
      state.profileOpen = true;
      state.creating = false;
      state.editingIndex = -1;
      document.getElementById("search").value = "";
      document.getElementById("filter-profession").value = "";
      document.getElementById("filter-cycle").value = "";
      document.getElementById("filter-grade").value = "";
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-tatash").value = "";
      render({ scroll: true });
    }

    function renderTransferLog(opts) {
      opts = opts || {};
      if (state.transferring) captureTransfer();
      document.body.classList.remove("home-query");
      document.getElementById("add-btn").hidden = true;
      document.getElementById("profile").setAttribute("aria-label", "יומן מעברים");
      var profile = document.getElementById("profile");
      if (state.transferring) {
        var editingSoldier = findSoldier(SOLDIERS, state.selectedKey);
        profile.innerHTML = editingSoldier
          ? renderTransferForm(editingSoldier)
          : '<div class="log-empty">החייל לא נמצא</div>';
        document.getElementById("print-root").innerHTML = "";
        document.title = "שינוי שיבוץ · " + CONFIG.title;
        if (opts.focusTransfer) {
          var focusTo = profile.querySelector("[name='to']");
          if (focusTo) focusTo.focus();
        }
        return;
      }
      var query = clean(state.logQuery).toLowerCase();
      var rows = transferRows().filter(function (row) {
        if (!query) return true;
        var blob = [
          row.soldier.name, row.soldier.personalId, row.soldier.profession,
          row.move.fromName, row.move.toName, row.move.reason, row.move.date
        ].map(function (value) { return clean(value).toLowerCase(); }).join(" ");
        return blob.indexOf(query) !== -1;
      });
      var total = transferRows().length;
      var summary = total
        ? (query ? "מוצגים " + rows.length + " מתוך " + total : total + " " + countWord(total, "מעבר", "מעברים"))
        : "עדיין אין מעברים";
      var body = rows.map(function (row) {
        var soldier = row.soldier;
        var outside = Boolean(clean(soldier.external));
        var key = keyOf(soldier);
        var who = outside
          ? '<span>' + esc(clean(soldier.name) || "ללא שם") + "</span>"
          : '<button class="log-jump" type="button" data-action="open-posted" data-key="' + esc(key) + '">' + esc(clean(soldier.name) || "ללא שם") + "</button>";
        var sub = [clean(soldier.profession), clean(soldier.personalId)].filter(Boolean).join(" · ");
        if (outside) sub = (sub ? sub + " · " : "") + "מחוץ ליחידות";
        var again = outside
          ? '<button class="text-btn" type="button" data-action="open-transfer" data-key="' + esc(key) + '">סבב ב׳</button>'
          : "";
        return "<tr><td>" + who + (sub ? '<span class="log-sub">' + esc(sub) + "</span>" : "") + again + "</td><td>" + esc(row.move.fromName) + "</td><td>" + esc(row.move.toName) + "</td><td class=\"log-reason\">" + esc(row.move.reason) + "</td><td>" + esc(row.move.date) + "</td></tr>";
      }).join("");
      var table = rows.length
        ? '<div class="transfer-log-wrap"><table class="transfer-log"><thead><tr><th>חייל</th><th>שיבוץ קודם</th><th>סבב ב׳</th><th>סיבה</th><th>תאריך</th></tr></thead><tbody>' + body + "</tbody></table></div>"
        : '<div class="log-empty">' + (total ? "אין מעברים תואמים" : "סבב ב׳ נרשם מכרטיס החייל. השיבוץ הקודם נשאר במסלול, עם סיבת המעבר.") + "</div>";
      profile.innerHTML =
        '<div class="units-board">' +
          '<div class="log-head"><div><button class="text-btn" type="button" data-action="close-log">חזרה</button><h2>יומן מעברים</h2><p>' + esc(summary) + ". כל מעבר נשמר כסבב ב׳, והשיבוץ הקודם נשאר.</p></div>" +
          '<input class="log-search" id="log-search" type="search" value="' + esc(state.logQuery) + '" placeholder="חייל, יחידה או סיבה" aria-label="חיפוש ביומן">' +
          "</div>" + table +
        "</div>";
      document.getElementById("print-root").innerHTML = "";
      document.title = "יומן מעברים · " + CONFIG.title;
      syncHash("");
      var search = document.getElementById("log-search");
      if (search && opts.focusLogSearch) {
        search.focus();
        var pos = search.value.length;
        if (search.setSelectionRange) search.setSelectionRange(pos, pos);
      }
      var announce = "יומן מעברים. " + summary;
      if (state.announced !== announce) {
        state.announced = announce;
        document.getElementById("live").textContent = announce;
      }
    }

    function draftFromSoldier(soldier) {
      var draft = blankDraft();
      FIELDS.forEach(function (field) {
        draft[field.key] = clean(soldier[field.key] || "");
      });
      draft.unit = unitId(soldier.unit) || state.unit;
      draft.photo = safePhoto(soldier.photo);
      return draft;
    }

    function openCreator() {
      state.creating = true;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.shalishutOpen = false;
      closeShalishutEditor();
      state.profileOpen = true;
      render({ focusEditor: true, freshDraft: true });
    }

    function openSoldierEditor() {
      var soldier = null;
      var index = -1;
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (keyOf(SOLDIERS[i]) === state.selectedKey && soldierInView(SOLDIERS[i])) {
          soldier = SOLDIERS[i];
          index = i;
          break;
        }
      }
      if (!soldier) return;
      state.creating = false;
      state.editingIndex = index;
      state.draft = draftFromSoldier(soldier);
      state.shalishutOpen = false;
      closeShalishutEditor();
      state.profileOpen = true;
      render({ focusEditor: true, freshDraft: true });
    }

    function closeCreator() {
      var stayOnProfile = state.editingIndex >= 0;
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      if (!stayOnProfile) state.profileOpen = false;
      render();
    }

    function deleteEditingSoldier() {
      var index = state.editingIndex;
      if (index < 0 || index >= SOLDIERS.length) return;
      var soldier = SOLDIERS[index];
      var name = clean(soldier.name) || "החייל";
      if (!window.confirm("למחוק את " + name + "? לא ניתן לשחזר את הכרטיס.")) return;
      var removedUnit = unitId(soldier.unit) || state.unit;
      SOLDIERS.splice(index, 1);
      persist();
      state.creating = false;
      state.editingIndex = -1;
      state.draft = blankDraft();
      state.profileOpen = true;
      var next = null;
      for (var i = 0; i < SOLDIERS.length; i++) {
        if (soldierInView(SOLDIERS[i], removedUnit)) {
          next = SOLDIERS[i];
          break;
        }
      }
      state.selectedKey = next ? keyOf(next) : "";
      render();
    }

    function render(opts) {
      opts = opts || {};
      hideHitPop();
      syncShell();
      if (state.logOpen) {
        renderTransferLog(opts);
        return;
      }
      if (state.unitsHome) {
        renderUnitsHome(opts);
        return;
      }
      document.body.classList.remove("home-query");
      document.getElementById("add-btn").hidden = state.transferring;
      document.getElementById("profile").setAttribute("aria-label", "כרטיס חייל");
      if (!unitId(state.unit)) state.unit = UNITS[0].id;
      renderUnitSide();
      var editing = state.editingIndex >= 0;
      if ((state.creating || editing) && !opts.freshDraft) captureDraft();
      if (state.editingShalishut) captureShalishut();
      var queryRaw = clean(document.getElementById("search").value);
      var query = queryRaw.toLowerCase();
      var filters = {
        profession: document.getElementById("filter-profession").value,
        cycle: document.getElementById("filter-cycle").value,
        grade: document.getElementById("filter-grade").value,
        date: document.getElementById("filter-date").value,
        tatash: document.getElementById("filter-tatash").value
      };
      var view = SOLDIERS.filter(function (soldier) { return soldierInView(soldier); });

      fillSelect(document.getElementById("filter-profession"), valuesOf(view, "profession"), "כל המקצועות");
      fillSelect(document.getElementById("filter-cycle"), valuesOf(view, "cycle"), "כל המחזורים");
      fillSelect(document.getElementById("filter-grade"), valuesOf(view, "grade"), "כל המדרגים");
      fillSelect(document.getElementById("filter-date"), valuesOf(view, "studyDate"), "כל התאריכים");
      ["filter-profession", "filter-cycle", "filter-grade", "filter-date", "filter-tatash"].forEach(function (id) {
        var el = document.getElementById(id);
        el.classList.toggle("is-active", el.value !== "");
      });

      var placeLabel = state.outsideOpen ? "ללא יחידה" : (state.releasedOpen ? unitName(state.unit) + " · משוחררים" : unitName(state.unit));
      var inUnit = view.length;
      var visibleTotal = view.length;
      var professions = new Set(valuesOf(view, "profession")).size;
      var stats = placeLabel + " · " + inUnit + " " + countWord(inUnit, state.releasedOpen ? "משוחרר" : "חייל", state.releasedOpen ? "משוחררים" : "חיילים") + " · " + professions + " " + countWord(professions, "מקצוע", "מקצועות");
      var filtered = view.filter(function (soldier) { return matches(soldier, query, filters); });
      var active = Boolean(query || filters.profession || filters.cycle || filters.grade || filters.date || filters.tatash);
      var result = document.getElementById("result-line");
      var clearBtn = document.getElementById("clear-btn");

      if (!SOLDIERS.length) {
        result.textContent = "המבנה מוכן להזנת חיילים";
        clearBtn.hidden = true;
      } else if (!visibleTotal) {
        result.textContent = "אין חיילים ב" + placeLabel;
        clearBtn.hidden = true;
      } else if (!filtered.length) {
        var elsewhere = matchesElsewhere(query, filters);
        result.textContent = elsewhere
          ? (state.outsideOpen ? "אין תוצאות ברשימה הזו · " : "אין תוצאות ביחידה הזו · ") + elsewhere
          : "אין תוצאות לסינון הזה";
        clearBtn.hidden = !active;
      } else if (active) {
        var note = filters.tatash ? "תת״ש: " + releaseLabel(filters.tatash) + " · " : "";
        result.textContent = note + "מוצגים " + filtered.length + " מתוך " + visibleTotal;
        clearBtn.hidden = false;
      } else {
        result.textContent = stats;
        clearBtn.hidden = true;
      }

      if (state.transferring && !opts.focusTransfer) captureTransfer();
      var keys = filtered.map(keyOf);
      if (!state.transferring && keys.indexOf(state.selectedKey) === -1) state.selectedKey = keys[0] || "";
      var selectionChanged = state.selectedKey !== state.prevKey;

      var listEl = document.getElementById("list");
      var prevScroll = listEl.scrollTop;
      listEl.hidden = !visibleTotal;
      var rosterBody = document.querySelector(".roster-body");
      if (rosterBody) rosterBody.classList.toggle("has-list", visibleTotal > 0);
      listEl.innerHTML = renderList(groupSoldiers(filtered), queryRaw, visibleTotal);
      var selectedBtn = listEl.querySelector('[aria-current="true"]');
      if ((selectionChanged || opts.scroll) && selectedBtn) selectedBtn.scrollIntoView({ block: "nearest" });
      else listEl.scrollTop = prevScroll;
      if (opts.focusList && selectedBtn) selectedBtn.focus();

      var profile = document.getElementById("profile");
      var soldier = findSoldier(filtered, state.selectedKey);
      var narrow = window.matchMedia("(max-width: 860px)").matches;
      var mainHtml = "";
      if (state.creating || editing) {
        mainHtml = renderEditor(state.draft || blankDraft());
      } else if (state.transferring) {
        var transferSoldier = findSoldier(SOLDIERS, state.selectedKey);
        mainHtml = transferSoldier ? renderTransferForm(transferSoldier) : emptyProfile("none");
      } else if (!SOLDIERS.length) {
        mainHtml = emptyProfile("nodata");
      } else if (!visibleTotal) {
        mainHtml = emptyProfile("unit");
      } else if (!soldier) {
        mainHtml = emptyProfile("none");
      } else {
        mainHtml = '<button class="back-btn" type="button" data-action="back">' + svg("chevron", 18) + "<span>כל החיילים</span></button>" + renderRoster(filtered, { interactive: true });
      }
      var profileScroll = opts.keepProfileScroll ? profile.scrollTop : 0;
      profile.innerHTML = mainHtml;
      if (opts.keepProfileScroll) {
        holdProfileSpy();
        profile.scrollTop = profileScroll;
      }
      if ((state.creating || editing) && opts.focusEditor) {
        var focusField = profile.querySelector('[name="' + (editing ? "name" : "profession") + '"]');
        if (focusField) focusField.focus();
      }
      if (state.transferring && opts.focusTransfer) {
        var focusTo = profile.querySelector("[name='to']");
        if (focusTo) focusTo.focus();
      }
      if (selectionChanged && !opts.keepProfileScroll && !state.creating && !editing && !state.transferring && !opts.focusShalishut) {
        var frames = profile.querySelectorAll("[data-soldier]");
        var target = null;
        for (var frameIndex = 0; frameIndex < frames.length; frameIndex++) {
          if (frames[frameIndex].getAttribute("data-soldier") === state.selectedKey) target = frames[frameIndex];
        }
        if (target) {
          holdProfileSpy();
          target.scrollIntoView({ block: "start" });
        } else profile.scrollTop = 0;
      }

      var summary = filterSummary(filters, queryRaw);
      var printWord = state.releasedOpen ? ["משוחרר", "משוחררים"] : ["חייל", "חיילים"];
      var printLabel = filtered.length + " " + countWord(filtered.length, printWord[0], printWord[1]);
      document.getElementById("print-root").innerHTML =
        '<header class="print-mast"><img class="print-logo print-logo-hebet" src="hebet-logo-full.png" alt="הבט"><img class="print-logo print-logo-idf" src="idf-goc.svg" alt=""><div><h1>' + esc(CONFIG.title) + "</h1><p>" +
        esc(placeLabel + " · " + printLabel + (summary ? " · " + summary : "") + " · " + prettyDate(new Date())) + "</p></div></header>" +
        (state.outsideOpen ? "" : renderShalishutPrint(currentUnit())) +
        renderRoster(filtered, { compact: true });

      if (state.transferring) document.title = "שינוי שיבוץ · " + CONFIG.title;
      else if (state.creating) document.title = "חייל חדש · " + CONFIG.title;
      else if (editing) document.title = "עריכת " + (clean(state.draft && state.draft.name) || "חייל") + " · " + CONFIG.title;
      else document.title = soldier ? clean(soldier.name) + " · " + CONFIG.title : (state.outsideOpen ? "ללא יחידה · " + CONFIG.title : state.releasedOpen ? "משוחררים · " + unitName(state.unit) + " · " + CONFIG.title : CONFIG.title);
      if (!state.creating && !editing && !state.transferring) syncHash(soldier ? state.selectedKey : "");
      syncShell();

      var announce = state.editingShalishut
        ? "עריכת שלישות של " + unitName(state.unit)
        : state.shalishutOpen && narrow
          ? unitName(state.unit)
          : state.transferring
            ? "שינוי שיבוץ ל" + (clean(transferSoldier && transferSoldier.name) || "חייל")
          : editing
            ? "עריכת " + (clean(state.draft && state.draft.name) || "חייל")
            : state.creating
            ? "טופס חייל חדש"
            : !SOLDIERS.length ? "הרשימה ממתינה לנתונים" : !visibleTotal ? "אין חיילים ב" + placeLabel : !soldier ? "אין חיילים תואמים" : "כרטיס של " + clean(soldier.name) + (present(soldier.profession) ? ", " + clean(soldier.profession) : "");
      if (state.announced !== announce) {
        state.announced = announce;
        document.getElementById("live").textContent = announce;
      }
      state.prevKey = state.selectedKey;
      if (opts.focusPalette) {
        var palette = document.querySelector("#unit-picker .palette");
        if (palette) palette.scrollIntoView({ block: "nearest" });
      }
      if (opts.openEditor) {
        var openingSide = document.querySelector("#unit-picker .unit-tile.is-editing");
        if (openingSide) openingSide.classList.add("is-opening");
      }
      if (opts.focusUnit) {
        var unitInput = document.querySelector("#unit-picker .unit-details-form [name='name']");
        if (unitInput) {
          unitInput.focus();
          if (unitInput.value) unitInput.select();
          var sideTile = unitInput.closest(".unit-tile");
          if (sideTile) sideTile.scrollIntoView({ block: "nearest" });
        }
      }
      if (opts.focusShalishut) {
        var shalishut = document.getElementById("shalishut");
        if (shalishut) shalishut.scrollIntoView({ block: "start" });
        var shalishutName = document.querySelector(".shalishut-form [name='name']");
        if (shalishutName) shalishutName.focus();
      }
    }

    function clearFilters() {
      document.getElementById("search").value = "";
      document.getElementById("filter-profession").value = "";
      document.getElementById("filter-cycle").value = "";
      document.getElementById("filter-grade").value = "";
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-tatash").value = "";
      render();
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise(function (resolve, reject) {
        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "-1000px";
        document.body.appendChild(area);
        area.select();
        try {
          var ok = document.execCommand("copy");
          document.body.removeChild(area);
          if (ok) resolve();
          else reject();
        } catch (err) {
          document.body.removeChild(area);
          reject(err);
        }
      });
    }

    function moveSelection(delta) {
      var buttons = Array.prototype.slice.call(document.querySelectorAll("#list .person"));
      if (!buttons.length) return;
      var idx = -1;
      buttons.forEach(function (btn, i) {
        if (btn.getAttribute("aria-current") === "true") idx = i;
      });
      var nextIndex = idx + delta;
      if (nextIndex < 0) nextIndex = 0;
      if (nextIndex > buttons.length - 1) nextIndex = buttons.length - 1;
      var next = buttons[nextIndex];
      if (!next || next.getAttribute("data-key") === state.selectedKey) return;
      state.selectedKey = next.getAttribute("data-key");
      state.profileOpen = true;
      render({ scroll: true, focusList: true });
    }

    function init() {
      loadUnits();
      UNITS = UNITS.map(normalizeUnit);
      loadStored();
      if (ensureUnits()) persist();
      try { state.unit = unitId(localStorage.getItem(UNIT_KEY)) || UNITS[0].id; } catch (err) { state.unit = UNITS[0].id; }
      document.getElementById("doc-title").textContent = CONFIG.title;
      try {
        var hash = decodeURIComponent(location.hash.replace(/^#/, ""));
        if (hash) state.selectedKey = hash;
      } catch (err) {}
      var hashed = null;
      if (state.selectedKey) {
        for (var hashIndex = 0; hashIndex < SOLDIERS.length; hashIndex++) {
          if (keyOf(SOLDIERS[hashIndex]) === state.selectedKey) {
            hashed = SOLDIERS[hashIndex];
            break;
          }
        }
      }
      var owner = hashed ? unitId(hashed.unit) : "";
      if (owner) {
        state.unit = owner;
        state.unitsHome = false;
        state.releasedOpen = isReleased(hashed);
      } else {
        state.unitsHome = true;
        state.selectedKey = "";
      }
      saveUnit();
      var unitPicker = document.getElementById("unit-picker");
      unitPicker.addEventListener("click", function (event) {
        if (event.target.closest("[data-action='units-home']")) {
          beginShowUnitsHome();
          return;
        }
        if (state.unitsHome) return;
        var colorBtn = event.target.closest("[data-action='pick-color']");
        if (colorBtn) {
          var colorId = colorBtn.getAttribute("data-unit");
          var nextColor = state.colorUnit === colorId ? "" : colorId;
          state.unitEdit = "";
          state.unitDraft = null;
          state.unitError = "";
          state.colorUnit = nextColor;
          render({ focusPalette: Boolean(nextColor) });
          return;
        }
        var setColorBtn = event.target.closest("[data-action='set-color']");
        if (setColorBtn) {
          setUnitColor(setColorBtn.getAttribute("data-unit"), setColorBtn.getAttribute("data-color") || "");
          render();
          return;
        }
        var editBtn = event.target.closest("[data-action='edit-unit']");
        if (editBtn) {
          openUnitEditor(editBtn.getAttribute("data-unit"), editBtn);
          return;
        }
        if (event.target.closest("[data-action='delete-unit']")) {
          var deleteForm = event.target.closest(".unit-edit");
          deleteUnit(deleteForm && deleteForm.getAttribute("data-unit"));
          return;
        }
        if (event.target.closest("[data-action='cancel-unit']")) {
          closeUnitEditor();
          render();
        }
      });
      unitPicker.addEventListener("input", function (event) {
        var form = event.target.form;
        if (!form || !form.classList || !form.classList.contains("unit-edit")) return;
        state.unitDraft = readUnitForm(form);
        state.unitError = "";
        var error = form.querySelector(".form-error");
        if (error) error.remove();
      });
      unitPicker.addEventListener("submit", function (event) {
        var form = event.target;
        if (!form.classList || !form.classList.contains("unit-edit")) return;
        event.preventDefault();
        commitUnitForm(form);
      });
      document.addEventListener("click", function (event) {
        if (suppressUnitClose) {
          suppressUnitClose = false;
          return;
        }
        if (!state.unitOpen) return;
        if (event.target.closest("#unit-picker")) return;
        state.unitOpen = false;
        closeUnitEditor();
        render();
      });

      ["search", "filter-profession", "filter-cycle", "filter-grade", "filter-date", "filter-tatash"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () { render(); });
        document.getElementById(id).addEventListener("change", function () { render(); });
      });
      document.getElementById("clear-btn").addEventListener("click", clearFilters);
      document.getElementById("add-btn").addEventListener("click", openCreator);
      document.getElementById("log-btn").addEventListener("click", openLog);
      document.getElementById("profile").addEventListener("scroll", function () {
        if (hitPopUnit) {
          var hitTile = hitTileFor(hitPopUnit);
          if (hitTile) placeHitPop(hitTile);
          else hideHitPop();
        }
        if (profileSpyHold) return;
        if (profileSpyFrame) cancelAnimationFrame(profileSpyFrame);
        profileSpyFrame = requestAnimationFrame(function () {
          profileSpyFrame = 0;
          syncFromProfileScroll();
        });
      }, { passive: true });
      document.addEventListener("pointermove", function (event) {
        hitPointer.x = event.clientX;
        hitPointer.y = event.clientY;
        hitPointer.ready = true;
      });
      document.getElementById("profile").addEventListener("mouseover", function (event) {
        if (!document.body.classList.contains("units-home")) return;
        var tile = event.target.closest(".unit-tile.is-hit");
        if (!tile) return;
        showHitPop(tile);
      });
      document.getElementById("profile").addEventListener("mouseout", function (event) {
        var tile = event.target.closest(".unit-tile.is-hit");
        if (!tile || !tile.isConnected) return;
        var next = event.relatedTarget;
        if (next && tile.contains(next)) return;
        finishHitPop();
      });
      document.getElementById("profile").addEventListener("focusin", function (event) {
        var tile = event.target.closest(".unit-tile.is-hit");
        if (tile) showHitPop(tile);
      });
      document.getElementById("profile").addEventListener("focusout", function (event) {
        var tile = event.target.closest(".unit-tile.is-hit");
        if (!tile) return;
        var next = event.relatedTarget;
        if (next && tile.contains(next)) return;
        hideHitPop();
      });
      window.addEventListener("resize", function () {
        if (!hitPopUnit) return;
        var openHit = document.querySelector(unitTileSelector(hitPopUnit));
        var hitTile = openHit && openHit.closest(".unit-tile");
        if (hitTile) placeHitPop(hitTile);
        else hideHitPop();
      });
      document.getElementById("list").addEventListener("click", function (event) {
        var btn = event.target.closest(".person");
        if (!btn) return;
        state.creating = false;
        state.editingIndex = -1;
        state.transferring = false;
        state.transferError = "";
        state.transferDraft = null;
        state.draft = blankDraft();
        state.shalishutOpen = false;
        state.selectedKey = btn.getAttribute("data-key");
        state.profileOpen = true;
        render();
      });
      document.getElementById("profile").addEventListener("change", function (event) {
        var target = event.target;
        if (target && target.name === "to" && target.form && target.form.classList.contains("transfer-form")) {
          if (!target.value) return;
          var pickedLeaves = target.form.querySelectorAll("[data-action='leave-exit']");
          for (var leaveIndex = 0; leaveIndex < pickedLeaves.length; leaveIndex++) {
            pickedLeaves[leaveIndex].setAttribute("aria-pressed", "false");
            pickedLeaves[leaveIndex].classList.remove("is-on");
          }
          syncTransferExit(target.form);
          return;
        }
        if (target && target.getAttribute && target.getAttribute("data-action") === "pick-photo") {
          var file = target.files && target.files[0];
          var photoKey = target.getAttribute("data-key") || "";
          target.value = "";
          if (!file) return;
          readPhotoFile(file).then(function (url) {
            setSoldierPhoto(photoKey, url);
          }, function (err) {
            window.alert(photoError(err));
          });
          return;
        }
        if (!(state.creating || state.editingIndex >= 0) || !target || target.name !== "unit") return;
        captureDraft();
        var lead = document.querySelector(".editor-lead");
        if (lead) lead.textContent = editorLead(state.draft);
      });
      document.getElementById("profile").addEventListener("input", function (event) {
        if (event.target && event.target.id === "log-search") {
          state.logQuery = event.target.value;
          render({ focusLogSearch: true });
          return;
        }
        var form = event.target.form;
        if (!form || !form.classList || !form.classList.contains("unit-edit")) return;
        state.unitDraft = readUnitForm(form);
        state.unitError = "";
        var error = form.querySelector(".form-error");
        if (error) error.remove();
      });
      document.getElementById("profile").addEventListener("submit", function (event) {
        var form = event.target;
        if (form.classList && form.classList.contains("unit-edit")) {
          event.preventDefault();
          commitUnitForm(form);
          return;
        }
        if (form.classList && form.classList.contains("shalishut-form")) {
          event.preventDefault();
          var data = shalishutFromForm(form);
          state.shalishutDraft = data;
          if (!saveShalishut(data)) render({ focusShalishut: true });
          else render();
          return;
        }
        if (form.classList && form.classList.contains("transfer-form")) {
          event.preventDefault();
          commitTransfer(form);
          return;
        }
        if (!form.classList || !form.classList.contains("editor-form")) return;
        event.preventDefault();
        var soldier = soldierFromForm(form);
        if (!soldier.profession || !soldier.name) return;
        if (state.editingIndex >= 0 && state.editingIndex < SOLDIERS.length) {
          var previousSoldier = SOLDIERS[state.editingIndex];
          soldier.transfers = previousSoldier.transfers || [];
          soldier.external = clean(previousSoldier.external);
          soldier.unit = soldier.external ? "" : (unitId(previousSoldier.unit) || state.unit);
          SOLDIERS[state.editingIndex] = soldier;
        } else {
          soldier.transfers = [];
          soldier.external = "";
          soldier.unit = unitId(soldier.unit) || state.unit;
          SOLDIERS.push(soldier);
        }
        persist();
        state.creating = false;
        state.editingIndex = -1;
        state.selectedKey = keyOf(soldier);
        state.profileOpen = true;
        if (state.unit !== soldier.unit) {
          state.unit = soldier.unit;
          saveUnit();
        }
        state.draft = blankDraft();
        clearFilters();
        render({ scroll: true });
      });
      document.getElementById("profile").addEventListener("click", function (event) {
        var dateAction = event.target.closest("[data-action='toggle-date'], [data-action='date-prev'], [data-action='date-next'], [data-action='pick-date'], [data-action='date-today'], [data-action='clear-date']");
        if (dateAction) {
          event.stopPropagation();
          var dateField = dateAction.closest(".date-field");
          var dateActionName = dateAction.getAttribute("data-action");
          if (!dateField) return;
          if (dateActionName === "toggle-date") {
            if (dateField.classList.contains("is-open")) closeDateField(dateField);
            else openDateField(dateField);
          } else if (dateActionName === "date-prev") {
            shiftDateView(dateField, -1);
          } else if (dateActionName === "date-next") {
            shiftDateView(dateField, 1);
          } else if (dateActionName === "pick-date") {
            setDateFieldValue(dateField, dateAction.getAttribute("data-date") || "");
          } else if (dateActionName === "date-today") {
            setDateFieldValue(dateField, todayStamp());
          } else if (dateActionName === "clear-date") {
            setDateFieldValue(dateField, "");
          }
          return;
        }
        var postingToggle = event.target.closest("[data-action='toggle-posting']");
        if (postingToggle) {
          var postingCard = postingToggle.closest(".identity-card");
          var fold = postingCard && postingCard.querySelector(".posting-fold:not(.detail-fold)");
          if (!fold || fold.closest(".dossier-print")) return;
          var postingOpen = fold.classList.toggle("is-open");
          postingToggle.setAttribute("aria-expanded", postingOpen ? "true" : "false");
          var postingBody = fold.querySelector(".posting-body");
          if (postingBody) postingBody.setAttribute("aria-hidden", postingOpen ? "false" : "true");
          return;
        }
        var detailToggle = event.target.closest("[data-action='toggle-detail']");
        if (detailToggle) {
          var detailFoldEl = detailToggle.closest(".detail-fold");
          if (!detailFoldEl || detailFoldEl.closest(".dossier-print")) return;
          var detailOpen = detailFoldEl.classList.toggle("is-open");
          detailToggle.setAttribute("aria-expanded", detailOpen ? "true" : "false");
          var detailBody = detailFoldEl.querySelector(".posting-body");
          if (detailBody) detailBody.setAttribute("aria-hidden", detailOpen ? "false" : "true");
          return;
        }
        var notesToggle = event.target.closest("[data-action='toggle-notes']");
        if (notesToggle) {
          var notesFoldEl = notesToggle.closest(".notes-fold");
          if (!notesFoldEl || notesFoldEl.closest(".dossier-print")) return;
          var notesOpen = notesFoldEl.classList.toggle("is-open");
          notesToggle.setAttribute("aria-expanded", notesOpen ? "true" : "false");
          var notesBody = notesFoldEl.querySelector(".posting-body");
          if (notesBody) notesBody.setAttribute("aria-hidden", notesOpen ? "false" : "true");
          return;
        }
        if (event.target.closest("[data-action='close-log']")) {
          closeLog();
          return;
        }
        if (event.target.closest("[data-action='cancel-transfer']")) {
          closeTransfer();
          return;
        }
        var leaveBtn = event.target.closest("[data-action='leave-exit']");
        if (leaveBtn) {
          var leaveForm = leaveBtn.closest("form");
          var leaveOn = leaveBtn.getAttribute("aria-pressed") !== "true";
          var leaveButtons = leaveForm ? leaveForm.querySelectorAll("[data-action='leave-exit']") : [];
          for (var leaveBtnIndex = 0; leaveBtnIndex < leaveButtons.length; leaveBtnIndex++) {
            var thisOn = leaveOn && leaveButtons[leaveBtnIndex] === leaveBtn;
            leaveButtons[leaveBtnIndex].setAttribute("aria-pressed", thisOn ? "true" : "false");
            leaveButtons[leaveBtnIndex].classList.toggle("is-on", thisOn);
          }
          var leaveUnit = leaveForm && leaveForm.querySelector(".transfer-unit");
          if (leaveUnit) leaveUnit.classList.toggle("is-aside", leaveOn);
          if (leaveForm && leaveForm.elements.to && leaveOn) leaveForm.elements.to.value = "";
          syncTransferExit(leaveForm);
          if (leaveOn && leaveForm) {
            var armOn = leaveBtn.getAttribute("data-exit") === ARM_EXIT;
            var focusField = armOn ? leaveForm.elements.destination : leaveForm.elements.reason;
            if (focusField) focusField.focus();
          }
          return;
        }
        var reasonBtn = event.target.closest("[data-action='pick-reason']");
        if (reasonBtn) {
          var reasonForm = reasonBtn.closest("form");
          var reasonInput = reasonForm && reasonForm.elements.reason;
          if (reasonInput) {
            reasonInput.value = reasonBtn.getAttribute("data-reason") || "";
            reasonInput.focus();
          }
          var picks = reasonForm ? reasonForm.querySelectorAll(".reason-pick") : [];
          for (var pickIndex = 0; pickIndex < picks.length; pickIndex++) {
            picks[pickIndex].classList.toggle("is-on", picks[pickIndex] === reasonBtn);
          }
          return;
        }
        var transferBtn = event.target.closest("[data-action='open-transfer']");
        if (transferBtn) {
          var transferKey = transferBtn.getAttribute("data-key");
          if (transferKey) state.selectedKey = transferKey;
          openTransfer();
          return;
        }
        var postedBtn = event.target.closest("[data-action='open-posted']");
        if (postedBtn) {
          openPosted(postedBtn.getAttribute("data-key"));
          return;
        }
        var unassignedBtn = event.target.closest("[data-action='open-unassigned']");
        if (unassignedBtn) {
          openUnassigned(unassignedBtn.getAttribute("data-key") || "");
          return;
        }
        if (state.unitsHome) {
          if (event.target.closest("[data-action='cancel-unit']")) {
            closeUnitEditor();
            render();
            return;
          }
          if (event.target.closest("[data-action='add-unit']")) {
            closeUnitEditor();
            state.unitEdit = "new";
            state.unitDraft = blankUnitDraft();
            state.unitError = "";
            render({ focusUnit: true });
            return;
          }
          var colorBtn = event.target.closest("[data-action='pick-color']");
          if (colorBtn) {
            var colorId = colorBtn.getAttribute("data-unit");
            var nextColor = state.colorUnit === colorId ? "" : colorId;
            state.unitEdit = "";
            state.unitDraft = null;
            state.unitError = "";
            state.colorUnit = nextColor;
            render({ focusPalette: Boolean(nextColor) });
            return;
          }
          var setColorBtn = event.target.closest("[data-action='set-color']");
          if (setColorBtn) {
            setUnitColor(setColorBtn.getAttribute("data-unit"), setColorBtn.getAttribute("data-color") || "");
            render();
            return;
          }
          var editBtn = event.target.closest("[data-action='edit-unit']");
          if (editBtn) {
            openUnitEditor(editBtn.getAttribute("data-unit"), editBtn);
            return;
          }
          if (event.target.closest("[data-action='delete-unit']")) {
            var deleteForm = event.target.closest(".unit-edit");
            deleteUnit(deleteForm && deleteForm.getAttribute("data-unit"));
            return;
          }
          var shalishutBtn = event.target.closest("[data-action='open-shalishut']");
          if (shalishutBtn) {
            enterUnit(shalishutBtn.getAttribute("data-unit"), { shalishut: true });
            return;
          }
          var releasedBtn = event.target.closest("[data-action='open-released']");
          if (releasedBtn) {
            enterReleased(releasedBtn.getAttribute("data-unit"));
            return;
          }
          var openBtn = event.target.closest("[data-action='open-unit']");
          if (openBtn) beginEnterUnit(openBtn.getAttribute("data-unit"));
          return;
        }
        var clearPhoto = event.target.closest("[data-action='clear-photo']");
        if (clearPhoto) {
          setSoldierPhoto(clearPhoto.getAttribute("data-key") || "", "");
          return;
        }
        var soldierEdit = event.target.closest("[data-action='edit-soldier']");
        if (soldierEdit) {
          var soldierKey = soldierEdit.getAttribute("data-key");
          if (soldierKey) state.selectedKey = soldierKey;
          openSoldierEditor();
          return;
        }
        if (event.target.closest("[data-action='edit-shalishut']")) {
          var unit = currentUnit();
          state.shalishutDraft = null;
          state.editingShalishut = true;
          state.shalishutError = "";
          state.shalishutDraft = shalishutValue(unit);
          state.shalishutOpen = true;
          state.profileOpen = true;
          render({ focusShalishut: true });
          return;
        }
        if (event.target.closest("[data-action='cancel-shalishut']")) {
          closeShalishutEditor();
          render();
          return;
        }
        if (event.target.closest("[data-action='cancel-new']")) {
          closeCreator();
          return;
        }
        if (event.target.closest("[data-action='delete-soldier']")) {
          deleteEditingSoldier();
          return;
        }
        if (event.target.closest("[data-action='clear']")) {
          clearFilters();
          return;
        }
        if (event.target.closest("[data-action='back']")) {
          state.profileOpen = false;
          state.shalishutOpen = false;
          closeShalishutEditor();
          syncShell();
          var current = document.querySelector("#list .person[aria-current='true']");
          if (current) current.focus();
          return;
        }
        var copyBtn = event.target.closest("[data-action='copy']");
        if (!copyBtn) return;
        var label = copyBtn.querySelector(".btn-label");
        var idleLabel = copyBtn.getAttribute("data-idle-label") || copyBtn.getAttribute("aria-label") || "העתק";
        copyText(copyBtn.getAttribute("data-copy") || "").then(function () {
          copyBtn.classList.add("is-copied");
          copyBtn.setAttribute("aria-label", "הועתק");
          if (label) label.textContent = "הועתק";
          window.setTimeout(function () {
            copyBtn.classList.remove("is-copied");
            copyBtn.setAttribute("aria-label", idleLabel);
            if (label) label.textContent = idleLabel;
          }, 1500);
        }, function () {
          copyBtn.setAttribute("aria-label", "לא הועתק");
          if (label) label.textContent = "לא הועתק";
          window.setTimeout(function () {
            copyBtn.setAttribute("aria-label", idleLabel);
            if (label) label.textContent = idleLabel;
          }, 1500);
        });
      });
      document.addEventListener("click", function (event) {
        if (event.target.closest && event.target.closest(".date-field")) return;
        closeDateFields();
      });
      document.getElementById("profile").addEventListener("scroll", function () {
        var openDate = document.querySelector(".date-field.is-open");
        if (openDate) placeDatePop(openDate);
      });
      window.addEventListener("resize", function () {
        var openDate = document.querySelector(".date-field.is-open");
        if (openDate) placeDatePop(openDate);
      });
      document.addEventListener("keydown", function (event) {
        var dateDay = event.target.closest && event.target.closest(".date-day");
        if (dateDay && (event.key === "ArrowRight" || event.key === "ArrowLeft" || event.key === "ArrowUp" || event.key === "ArrowDown")) {
          event.preventDefault();
          var dateDelta = event.key === "ArrowRight" ? -1 : event.key === "ArrowLeft" ? 1 : event.key === "ArrowUp" ? -7 : 7;
          moveDateFocus(dateDay, dateDelta);
          return;
        }
        var typing = event.target && (event.target.tagName === "INPUT" || event.target.tagName === "SELECT" || event.target.tagName === "TEXTAREA");
        if (event.key === "/" && !typing) {
          event.preventDefault();
          document.getElementById("search").focus();
          return;
        }
        if (event.key === "Escape" && document.querySelector(".date-field.is-open")) {
          var openDateField = document.querySelector(".date-field.is-open");
          closeDateField(openDateField);
          var dateTrigger = openDateField && openDateField.querySelector(".date-trigger");
          if (dateTrigger) dateTrigger.focus();
          return;
        }
        if (event.key === "Escape" && state.colorUnit) {
          state.colorUnit = "";
          render();
          return;
        }
        if (event.key === "Escape" && (state.unitOpen || state.unitEdit)) {
          if (state.unitEdit) closeUnitEditor();
          else state.unitOpen = false;
          render();
          return;
        }
        if (event.key === "Escape" && state.transferring) {
          closeTransfer();
          return;
        }
        if (event.key === "Escape" && state.logOpen) {
          closeLog();
          return;
        }
        if (event.key === "Escape" && state.editingShalishut) {
          closeShalishutEditor();
          render();
          return;
        }
        if (event.key === "Escape" && (state.creating || state.editingIndex >= 0)) {
          closeCreator();
          return;
        }
        if (event.key === "Escape" && document.body.classList.contains("profile-open")) {
          state.profileOpen = false;
          state.shalishutOpen = false;
          closeShalishutEditor();
          syncShell();
          return;
        }
        if ((event.key === "ArrowDown" || event.key === "ArrowUp") && !typing && !state.unitsHome) {
          event.preventDefault();
          moveSelection(event.key === "ArrowDown" ? 1 : -1);
        }
      });
      var mq = window.matchMedia("(max-width: 860px)");
      if (mq.addEventListener) mq.addEventListener("change", syncShell);
      render(state.unitsHome ? { intro: true } : {});
    }

    init();
  </script>
</body>
</html>
